version = 1

# Every Rust source file carries its own SPDX header. This file supplies the
# same copyright and licence information for everything else in the tree -
# documentation, Nix expressions, shell and Python scripts, workflow and config
# files, lockfiles, snapshots and assets - so `reuse lint` reports the whole
# repository as covered. Precedence is "closest" (the default), so a file's own
# SPDX header always wins over the catch-all below.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2025-2026 WitteShadovv"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The graphical-interface crate is licensed GPL-3.0-only rather than the tree's
# GPL-3.0-or-later. When more than one table matches a file, the last matching
# table wins, not the one with the longer path, so this table must stay below
# the catch-all to cover everything under gui/, its lockfile too.
[[annotations]]
path = "gui/**"
SPDX-FileCopyrightText = "2025-2026 WitteShadovv"
SPDX-License-Identifier = "GPL-3.0-only"

# gui/patches/i-slint-backend-winit is Slint's own crate of that name as
# SixtyFPS GmbH publishes it, with changes of the window's, each marked
# "NAILS:" in place (see gui/Cargo.toml). SixtyFPS offers it under GPL-3.0-only or under
# licences of its own, and the window takes it, as it takes all of Slint,
# under GPL-3.0-only. The override leaves the copied files as they were
# published: their headers name every licence on offer, whose texts the copy
# keeps in its own LICENSES directory. The last matching table wins, so these
# stay below the gui/ one, and the table of the files the change touches
# below that of the copy.
[[annotations]]
path = "gui/patches/i-slint-backend-winit/**"
precedence = "override"
SPDX-FileCopyrightText = "SixtyFPS GmbH <info@slint.dev>"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
    "gui/patches/i-slint-backend-winit/Cargo.toml",
    "gui/patches/i-slint-backend-winit/xdg_desktop_settings.rs",
]
precedence = "override"
SPDX-FileCopyrightText = ["SixtyFPS GmbH <info@slint.dev>", "2026 WitteShadovv"]
SPDX-License-Identifier = "GPL-3.0-only"

# The locate-database check's unit tests read files that distributions ship,
# copied unchanged, so that the check is tested on what decoys hold; the tests
# name the package each is taken from. Each stays under the licence of the
# packaging it comes from. Like the tables below, these come after the
# catch-all, because the last matching annotation wins.
#
# Debian's and Ubuntu's plocate packaging, and a unit plocate's own build
# writes, as Fedora installs it.
[[annotations]]
path = [
    "nails-core/src/preflight/checks/locate_database/fixtures/debian-13-*",
    "nails-core/src/preflight/checks/locate_database/fixtures/ubuntu-26.04-*",
    "nails-core/src/preflight/checks/locate_database/fixtures/fedora-44-plocate-updatedb.service",
]
SPDX-FileCopyrightText = "2020 Steinar H. Gunderson"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Fedora's updatedb.conf, which its plocate.spec writes; Fedora's spec files
# are under the MIT licence.
[[annotations]]
path = "nails-core/src/preflight/checks/locate_database/fixtures/fedora-44-updatedb.conf"
SPDX-FileCopyrightText = "Fedora Project contributors"
SPDX-License-Identifier = "MIT"

# Arch Linux's updatedb.conf, from its plocate package sources, which Arch
# Linux licenses as 0BSD.
[[annotations]]
path = "nails-core/src/preflight/checks/locate_database/fixtures/arch-updatedb.conf"
SPDX-FileCopyrightText = "Arch Linux Contributors"
SPDX-License-Identifier = "0BSD"

# The apt configuration files the apt_conf reader's and the
# decoy-persistence check's unit tests read, and the apt_conf fuzz target's
# seeds, copied unchanged from the packages that install them in
# /etc/apt/apt.conf.d: unattended-upgrades' data/50unattended-upgrades.Debian
# and .Ubuntu and its data/20auto-upgrades, and apt's
# debian/apt.conf.autoremove. Each stays under the licence of its package.
[[annotations]]
path = [
    "nails-base/src/packages/fixtures/apt/*-50unattended-upgrades",
    "nails-base/src/packages/fixtures/apt/20auto-upgrades",
    "fuzz/seeds/apt_conf/*-50unattended-upgrades",
    "fuzz/seeds/apt_conf/20auto-upgrades",
]
SPDX-FileCopyrightText = [
    "2005-2018 Michael Vogt",
    "2017-2018 Balint Reczey",
    "2005-2018 Canonical Ltd",
]
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = [
    "nails-base/src/packages/fixtures/apt/01autoremove",
    "fuzz/seeds/apt_conf/01autoremove",
]
SPDX-FileCopyrightText = "1997-1999 Jason Gunthorpe and others"
SPDX-License-Identifier = "GPL-2.0-or-later"

# The EFF "large" diceware word list is third-party data under its own licence,
# not the project's. The last matching table wins, so this one must stay below
# the catch-all.
[[annotations]]
path = "setup/nails-setup/data/eff_large_wordlist.txt"
SPDX-FileCopyrightText = "2016 Electronic Frontier Foundation"
SPDX-License-Identifier = "CC-BY-4.0"

# supply-chain/imports.lock is third-party data as well: cargo-vet copies into
# it the audit records, reviewer names and notes included, of the public audit
# sets that supply-chain/config.toml imports. Each set stays under the licence
# of the repository that publishes it:
#
#   bytecodealliance/wasmtime     Apache-2.0 WITH LLVM-exception
#   EmbarkStudios/rust-ecosystem  Apache-2.0 OR MIT
#   google/supply-chain           Apache-2.0
#   divviup/libprio-rs            MPL-2.0
#   mozilla/supply-chain          Apache-2.0 OR MIT
#   zcash/rust-ecosystem          Apache-2.0 OR MIT
#
# The Google, Mozilla and Zcash sets are each gathered from other repositories
# of the same publisher; the licence above is that of the gathered set, which
# is what cargo-vet imports. The holders below are in the same order, each as
# the repository's licence file names it; the wasmtime and Google licence files
# name no holder, so wasmtime's name for its authors and Google LLC stand in. A
# new import needs its licence and holder added here. Like the word list, this
# comes after the catch-all, because the last matching annotation wins.
#
# The gui/ workspace's store imports the same sets, and cargo-vet copies their
# records into gui/supply-chain/imports.lock as soon as a crate they audit
# joins that graph, so the file is covered here from the start. This table
# also comes after the gui/ one.
[[annotations]]
path = ["supply-chain/imports.lock", "gui/supply-chain/imports.lock"]
SPDX-FileCopyrightText = [
    "The Wasmtime Project Developers",
    "2019 Embark Studios",
    "Google LLC",
    "2021 ISRG",
    "2022 Bobby Holley",
    "2022 The Zcash developers",
]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception AND (Apache-2.0 OR MIT) AND Apache-2.0 AND MPL-2.0"
