[package]
name = "nails-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The configuration-aware parts of the nails whole-root session: entry, fstab policy, way back, persona and runtime units"
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
# Never publish to a registry; see nails-core/Cargo.toml.
publish = false

[lints]
workspace = true

[lib]
name = "nails_session"
path = "src/lib.rs"

[features]
# The test-only hooks; forwards to the crates below. Off by default, see
# nails-core/Cargo.toml.
test-hooks = ["nails-base/test-hooks", "nails-platform/test-hooks"]
# The test fixtures of the crates below, for this crate's test builds.
test-support = ["nails-base/test-support", "nails-platform/test-support"]

[dependencies]
nails-base = { path = "../nails-base" }
nails-platform = { path = "../nails-platform" }
# The session plan, the next root, the transition and the hot path.
nails-teardown = { path = "../nails-teardown" }
rustix = { workspace = true, features = ["fs", "mount", "process"] }
toml = { workspace = true }
tracing = { workspace = true }
# The sleep guard's logind inhibitor over D-Bus.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = { workspace = true }
# Self dev-dependency, as in nails-core: the test-only hooks and fixtures for
# this crate's own tests.
nails-session = { path = ".", features = ["test-hooks", "test-support"] }
