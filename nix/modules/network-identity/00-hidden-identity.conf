# NetworkManager drop-in for the hidden session's network identity on an FHS
# (Debian/Ubuntu/Fedora/Arch) host.
#
# Install as /etc/NetworkManager/conf.d/00-hidden-identity.conf on the HIDDEN
# system layer so it is present when the hidden session's NetworkManager starts,
# then reload with `nmcli general reload` or restart NetworkManager. Like the
# NixOS module it only takes effect once the hidden configuration is in place
# before the session restarts; the overlay alone cannot change these identifiers.
#
# Randomise MAC addresses so the hidden session does not reuse the decoy's
# hardware addresses on the network.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# Do not auto-connect saved VPNs in the hidden session.
vpn.autoconnect=false
