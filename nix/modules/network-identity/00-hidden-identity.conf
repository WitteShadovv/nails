# NetworkManager drop-in for the hidden session's network identity on an FHS
# (Debian/Ubuntu/Fedora/Arch) host.
#
# Install it as /etc/NetworkManager/conf.d/00-hidden-identity.conf from inside
# a hidden session, where it lands in the hidden upper and the decoy never sees
# it, then reload with `nmcli general reload` or restart NetworkManager. Every
# later hidden session's NetworkManager reads it when it starts; the overlay
# alone cannot change these identifiers.
#
# The way back to the decoy sets each device's MAC address back to the decoy's,
# taking the device down for the change when its driver refuses it while the
# device is up. A device whose address it still cannot set back keeps the random
# one until power-off (a device keeps its current MAC address when the decoy's
# profile sets none), and nothing tells you so. When the random address must
# never reach the decoy, end a session that used this drop-in with
# `nails deactivate --poweroff` (or `nails emergency --poweroff`).
#
# Randomise MAC addresses so the hidden session does not reuse the decoy's
# hardware addresses on the network.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# NetworkManager has no global VPN autoconnect default, so a key for it here
# would be ignored. Disable autoconnect per VPN profile from the hidden session
# instead (see "Shared network identifiers" in docs/operator-guide.md).
