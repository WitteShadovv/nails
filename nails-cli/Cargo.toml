[package]
name = "nails-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for the nails overlay environment manager"
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["nixos", "anti-forensics", "security", "privacy", "veracrypt"]
categories = ["command-line-utilities"]

[lib]
name = "nails"
path = "src/lib.rs"

[[bin]]
name = "nails"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
clap = { workspace = true, features = ["derive", "cargo"] }
colored = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true }
chrono = { workspace = true }

# Core library
nails-core = { path = "../nails-core" }

[dev-dependencies]
# Workspace testing dependencies
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
# Compile the attach-gate test hooks into nails-core for test builds only, so the
# CLI's integration tests can drive file logging against temp directories. The
# shipped binary (`cargo build`) never pulls in dev-dependencies, so the hooks
# stay out of release builds.
nails-core = { path = "../nails-core", features = ["afs-test-hooks-compile-time"] }

[[bench]]
name = "startup"
harness = false
