[package]
name = "nails-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for the nails overlay environment manager"
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["nixos", "anti-forensics", "security", "privacy", "veracrypt"]
categories = ["command-line-utilities"]

[lib]
name = "nails"
path = "src/lib.rs"

[[bin]]
name = "nails"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
clap = { workspace = true, features = ["derive", "cargo"] }
colored = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true }
chrono = { workspace = true }

# Core library
nails-core = { path = "../nails-core" }

[dev-dependencies]
# Workspace testing dependencies
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
# Pull in nails-core's test-only extras for the CLI test/bench builds. The
# shipped binary (`cargo build`) never pulls in dev-dependencies, so neither
# feature reaches release builds:
#   - afs-test-hooks-compile-time: compile the attach-gate test hooks so the
#     integration tests can drive file logging against temp directories.
#   - test-support: the shared test fixtures (`Config::test_default`, `TestWorld`).
nails-core = { path = "../nails-core", features = [
    "afs-test-hooks-compile-time",
    "test-support",
] }

[[bench]]
name = "startup"
harness = false
