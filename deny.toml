# cargo-deny configuration for NAILS
# NAILS: run a hidden session on a decoy Linux system
#
# This configuration enforces dependency policies for a security-critical,
# GPL-3.0 licensed Rust application.
#
# The policy is checked at two scopes, both defined in the justfile (the tools
# come from `nix develop`):
#
#   just deny        The shipped graph: the x86_64 Linux release targets
#                    without dev-dependencies. This is the merge gate in CI.
#   just deny-full   Every target and every dev-dependency. Runs weekly in
#                    .github/workflows/scheduled.yml and never blocks a merge.
#
# Both take the checks to run, e.g. `just deny advisories`. A plain
# `cargo deny check` uses the full scope.
#
# The scope is chosen on the command line rather than in a [graph] section:
# `--target` replaces a configured target list and there is no value meaning
# "every target", so a target list here would also hide wasm-only and
# other-platform crates from the full scan.

# =============================================================================
# ADVISORIES
# =============================================================================
# Known vulnerabilities, unmaintained crates, unsound APIs and yanked releases.
# The advisory database is cargo-deny's default: RustSec, cloned under
# $CARGO_HOME/advisory-dbs.

[advisories]
# SECURITY-CRITICAL: vulnerability advisories always fail, at any depth.
# Unmaintained and unsound advisories fail for transitive dependencies too.
# Crates that never ship are left out by the graph scope of `just deny`, not
# by narrowing these settings, so `just deny-full` still reports them.
# `unsound` needs cargo-deny 0.19 or newer.
unmaintained = "all"
unsound = "all"

# SECURITY-CRITICAL: Fail on yanked crates (often yanked due to issues)
yanked = "deny"

# Advisories to ignore. Use sparingly: every entry needs a reason and a
# "# expires: YYYY-MM-DD" line in the comment block directly above it, at most
# 180 days ahead, so the exception is re-evaluated before it goes stale.
# ci/deny_ignores.py enforces this. For example:
#
#   ignore = [
#       # Only reachable from the benchmarks; drop once criterion updates.
#       # expires: 2027-01-31
#       { id = "RUSTSEC-0000-0000", reason = "dev-only, never shipped" },
#   ]

# zvariant, zbus_names and zvariant_derive are unmaintained because zbus 6.0.0
# (2026-10-16) took them in: zvariant as its `wire` module, zbus_names as its
# `names` module, and the derive macros with them. RustSec lists no patched
# version because the remedy is no new release of these crates but a move to
# zbus 6. Only zbus 5, a direct dependency of nails-session, pulls them in,
# so the fix is ours to make: move nails-session to zbus 6. That is a port, not
# a version bump: zbus 6 removes the blocking API the sleep guard and its tests
# use (synchronous code runs the async API through zbus::block_on) and replaces
# the async-io feature with default-rt. Make the move, or record why it still
# waits, by the expiry below.
ignore = [
    # zvariant: part of zbus 6 as zbus::wire; gone once nails-session moves.
    # expires: 2027-01-31
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, merged into zbus 6; fixed by moving nails-session from zbus 5 to 6" },
    # zbus_names: part of zbus 6 as zbus::names; gone once nails-session moves.
    # expires: 2027-01-31
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, merged into zbus 6; fixed by moving nails-session from zbus 5 to 6" },
    # zvariant_derive: its macros are part of zbus 6; gone once nails-session
    # moves.
    # expires: 2027-01-31
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, merged into zbus 6; fixed by moving nails-session from zbus 5 to 6" },
]

# =============================================================================
# LICENSES
# =============================================================================
# License compliance checking for GPL-3.0 compatibility
# NAILS is GPL-3.0 licensed, so we need GPL-compatible dependencies

[licenses]
# Confidence threshold for license detection (0.0 to 1.0)
# 0.8 is a good balance between accuracy and flexibility
confidence-threshold = 0.8

# List of explicitly allowed licenses
# These are all GPL-3.0 compatible licenses
# Only licenses actually used by current dependencies are listed to reduce noise
allow = [
    # Our project license
    "GPL-3.0-or-later",

    # Permissive licenses (used by most Rust crates)
    "MIT",
    "Apache-2.0",

    # Public domain (used in some crates)
    "Unlicense",

    # Weak copyleft (compatible with GPL)
    "MPL-2.0",

    # Unicode license (common in text processing crates)
    "Unicode-3.0",

    # Permissive and GPL-compatible (FSF license list). foldhash, the default
    # hasher of hashbrown, which the dev-only jsonschema pulls in.
    "Zlib",
]

# Deny any license not in the allow list
# This is the default behavior when 'allow' is specified

# Private crates that don't need license checking (our own workspace crates)
[licenses.private]
ignore = true
registries = []

# =============================================================================
# BANS
# =============================================================================
# Dependency bans for problematic or unwanted crates

[bans]
# Warn on multiple versions of the same crate (indicates version conflicts)
# Using 'warn' instead of 'deny' because transitive deps sometimes cause this
multiple-versions = "warn"

# SECURITY-CRITICAL: Deny wildcard dependencies (unpredictable versions)
# Allow wildcards for workspace crates (they're version-locked in the workspace)
wildcards = "allow"
allow-wildcard-paths = true

# Highlight the crates that are causing multiple versions
highlight = "all"

# Workspace crate handling
workspace-default-features = "allow"
external-default-features = "allow"

# Allow specific duplicates that are known and acceptable
# Document why each skip is needed
skip = []

# Tree of crates to skip completely (including all transitive deps)
skip-tree = []

# Banned crates - these should never appear in the dependency tree
# SECURITY: Block crates known to have security issues or alternatives
deny = [
    # Prefer rustls over openssl for TLS (pure Rust, no C dependencies)
    # Uncomment if project uses TLS and you want to enforce rustls
    # { name = "openssl", wrappers = ["openssl-sys"] },
    # { name = "openssl-sys" },

    # Block crates with known unfixable security issues
    # Add entries as needed based on security advisories
]

# =============================================================================
# SOURCES
# =============================================================================
# Restrict where crates can be fetched from

[sources]
# SECURITY-CRITICAL: Only allow crates from crates.io
# This prevents supply chain attacks from unknown registries
unknown-registry = "deny"

# SECURITY-CRITICAL: Deny git dependencies in production
# Git dependencies can change without version bumps
unknown-git = "deny"

# List of allowed registries (only crates.io by default)
[sources.allow-org]
# crates.io is implicitly allowed

# Allow specific git repositories if needed (use sparingly)
# Example: allow-git = ["https://github.com/example/repo"]
# allow-git = []

# Allow specific organizations' git repos
# Example: github = ["rust-lang", "tokio-rs"]
