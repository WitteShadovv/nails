# cargo-tarpaulin configuration for NAILS project
# This configuration enforces 100% test coverage and provides detailed reports

[report]
# Output formats: Html (visual), Lcov (CI), Json (automation)
out = ["Html", "Lcov", "Json"]
# Output directory for coverage reports
output-dir = "coverage/"

[run]
# Exclude test files from coverage calculation (they're not production code)
exclude-files = ["tests/*", "benches/*", "*/tests/*", "*/benches/*"]

# Ignore panics in coverage (panics indicate test bugs, not uncovered code)
ignore-panics = true

# Run tests multiple times for reliability (helps catch flaky tests)
count = true

# Test all features to ensure complete coverage
all-features = true

# FAIL if coverage drops below 100% - this is mandatory for security-critical system
fail-under = 100.0

[files]
# Only include src/ directories in coverage (exclude docs, examples, etc.)
include = ["nails-cli/src/*", "nails-core/src/*"]
exclude = ["*/src/main.rs"]  # CLI entry point excluded (tested via integration tests)
