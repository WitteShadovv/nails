# A plain cargo build for musl links the musl that ships with the Rust
# toolchain. The release build in flake.nix links nixpkgs' musl instead
# (-C link-self-contained=no), which needs a musl C toolchain as the linker.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-Wl,--build-id=none"]
