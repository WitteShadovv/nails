[package]
name = "nails-teardown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Emergency teardown interpreter and RAM teardown plan for the nails overlay environment manager"
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
# Never publish to a registry; see nails-core/Cargo.toml.
publish = false

[lints]
workspace = true

[features]
# Exposes the test helpers (`test_support`) to the test code of the crates
# above; nails-base's `test-support` turns it on. Off by default, so none of it
# reaches a shipped binary, and it adds no dependency.
test-support = []

# The dependency boundary of the emergency hot path. This crate must never
# depend on another NAILS crate (their config, state, manager, process
# runner) or on tracing: everything the panic path runs is in this crate and
# these four dependencies. `cargo tree -p nails-teardown` is the whole review
# surface, and this crate's `boundary` test fails if a dependency is added here.
[dependencies]
rustix = { workspace = true, features = ["fs", "mount", "process", "system", "thread", "time"] }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
