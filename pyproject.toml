[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nails"
version = "0.1.0"
description = "NixOS Anti-forensics Isolation & Layering System"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "NAILS Project"}
]
maintainers = [
    {name = "NAILS Project"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Operating System",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Environment :: Console",
]
keywords = [
    "nixos",
    "anti-forensics",
    "veracrypt",
    "plausible-deniability",
    "security",
    "privacy",
    "overlay-filesystem"
]
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "bandit[toml]>=1.7.5",
]
build = [
    "build>=0.10.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
nails = "nails:main"

[project.urls]
Homepage = "https://github.com/nails-project/nails"
Repository = "https://github.com/nails-project/nails"
Documentation = "https://github.com/nails-project/nails/blob/main/README.md"
"Bug Reports" = "https://github.com/nails-project/nails/issues"

[tool.setuptools]
packages = ["nails"]

[tool.setuptools.package-data]
nails = ["templates/*", "config/*"]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S602",   # subprocess-popen-with-shell-equals-true (needed for shell commands)
    "S603",   # subprocess-untrusted-input (we validate inputs)
    "S607",   # starting-process-with-partial-path (system tools like mount)
    "T201",   # print found (allowed for CLI output)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]  # Allow assert and hardcoded passwords in tests
"**/cli.py" = ["T201"]        # Allow prints in CLI
"setup-*.sh" = ["S"]          # Skip bandit for shell scripts

[tool.ruff.isort]
known-first-party = ["nails"]
force-single-line = false

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "psutil.*",
    "yaml.*",
]
ignore_missing_imports = true

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = [
    "B101",  # assert_used (used in tests)
    "B603",  # subprocess_without_shell_equals_true (we need shell commands)
]

[tool.bandit.assert_used]
skips = ["**/test_*.py", "**/conftest.py"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=nails",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security-focused tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["nails"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Vulture (dead code detection) configuration
[tool.vulture]
min_confidence = 80
paths = ["nails", "tests"]
exclude = ["venv", ".venv", "build", "dist"]
ignore_decorators = ["@app.route", "@require_*"]
ignore_names = ["_*", "setUp", "tearDown"]
