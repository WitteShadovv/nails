# Lint and type-check configuration for the repository's Python. There is no
# build backend here; nothing is packaged or published (the in-VM helper
# package under nix/e2e-tests/py carries its own build metadata). CI passes the
# paths to check explicitly: the `ci-python` flake check and `just ci-python`
# gate the ci/ package (`ruff check ci`, `mypy ci`), and the `e2e-helpers` check
# gates the nails_e2e helper package the same way. The stand-alone scripts/ join
# once the forensics runners that still fail ruff are removed.

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "W",  # pycodestyle warnings
  "I",  # import sorting
  "UP", # pyupgrade
  "B",  # flake8-bugbear
]

[tool.mypy]
python_version = "3.11"
# Non-strict: catch obvious mistakes without demanding annotations everywhere.
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
