[package]
name = "nails-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Orchestration and facade of the nails libraries: the session manager, the pre-flight registry and status"
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["nixos", "anti-forensics", "security", "privacy", "veracrypt"]
categories = ["filesystem", "os::linux-apis"]
# Never publish to a registry. A crate on crates.io is a permanent, indexed
# public record that the tool exists and was built; installing from one would
# also leave its traces on the decoy. See docs/distribution.md.
publish = false

[lints]
workspace = true

[lib]
name = "nails_core"
path = "src/lib.rs"

[features]
# The single switch for every test-only hook and heuristic bypass: the runtime
# host-interaction skip, the attach-gate device-check bypass (keyed on
# NAILS_TEST_FORCE_ATTACHED), the activation/deactivation gates, the reboot and
# systemctl path overrides, the shell-cleanup protected-PID handoff and the
# service exemption. Off by default, so none of these hooks (nor the NAILS_TEST_*
# environment strings) exist in a shipped binary. This crate's own unit tests get
# it implicitly through cfg(test); integration tests, nails-cli and the packaged
# nails-e2e build turn it on through this feature.
test-hooks = [
    "nails-base/test-hooks",
    "nails-platform/test-hooks",
    "nails-session/test-hooks",
    "nails-forensics/test-hooks",
]
# Exposes the in-crate test fixtures (`Config::test_default`, `TestWorld`) to
# downstream test code in `nails-cli` and this crate's integration tests. Off by
# default; the fixtures also compile for this crate's own tests via `cfg(test)`.
test-support = [
    "nails-base/test-support",
    "nails-platform/test-support",
    "nails-session/test-support",
    "nails-forensics/test-support",
]

[dependencies]
# Use workspace versions for consistency
tracing = { workspace = true }
nix = { workspace = true, features = ["mount", "sched", "user", "signal", "process", "fs", "resource"] }
rustix = { workspace = true, features = ["fs", "process", "mount", "thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
# The foundation: errors, the filesystem and process seams, configuration,
# state, the artifact registry and the pre-flight framework.
nails-base = { path = "../nails-base" }
# Host detection, the platform backends and the NixOS configuration layer.
nails-platform = { path = "../nails-platform" }
# The configuration-aware parts of the whole-root session.
nails-session = { path = "../nails-session" }
# Verification, the examiner's view, the residue catalog and rehearse.
nails-forensics = { path = "../nails-forensics" }
# The whole-root session mechanics: the plan format, the mountinfo parser,
# the transition and the emergency hot path.
nails-teardown = { path = "../nails-teardown" }

[dev-dependencies]
# Workspace testing dependencies
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
tracing-test = "0.2.5"
criterion = { version = "0.8", features = ["html_reports"] }
# Self dev-dependency: turns the test-only hooks on for this crate's integration
# tests (`tests/`), examples and benches, which compile the library as a plain
# dependency without `cfg(test)`. The shipped library never pulls in
# dev-dependencies, so the hooks still stay out of release builds.
nails-core = { path = ".", features = ["test-hooks", "test-support"] }

[[bench]]
name = "performance"
harness = false
