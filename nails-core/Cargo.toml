[package]
name = "nails-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for the nails overlay environment manager"
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["nixos", "anti-forensics", "security", "privacy", "veracrypt"]
categories = ["filesystem", "os::linux-apis"]

[lib]
name = "nails_core"
path = "src/lib.rs"

[features]
# Compile in test-only escape hatches (such as the attach-gate device-check
# bypass keyed on NAILS_TEST_FORCE_ATTACHED) so integration tests can exercise
# real write paths against temp directories. Off in release builds, so the
# hooks never exist in a shipped binary.
afs-test-hooks-compile-time = []

[dependencies]
# Use workspace versions for consistency
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { workspace = true, features = ["mount", "sched", "user", "signal", "process", "fs"] }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
colored = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Workspace testing dependencies
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
tracing-test = "0.2.5"
serial_test = "3.5"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "performance"
harness = false
