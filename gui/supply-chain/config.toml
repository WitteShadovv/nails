
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.bitflags]]
version = "2.13.2"
criteria = "safe-to-deploy"
notes = "Not audited by this project, and no imported audit covers 2.13.2. It is in the window through rustix (the window's handling of its standard input). Exempted at this version only, so a new version needs an audit or a new exemption."

[[exemptions.itoa]]
version = "1.0.18"
criteria = "safe-to-deploy"
notes = "Not audited by this project, and no imported audit covers 1.0.18. It is in the window through nails-api (the wire contract with the engine) and serde_json (the JSON of the protocol with the engine). Exempted at this version only, so a new version needs an audit or a new exemption."

[[exemptions.libc]]
version = "0.2.189"
criteria = "safe-to-deploy"
notes = "Not audited by this project: 0.2.189 is the base of the imported delta audits that reach 0.2.190, the version in the lock, and this exemption stands for 0.2.189 itself. It is in the window through rustix (the window's handling of its standard input)."

