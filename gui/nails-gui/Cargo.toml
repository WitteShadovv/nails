[package]
name = "nails-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The window of NAILS: a front end that drives the engine through its root helper"
homepage.workspace = true
repository.workspace = true
# Never published to a registry; distributed only with NAILS.
publish = false

[lints]
workspace = true

[features]
# Compiles the element tree's names and types into the window, which the
# headless UI tests read to find elements and check their accessible names. A
# release build leaves it out; the tests that need it name it.
testing = []

[dependencies]
# The wire contract with the engine's helper, from the engine's own tree: the
# requests, frames, events and plan data, so the two ends cannot disagree on
# a shape. It depends on serde and serde_json alone.
nails-api = { path = "../../nails-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Puts /dev/null in place of standard input once the window took the
# launcher's socket off it, so that closing the window's end closes every copy
# of it; gives the process its neutral name and its limits (core dumps,
# dumpable, no_new_privs); checks that the runtime directory is a tmpfs; and
# lets the emergency write its request without waiting on a full pipe
# (`send` with MSG_DONTWAIT). Already in the toolkit's graph (Wayland, X11 and
# the event loop).
rustix = { version = "1.1.5", default-features = false, features = [
    "std",
    "stdio",
    "thread",
    "process",
    "fs",
    "net",
] }
# The toolkit, pinned exactly as its own crates pin each other. Only the
# software renderer (no GL, no Vulkan, no shader cache) and the winit backend
# for X11 and Wayland, with AccessKit for the screen reader. The winit backend
# is the patched copy in gui/patches (see gui/Cargo.toml), which builds winit
# without sctk-adwaita. winit still builds its Wayland client-side frame and
# hides it, since the window has no frame (no-frame), but that frame is now
# smithay's fallback frame, which starts no program, so the toolkit starts none
# on either. Both talk on the session bus at every start. AccessKit asks the
# accessibility bus whether a screen reader listens, which starts at-spi's bus
# launcher through D-Bus activation where it does not run: that is the screen
# reader's way in, and AccessKit has no read that starts nothing. The winit
# backend reads the desktop's appearance (light or dark, accent colour, font
# size, cursor blink) from the settings portal and follows its changes, with
# NO_AUTO_START: where xdg-desktop-portal is not running it is not started, and
# the window keeps Slint's defaults.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }
# Not used directly: named so that the font library Slint uses opens
# fontconfig at run time instead of linking it. The window then builds
# without fontconfig's headers, and every library it loads comes from the
# same search path, whether the system's or a bundle's.
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }

# The window's program is called "session", as its app id and its title are:
# the name a process list shows, and the application name an accessibility
# tool lists, which AccessKit takes from the program's file name.
[[bin]]
name = "session"
path = "src/main.rs"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
# Slint's headless platform: no display, fixed font metrics, and the element
# queries the UI tests make. It does not follow semver, so it is pinned with
# the toolkit.
i-slint-backend-testing = "=1.18.1"

# The UI tests query the element tree, which only the `testing` feature
# compiles in; without it they are not built.
[[test]]
name = "a11y"
required-features = ["testing"]

[[test]]
name = "views"
required-features = ["testing"]

[[test]]
name = "keyboard"
required-features = ["testing"]

[[test]]
name = "activation"
required-features = ["testing"]

[[test]]
name = "deactivation"
required-features = ["testing"]

[[test]]
name = "emergency"
required-features = ["testing"]

[[test]]
name = "emergency_wired"
required-features = ["testing"]

[[test]]
name = "switch"
required-features = ["testing"]

[[test]]
name = "flows_wired"
required-features = ["testing"]

[[test]]
name = "tools"
required-features = ["testing"]

[[test]]
name = "tools_wired"
required-features = ["testing"]

[[test]]
name = "emergency_long_request"
required-features = ["testing"]

[[test]]
name = "settings"
required-features = ["testing"]

[[test]]
name = "settings_wired"
required-features = ["testing"]
