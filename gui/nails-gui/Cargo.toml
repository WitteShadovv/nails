[package]
name = "nails-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The window of NAILS: a front end that drives the engine through its root helper"
homepage.workspace = true
repository.workspace = true
# Never published to a registry; distributed only with NAILS.
publish = false

[lints]
workspace = true

[features]
# Compiles the element tree's names and types into the window, which the
# headless UI tests read to find elements and check their accessible names. A
# release build leaves it out; the tests that need it name it.
testing = []

[dependencies]
# The wire contract with the engine's helper, from the engine's own tree: the
# requests, frames, events and plan data, so the two ends cannot disagree on
# a shape. It depends on serde and serde_json alone.
nails-api = { path = "../../nails-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Puts /dev/null in place of standard input once the window took the
# launcher's socket off it, so that closing the window's end closes every copy
# of it; gives the process its neutral name and its limits (core dumps,
# dumpable, no_new_privs); and checks that the runtime directory is a tmpfs.
# Already in the toolkit's graph (Wayland, X11 and the event loop).
rustix = { version = "1.1.5", default-features = false, features = [
    "std",
    "stdio",
    "thread",
    "process",
    "fs",
] }
# The toolkit, pinned exactly as its own crates pin each other. Only the
# software renderer (no GL, no Vulkan, no shader cache) and the winit backend
# for X11 and Wayland, with AccessKit for the screen reader. Both talk on the
# session bus: AccessKit to find the accessibility bus, and the winit backend,
# at every start, to read the desktop's appearance (light or dark, accent
# colour, font size, cursor blink) from the settings portal and follow its
# changes. No feature or variable of Slint 1.18 turns that read off, and
# AccessKit needs the same bus; where xdg-desktop-portal is not running, the
# read starts it through D-Bus activation.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }
# Not used directly: named so that the font library Slint uses opens
# fontconfig at run time instead of linking it. The window then builds
# without fontconfig's headers, and every library it loads comes from the
# same search path, whether the system's or a bundle's.
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }

# The window's program is called "session", as its app id and its title are:
# the name a process list shows, and the application name an accessibility
# tool lists, which AccessKit takes from the program's file name.
[[bin]]
name = "session"
path = "src/main.rs"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
# Slint's headless platform: no display, fixed font metrics, and the element
# queries the UI tests make. It does not follow semver, so it is pinned with
# the toolkit.
i-slint-backend-testing = "=1.18.1"

# The UI tests query the element tree, which only the `testing` feature
# compiles in; without it they are not built.
[[test]]
name = "a11y"
required-features = ["testing"]

[[test]]
name = "views"
required-features = ["testing"]

[[test]]
name = "keyboard"
required-features = ["testing"]
