# cargo-deny configuration for the gui/ workspace
#
# The policy of the main deny.toml at the repository root, which explains each
# setting, applied to the dependency graph of the window: the Slint toolkit
# (winit, AccessKit, the font stack) and nails-api, the wire contract it links
# from the main tree. Every line that differs from the main deny.toml is
# marked "GUI:".
#
# The justfile checks this file in the recipes, and at the scopes, that check
# the main one:
#
#   just deny        The x86_64 Linux targets without dev-dependencies. This is
#                    the merge gate in CI.
#   just deny-full   Every target and every dev-dependency. Runs weekly in
#                    .github/workflows/scheduled.yml and never blocks a merge.
#
# Both name this file with --config. Without it, cargo-deny takes the deny.toml
# nearest to gui/Cargo.toml, which is the main one if this file goes missing.

# =============================================================================
# ADVISORIES
# =============================================================================

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

# Every entry needs a reason and a "# expires: YYYY-MM-DD" line in the comment
# block directly above it, at most 180 days ahead; ci/deny_ignores.py checks
# this file as it checks the main one.
ignore = [
    # GUI: ttf-parser is unmaintained and has no maintained release. It is
    # reached only through winit's Wayland window decorations, which Slint's
    # winit backend always turns on with Wayland: i-slint-backend-winit ->
    # winit (wayland-csd-adwaita) -> sctk-adwaita (ab_glyph) -> ab_glyph ->
    # owned_ttf_parser -> ttf-parser. The window draws no decorations of the
    # system's (it has no frame), and it renders its own text with skrifa.
    # Check again when winit, sctk-adwaita or ab_glyph moves off ttf-parser.
    # expires: 2027-04-15
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no fixed release; reached only through winit's Wayland decorations, which Slint's winit backend always enables" },
    # GUI: zvariant, zbus_names and zvariant_derive are part of zbus 6 now.
    # The window reaches zbus 5 only through AccessKit's AT-SPI adapter
    # (accesskit_unix -> atspi -> zbus), the screen reader's way in; they go
    # once AccessKit moves to zbus 6.
    # expires: 2027-01-31
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, merged into zbus 6; reached through AccessKit's AT-SPI adapter on zbus 5" },
    # GUI: as RUSTSEC-2026-0370, for zbus_names.
    # expires: 2027-01-31
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, merged into zbus 6; reached through AccessKit's AT-SPI adapter on zbus 5" },
    # GUI: as RUSTSEC-2026-0370, for zvariant_derive.
    # expires: 2027-01-31
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, merged into zbus 6; reached through AccessKit's AT-SPI adapter on zbus 5" },
]

# =============================================================================
# LICENSES
# =============================================================================

[licenses]
confidence-threshold = 0.8

# GUI: the licences of the window's graph, each with the crates that need it.
# Most crates offer MIT or Apache-2.0 among other choices.
allow = [
    "MIT",
    "Apache-2.0",
    # The ICU4X crates (Slint's text segmentation and locale data) and
    # unicode-ident.
    "Unicode-3.0",
    # foldhash and slotmap.
    "Zlib",
    # arrayref, through tiny-skia.
    "BSD-2-Clause",
    # tiny-skia and tiny-skia-path, the toolkit's rasteriser of paths.
    "BSD-3-Clause",
    # libloading, which opens the display libraries at run time.
    "ISC",
    # clipboard-win and error-code: a build for Windows only, so only
    # `just deny-full` meets them.
    "BSL-1.0",
]

# GUI: Slint is offered as "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0
# OR LicenseRef-Slint-Software-3.0", and the window takes the GPL-3.0-only
# choice: the window's program as a whole can be distributed under GPL-3.0
# only (the engine's sources stay GPL-3.0-or-later). The exception is limited
# to Slint's own crates, so that any other GPL-3.0-only dependency stays a
# decision of its own. i-slint-backend-testing is a dev-dependency (the
# headless tests), and i-slint-renderer-skia is reached only by a build for
# iOS; `just deny-full` meets both.
#
# sctk-adwaita declares MIT, but its ab_glyph feature, which winit's Wayland
# support turns on, compiles a Cantarell font (SIL OFL 1.1) into the binary.
# The clarification below records that, and OFL-1.1 is accepted for that
# crate only.
exceptions = [
    { crate = "slint", allow = ["GPL-3.0-only"] },
    { crate = "slint-build", allow = ["GPL-3.0-only"] },
    { crate = "slint-macros", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-backend-selector", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-backend-testing", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-backend-winit", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-common", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-compiler", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-core", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-core-macros", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-renderer-skia", allow = ["GPL-3.0-only"] },
    { crate = "i-slint-renderer-software", allow = ["GPL-3.0-only"] },
    { crate = "sctk-adwaita", allow = ["OFL-1.1"] },
]

# GUI: the font sctk-adwaita compiles in (src/title/ab_glyph_renderer.rs:
# `include_bytes!("Cantarell-Regular.ttf")`), copyright 2009-2011
# Understanding Limited and 2010-2011 Jakub Steiner. The hash pins the crate's
# MIT LICENSE file; when it changes, cargo-deny drops the clarification and
# this needs a new look.
[[licenses.clarify]]
crate = "sctk-adwaita"
expression = "MIT AND OFL-1.1"
license-files = [{ path = "LICENSE", hash = 0xa41ea83d }]

# The workspace's own crates, and nails-api from the main tree, are not
# published, so they are not checked.
[licenses.private]
ignore = true
registries = []

# =============================================================================
# BANS
# =============================================================================

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = []
skip-tree = []
deny = []

# =============================================================================
# SOURCES
# =============================================================================

[sources]
unknown-registry = "deny"
unknown-git = "deny"
