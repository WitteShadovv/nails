#
# nails-gui is its own Cargo workspace, outside the main NAILS one, as the fuzz
# and setup crates are. The window runs as the operator and drives the static
# engine over a pipe, so the two never link each other, and the toolkit the
# window will be drawn with, a large dependency tree of its own, never reaches
# the engine. The one crate of the engine's tree the window links is
# nails-api, the wire contract, which depends on serde alone.

[workspace]
members = ["nails-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["WitteShadovv"]
license = "GPL-3.0-only"
homepage = "https://nails.run"
repository = "https://github.com/WitteShadovv/nails"

# A workspace of its own does not inherit the main tree's lint policy, so it is
# restated here: no unsafe code, and the size and complexity lints.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
