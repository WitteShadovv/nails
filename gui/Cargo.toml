#
# nails-gui is its own Cargo workspace, outside the main NAILS one, as the fuzz
# and setup crates are. The toolkit the graphical interface will be built on is
# not chosen yet; whichever it is, it brings a large dependency tree that must
# not reach the shipped binaries before that choice is made and reviewed, so the
# crate is kept off the shipped dependency graph and built on its own. The
# interface is not implemented yet; this is the initial scaffold: the workspace
# and a placeholder binary, with no toolkit dependency.

[workspace]
members = ["nails-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["WitteShadovv"]
license = "GPL-3.0-only"
homepage = "https://nails.run"
repository = "https://github.com/WitteShadovv/nails"

# A workspace of its own does not inherit the main tree's lint policy, so it is
# restated here: no unsafe code, and the size and complexity lints.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
