#
# nails-gui is its own Cargo workspace, outside the main NAILS one, as the fuzz
# and setup crates are. The window is built on the Slint toolkit, whose large
# dependency tree must not reach the static engine: the window runs as the
# operator and drives the engine over a pipe, so the two never link each other.
# The one crate of the engine's tree the window links is nails-api, the wire
# contract, which depends on serde alone.

[workspace]
members = ["nails-gui"]
# The patched copy of a Slint crate below is a dependency of the window, not
# a member: its code is Slint's, and the workspace's lints, formatting and
# tests are the window's own.
exclude = ["patches"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["WitteShadovv"]
license = "GPL-3.0-only"
homepage = "https://nails.run"
repository = "https://github.com/WitteShadovv/nails"

# A workspace of its own does not inherit the main tree's lint policy, so it is
# restated here: no unsafe code, and the size and complexity lints.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"

# The main tree's release profile, so the window ships optimised the way the
# engine does: link-time optimisation and no symbols.
[profile.release]
strip = true
lto = true

# Slint's winit backend, patched: gui/patches/i-slint-backend-winit is the
# crate Slint publishes at the version the window pins, with two changes of
# ours, each marked "NAILS:" in place. No feature of Slint 1.18 makes either.
#
# - Its Wayland support no longer turns on winit's sctk-adwaita window
#   decorations, which winit builds even for a window without a frame and
#   then hides, running dbus-send (for the colour scheme and the button
#   layout), gsettings (for the title's font) and fc-match on the way. winit
#   then draws smithay's fallback frame, which starts nothing.
# - Its reads of the desktop's settings portal carry NO_AUTO_START: the
#   window follows the desktop's appearance where xdg-desktop-portal runs,
#   and never starts it through D-Bus activation.
#
# A new Slint release brings a new copy of the crate with the same changes.
[patch.crates-io]
i-slint-backend-winit = { path = "patches/i-slint-backend-winit" }
