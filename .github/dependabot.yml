# Dependency automation for the NAILS workspace.
#
# Dependabot keeps seven sources of pinned versions current:
#   - the Cargo workspace (Cargo.toml / Cargo.lock)
#   - the fuzz crate (fuzz/Cargo.toml / fuzz/Cargo.lock)
#   - the ClusterFuzzLite build image (.clusterfuzzlite/Dockerfile)
#   - the GitHub Actions in the workflows and composite actions
#   - flake.lock (the Nix inputs)
#   - .pre-commit-config.yaml (the hook revisions)
#   - rust-toolchain.toml (the Rust toolchain)
# The rust-toolchain update and the rust-overlay flake input share one pull
# request: flake.nix builds the pinned channel from rust-overlay, so a new
# toolchain is only usable together with an overlay that knows it. The cooldown
# holds back only the overlay (Dependabot finds no publication date for a Rust
# release), so a release from the last seven days can arrive without it; see
# docs/ci.md. Cargo.lock's transitive dependencies, which no Dependabot update
# touches, are refreshed by the lockfile task in scheduled.yml.
#
# Every ecosystem runs monthly, groups its updates into a single pull request
# and waits a 7-day cooldown after a release before proposing it, so a freshly
# published version has time to be yanked before it reaches a branch.
#
# Merge policy: Dependabot opens the pull requests; merging is manual. Only a
# dev-dependency patch or minor update with a green gate is a candidate for
# auto-merge (configured as a branch rule, not here). Security updates are
# surfaced in their own groups so they are never lost in the monthly batch.

version: 2

multi-ecosystem-groups:
  # rust-toolchain.toml and the rust-overlay input it is built from.
  rust-toolchain:
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"

updates:
  # Rust workspace (Cargo.toml / Cargo.lock at the repository root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # `build` + scope yields "build(deps): ..." for runtime dependencies and
    # "build(deps-dev): ..." for dev-dependencies, which the commit-msg hook
    # and pr-title.yml both accept.
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # One pull request for every non-security version bump.
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
      # Security fixes stay visible on their own rather than hiding in the
      # monthly batch.
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Major bumps of the crates that define data formats or the system
    # interface are migrations, not routine updates, so they are proposed by
    # hand instead of by the monthly group.
    ignore:
      - dependency-name: "nix"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serde"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serde_json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "toml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chrono"
        update-types: ["version-update:semver-major"]

  # The fuzz crate, a workspace of its own with its own Cargo.lock: libFuzzer's
  # bindings and the dependencies of the NAILS crates it fuzzes.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      fuzz:
        applies-to: version-updates
        patterns:
          - "*"
      fuzz-security:
        applies-to: security-updates
        patterns:
          - "*"

  # OSS-Fuzz's Rust builder image, pinned by digest in the ClusterFuzzLite
  # build of the fuzz targets.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      clusterfuzzlite:
        patterns:
          - "*"

  # GitHub Actions pinned in the workflows and in the composite actions.
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; the composite actions pin their own
    # third-party actions in separate directories.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # "ci(deps): ..." / "ci(deps-dev): ..." — the same scoped form as Cargo.
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The flake inputs in flake.lock, except rust-overlay, which moves with the
  # toolchain below. A nixpkgs update changes every VM test derivation, so the
  # pull request's affected E2E selection runs the whole suite.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # "build(deps): ..." like the Cargo updates.
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "nix"
    groups:
      nix:
        patterns:
          - "*"
    ignore:
      - dependency-name: "rust-overlay"

  # The hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      pre-commit:
        patterns:
          - "*"

  # rust-toolchain.toml and the rust-overlay input, one pull request through
  # the rust-toolchain group above.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "rust-toolchain"
    cooldown:
      default-days: 7

  - package-ecosystem: "nix"
    directory: "/"
    patterns:
      - "rust-overlay"
    multi-ecosystem-group: "rust-toolchain"
    cooldown:
      default-days: 7
