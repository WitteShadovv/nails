# Dependency automation for the NAILS workspace.
#
# Dependabot only covers the two ecosystems it understands natively: the Cargo
# workspace and the GitHub Actions used by the workflows. The three remaining
# sources of pinned versions are updated elsewhere, because Dependabot has no
# ecosystem for them:
#   - flake.lock (Nix inputs)    -> .github/workflows/update-flake-lock.yml
#   - .pre-commit-config.yaml    -> the pre-commit-autoupdate job in that file
#   - rust-toolchain.toml        -> bumped by hand; the deny.toml RUSTSEC ignores
#                                   are tied to the exact pin, so a bump is a
#                                   reviewed change, not an automated one.
#
# Both ecosystems run monthly, group their updates into a single pull request
# and wait a 7-day cooldown after a release before proposing it, so a freshly
# published version has time to be yanked before it reaches a branch.
#
# Merge policy: Dependabot opens the pull requests; merging is manual. Only a
# dev-dependency patch or minor update with a green gate is a candidate for
# auto-merge (configured as a branch rule, not here). Security updates are
# surfaced in their own groups so they are never lost in the monthly batch.

version: 2

updates:
  # Rust workspace (Cargo.toml / Cargo.lock at the repository root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # `build` + scope yields "build(deps): ..." for runtime dependencies and
    # "build(deps-dev): ..." for dev-dependencies, which the commit-msg hook
    # and pr-title.yml both accept.
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # One pull request for every non-security version bump.
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
      # Security fixes stay visible on their own rather than hiding in the
      # monthly batch.
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Major bumps of the crates that define data formats or the system
    # interface are migrations, not routine updates, so they are proposed by
    # hand instead of by the monthly group.
    ignore:
      - dependency-name: "nix"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serde"
        update-types: ["version-update:semver-major"]
      - dependency-name: "serde_json"
        update-types: ["version-update:semver-major"]
      - dependency-name: "toml"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chrono"
        update-types: ["version-update:semver-major"]

  # GitHub Actions pinned in the workflows and in the composite actions.
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; the composite actions pin their own
    # third-party actions in separate directories.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # "ci(deps): ..." / "ci(deps-dev): ..." — the same scoped form as Cargo.
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
