# The last job of every run nobody watches (pushes to main and next,
# schedules, releases) calls this action, so a red run reaches someone: it
# opens or comments on one tracking issue, and the next fully green run
# closes it.
# report_status.py holds the rules. The calling job needs `issues: write`
# and a checkout of this directory.
name: Report status
description: >-
  Open or comment on a tracking issue when a needed job failed, and close it
  once every needed job passes again.
inputs:
  needs:
    description: >-
      The calling job's needs context, passed as toJSON(needs). It carries
      both the outcome and the names of the red jobs.
    required: true
  label:
    description: >-
      Label of the tracking issue: 'ci-red' for broken builds and checks,
      'advisory' for dependency advisories and policy findings.
    required: false
    default: ci-red
  title:
    description: >-
      Title of the tracking issue; empty means 'CI red: <workflow name>'.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Update the tracking issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        NEEDS: ${{ inputs.needs }}
        LABEL: ${{ inputs.label }}
        TITLE: ${{ inputs.title }}
      run: python3 "$GITHUB_ACTION_PATH/report_status.py"
