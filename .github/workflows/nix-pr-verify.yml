name: Nix PR Verify

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    name: Nix Release Path Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Build canonical release artifact
        run: nix build -L .#nails-release -o result --option accept-flake-config false

      - name: Verify release archive contents
        run: |
          # Find the release tarball
          archive=$(ls result/*.tar.gz)
          echo "Found archive: ${archive}"

          # Extract the tarball
          smoke_dir=$(mktemp -d)
          tar -xzf "${archive}" -C "$smoke_dir"
          extracted_dir=$(ls -d "$smoke_dir"/nails-*)

          # Verify required files exist
          echo "Checking LICENSE..."
          test -f "$extracted_dir/LICENSE"

          echo "Checking README.md..."
          test -f "$extracted_dir/README.md"

          echo "Checking binary..."
          test -x "$extracted_dir/nails"

          echo "Checking checksums file..."
          test -s result/checksums.txt

          # Run the binary with --version
          echo "Running binary --version..."
          "$extracted_dir/nails" --version

          # Verify checksum matches
          echo "Verifying checksum..."
          archive_name=$(basename "${archive}")
          cd result
          if grep -q "${archive_name}" checksums.txt; then
            sha256sum --check <(grep "${archive_name}" checksums.txt)
            echo "Checksum verification passed"
          else
            echo "Warning: archive not found in checksums.txt"
          fi

          echo "All release artifact checks passed"
