name: Distro E2E

# The portable distribution tier, run on numtide/nix-vm-test through the NixOS
# test driver (nix/distro-tests/). It catches regressions on a non-NixOS host,
# which the NixOS-only e2e.yml suite cannot see. Its suites:
#
#   smoke    one smoke scenario per admitted distribution, built with nix build
#   records  the login- and boot-record scenarios (Debian 13, Ubuntu 24.04)
#   refusal  the refusal of each pinned image of a family the family table
#            does not admit (Fedora, Arch)
#   probe    the fact probes of the images not admitted yet
#   cells    research only: the SELinux cells of an enforcing Fedora image
#            (nix/distro-tests/cells.nix), each uploading its results
#
# A smoke scenario is a derivation that nix build runs in the Nix build
# sandbox. A records scenario, a refusal and a probe are host drivers: the job
# builds the driver and runs it on the runner, outside the sandbox.
#
# The records and refusal jobs gate: distro-result fails when one of them
# fails. The smoke scenarios and the probes are informational, and their
# failure only warns.
#
#   pull request to main  the records and refusal suites, when the change
#   or next               touches what they are built from (the path filter
#                         in Plan); with the 'distro-e2e' label, the smoke
#                         suite too, and adding the label runs all three at
#                         once, whatever the change
#   nightly schedule      smoke, records and refusal; the nightly run of next
#                         is a dispatch from next-nightly.yml
#   dispatch or call      the `suite` input: all (smoke, records and refusal,
#                         the default), one of them, or the probes
#
# The runner is an input, because each VM needs KVM; a hosted ubuntu-26.04
# runner exposes /dev/kvm, and a self-hosted KVM runner is selected by passing
# its label list.
#
# `python3 -m ci.e2e distro-plan` plans the matrix: the smoke shards are kept
# at or below max-jobs parallel jobs (distributions times their shards), and
# each driver is a job of its own. Adding a distribution is one entry in
# nix/distro-tests/images.nix -- this workflow enumerates whatever it reports.
#
# A dispatch or call with `suite` set to probe runs the fact probes
# (nix/distro-tests/probe.nix): each boots the stock image of a family not
# admitted yet without nails, and its job uploads the facts it records as a
# JSON artifact, the record of the matching nix/distro-tests/probe fixture.

on:
  schedule:
    # Nightly at 03:41 UTC, after the NixOS suite's 02:17 run.
    - cron: "41 3 * * *"
  pull_request:
    branches: [main, next]
    # A push to the pull request runs the path filter in Plan. 'labeled' lets
    # the 'distro-e2e' label take effect without a new push; a run for any
    # other label tests nothing (the Plan condition). A draft that becomes
    # ready runs nothing again: its pushes have run already.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          What the VM jobs run: all (the smoke, records and refusal suites),
          one of those three alone, or the fact probes of the images not
          admitted yet, each uploading its facts as JSON (distros then names
          probes, such as fedora-44-enforcing)
        type: choice
        default: all
        options: [all, smoke, records, refusal, probe, cells]
      runner:
        description: >-
          runs-on for the VM jobs, as JSON: "ubuntu-26.04" or a label list such
          as ["self-hosted","nails-distro"]
        type: string
        default: '"ubuntu-26.04"'
      distros:
        description: >-
          Space-separated names to run: distributions (e.g. "debian-13
          ubuntu-24.04") for the smoke and records suites, images (e.g.
          "fedora-44") for the refusal suite, probes for the probe suite. Each
          suite runs what it has of them; empty runs every entry of each suite.
        type: string
        default: ""
      max-jobs:
        description: Upper bound on parallel smoke jobs (distros x shards).
        type: number
        default: 8
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
      runner:
        type: string
        default: '"ubuntu-26.04"'
      distros:
        type: string
        default: ""
      max-jobs:
        type: number
        default: 8
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # The runs of a pull request share one group, so a new push, or adding the
  # 'distro-e2e' label, cancels the run in progress. A run for any other label
  # tests nothing (the Plan condition) and gets its run ID in the group, so it
  # can neither cancel a run that tests nor be cancelled; the first suffix
  # below is the exact complement of that condition. A scheduled or dispatched
  # run waits for an earlier run of the same event and ref instead; GitHub
  # keeps one waiting run per group, so a newer run replaces one that has not
  # started. A call counts as its caller's event. A dispatch of one suite waits
  # in a group of its own, so it neither waits for a run of all of them on the
  # same ref nor replaces one.
  group: distro-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'distro-e2e' && format('-{0}', github.run_id) || '' }}${{ inputs.suite && inputs.suite != 'all' && format('-{0}', inputs.suite) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    # A run for a label other than 'distro-e2e' tests nothing. The action is
    # checked, not only the event, because a call sees its caller's event.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'distro-e2e' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      unchanged: ${{ steps.select.outputs.unchanged }}
      runner: ${{ steps.select.outputs.runner }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      distro-jobs: ${{ steps.matrix.outputs.distro-jobs }}
      gating: ${{ steps.matrix.outputs.gating }}
      gating-jobs: ${{ steps.matrix.outputs.gating-jobs }}
      max-jobs: ${{ steps.select.outputs.max-jobs }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2 # the merge commit and both of its parents
          persist-credentials: false

      # The single path filter of the tier. It filters this workflow's own pull
      # request runs, all but the one that adding the 'distro-e2e' label
      # starts: that run, like a dispatch or a call (which sets SUITE_INPUT),
      # asked for its suites. A change outside these paths cannot alter a
      # scenario or a driver, so the run tests nothing and distro-result
      # passes. The Rust paths are what flake.nix builds the binary from, as
      # in e2e.yml's filter; the Nix paths are the tier and the files of
      # nix/e2e-tests it reads. ci/tests checks both against the tree. A pull
      # request is compared with the first parent of its merge commit; an
      # unknown base counts as a change.
      - name: Select suites, runner and job ceiling
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'distro-e2e') }}
          SUITE_INPUT: ${{ inputs.suite }}
          RUNNER_INPUT: ${{ inputs.runner }}
          MAX_JOBS_INPUT: ${{ inputs.max-jobs }}
        run: |
          set -euo pipefail
          suites=${SUITE_INPUT:-}
          filtered=false
          if [ -z "$suites" ]; then
            if [ "$EVENT_NAME" != pull_request ]; then
              suites=all
            elif [ "$EVENT_ACTION" = labeled ] && [ "$EVENT_LABEL" = distro-e2e ]; then
              suites=all
            else
              filtered=true
              if [ "$LABELLED" = true ]; then
                suites=all
              else
                suites="records refusal"
              fi
            fi
          fi
          read -ra selected <<< "$suites"
          for suite in "${selected[@]}"; do
            case "$suite" in
              all | smoke | records | refusal | probe | cells) ;;
              *)
                echo "::error::suite must be all, smoke, records, refusal, probe or cells, got '$suite'"
                exit 1
                ;;
            esac
          done

          unchanged=false
          if [ "$filtered" = true ]; then
            relevant='^(nails-api/|nails-base/|nails-core/|nails-cli/|nails-forensics/|nails-oracle/Cargo\.toml$|nails-platform/|nails-session/|nails-teardown/|\.cargo/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|flake\.(nix|lock)$|nix/distro-tests/|nix/e2e-tests/py/|nix/e2e-tests/lib/(records\.py|disk-forensics\.nix|disk_forensics\.py)$|nix/e2e-tests/fixtures/indicators\.json$|ci/e2e/|\.github/actions/setup-nix/|\.github/workflows/distro-e2e\.yml$)'
            base=HEAD^1
            if ! git rev-parse -q --verify "$base^{commit}" > /dev/null; then
              echo "Unknown base $base: every selected suite runs."
            else
              # --no-renames lists a moved file under its old path too. The
              # list is read in full before grep looks at it: grep -q in a
              # pipe would stop the writer early, and with pipefail that reads
              # as no match.
              changed=$(git diff --name-only --no-renames "$base" HEAD)
              if ! grep -qE "$relevant" <<< "$changed"; then
                echo "No change under the distro paths since $base; nothing to test."
                suites=
                unchanged=true
              fi
            fi
          fi

          runner=$(python3 -c 'import json, sys; print(json.dumps(json.loads(sys.argv[1]), separators=(",", ":")))' "${RUNNER_INPUT:-\"ubuntu-26.04\"}")
          max_jobs=${MAX_JOBS_INPUT:-8}
          if ! [[ "$max_jobs" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max-jobs must be a positive integer, got '$max_jobs'"
            exit 1
          fi
          {
            echo "suites=$suites"
            echo "unchanged=$unchanged"
            echo "runner=$runner"
            echo "max-jobs=$max_jobs"
          } >> "$GITHUB_OUTPUT"
          echo "Suites: ${suites:-none}, runner: $runner, max jobs: $max_jobs"

      - name: Set up Nix
        if: steps.select.outputs.suites != ''
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      # Built once here, so the VM jobs substitute it from the cache instead
      # of each compiling the static binary (when a cache is configured). A
      # probe boots no nails.
      - name: Build nails
        if: steps.select.outputs.suites != '' && steps.select.outputs.suites != 'probe'
        run: nix build -L --no-link .#nails

      # The cells share one research build with Fedora admitted: built once
      # here, so each cell job substitutes it.
      - name: Build the cells' nails
        if: steps.select.outputs.suites == 'cells'
        run: nix build -L --no-link .#legacyPackages.x86_64-linux.e2e-distro.cells-nails

      # The records and refusal jobs run as the gating job, apart from the
      # others, so that distro-result can tell their failure from a smoke
      # scenario's or a probe's; the planner marks which jobs gate.
      - name: Plan the distro matrix
        id: matrix
        env:
          DISTROS: ${{ inputs.distros }}
          SUITES: ${{ steps.select.outputs.suites }}
          MAX_JOBS: ${{ steps.select.outputs.max-jobs }}
        run: |
          set -euo pipefail
          if [ -z "$SUITES" ]; then
            empty='{"include":[]}'
            {
              echo "matrix=$empty"
              echo "distro-jobs=0"
              echo "gating=$empty"
              echo "gating-jobs=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Distro E2E plan"
              echo
              echo "No change under the distro paths; nothing to test."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          read -ra distros <<< "$DISTROS"
          read -ra suites <<< "$SUITES"
          suite_args=()
          for suite in "${suites[@]}"; do
            suite_args+=(--suite "$suite")
          done
          plan=$(python3 -m ci.e2e distro-plan "${distros[@]}" "${suite_args[@]}" --max-jobs "$MAX_JOBS")
          matrix=$(jq -c '{include: [.include[] | select(.gating | not)]}' <<< "$plan")
          gating=$(jq -c '{include: [.include[] | select(.gating)]}' <<< "$plan")
          {
            echo "matrix=$matrix"
            echo "distro-jobs=$(jq '.include | length' <<< "$matrix")"
            echo "gating=$gating"
            echo "gating-jobs=$(jq '.include | length' <<< "$gating")"
          } >> "$GITHUB_OUTPUT"
          if [ "$SUITES" = probe ] || [ "$SUITES" = cells ]; then
            {
              echo "## Distro E2E $SUITES plan"
              echo
              echo "| Probe | Shard | Driver | Timeout (min) |"
              echo "|---|---|---|---:|"
              jq -r '.include[] | "| \(.distro) | \(.index)/\(.count) | \(.tests | map("`" + . + "`") | join(" ")) | \(.timeout) |"' <<< "$plan"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Distro E2E plan ($SUITES)"
              echo
              echo "| Distribution | Suite | Shard | Scenarios | Gates | Timeout (min) |"
              echo "|---|---|---|---|---|---:|"
              jq -r '.include[] | "| \(.distro) | \(.suite) | \(.index)/\(.count) | \(.tests | map("`" + . + "`") | join(" ")) | \(if .gating then "yes" else "no" end) | \(.timeout) |"' <<< "$plan"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  distro:
    name: ${{ matrix.distro }} ${{ matrix.index }}/${{ matrix.count }}
    needs: plan
    if: needs.plan.outputs.distro-jobs != '0'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # At most max-jobs VM jobs at once, so a run of many drivers leaves
      # runners for the other workflows.
      max-parallel: ${{ fromJSON(needs.plan.outputs.max-jobs) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # install-nix-action opens /dev/kvm to the runner user on hosted runners;
      # self-hosted runners must provide KVM for nix-vm-test.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Run the distro smoke scenarios
        if: matrix.suite == 'smoke'
        env:
          TESTS: ${{ join(matrix.tests, ' ') }}
        run: |
          set -euo pipefail
          read -ra tests <<< "$TESTS"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No scenarios selected for this shard."
            exit 0
          fi
          attrs=()
          for test in "${tests[@]}"; do
            # Quote the attribute: names such as ubuntu-24.04-smoke contain a dot.
            attrs+=(".#legacyPackages.x86_64-linux.e2e-distro.\"$test\"")
          done
          nix build -L --no-link "${attrs[@]}"

      # A probe is a host driver, so its job builds the driver and runs it here,
      # as the oracle nightly runs its test, and every run boots the image
      # afresh. Outside the Nix sandbox the driver keeps the VM state in
      # XDG_RUNTIME_DIR, falling back to TMPDIR, and XDG_RUNTIME_DIR is a small
      # tmpfs in RAM on a hosted runner, so both name a directory on the root
      # disk. The driver writes <probe>.json and <probe>.raw.json where
      # NAILS_PROBE_OUT names, and the step adds its log and puts the facts in
      # the job summary.
      - name: Run the probes
        if: matrix.suite == 'probe'
        env:
          TESTS: ${{ join(matrix.tests, ' ') }}
          PROBE_SECONDS: ${{ matrix.seconds }}
        run: |
          set -euo pipefail
          read -ra tests <<< "$TESTS"
          out="$RUNNER_TEMP/probe"
          scratch="$RUNNER_TEMP/vm"
          mkdir -p "$out" "$scratch"
          for test in "${tests[@]}"; do
            name=${test%-probe}
            driver="$RUNNER_TEMP/$test"
            # Quote the attribute, as above: a name may contain a dot.
            nix build --print-build-logs --out-link "$driver" \
              ".#legacyPackages.x86_64-linux.e2e-distro.\"$test\""
            (
              cd "$scratch"
              TMPDIR="$scratch" XDG_RUNTIME_DIR="$scratch" NAILS_PROBE_OUT="$out" \
                timeout "$PROBE_SECONDS" "$driver/bin/test-driver" </dev/null
            ) 2>&1 | tee "$out/$name.log"
            # A record is recorded only when it holds a kernel release and the
            # one soft-reboot, which every run on a booted image reads.
            if ! jq -e '.recorded == true' "$out/$name.json" >/dev/null; then
              echo "::error::The $name record is not recorded: the run read no kernel release or no soft-reboot (its log is in the probe-$name artifact)."
              exit 1
            fi
            {
              echo "### Probe \`$name\`"
              echo
              echo '```json'
              cat "$out/$name.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # Research only: each cell runs its driver as a probe does and writes
      # <cell>.json, <cell>.raw.json and <cell>.kmsg.txt; the step adds the
      # log. A cell records what failed and goes on, so the driver's own exit
      # status is kept but does not stop the upload.
      - name: Run the cells
        if: matrix.suite == 'cells'
        env:
          TESTS: ${{ join(matrix.tests, ' ') }}
          CELL_SECONDS: ${{ matrix.seconds }}
        run: |
          set -euo pipefail
          read -ra tests <<< "$TESTS"
          out="$RUNNER_TEMP/cell"
          scratch="$RUNNER_TEMP/vm"
          mkdir -p "$out" "$scratch"
          status=0
          for test in "${tests[@]}"; do
            name=${test%-cell}
            driver="$RUNNER_TEMP/$test"
            nix build --print-build-logs --out-link "$driver" \
              ".#legacyPackages.x86_64-linux.e2e-distro.\"$test\""
            (
              cd "$scratch"
              TMPDIR="$scratch" XDG_RUNTIME_DIR="$scratch" NAILS_CELL_OUT="$out" \
                timeout "$CELL_SECONDS" "$driver/bin/test-driver" </dev/null
            ) 2>&1 | tee "$out/$name.log" || status=$?
            gzip -9 "$out/$name.log"
          done
          exit "$status"

      - name: Upload the cell results
        if: matrix.suite == 'cells' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-${{ matrix.distro }}
          path: ${{ runner.temp }}/cell/
          if-no-files-found: warn
          retention-days: 30

      # The artifact holds the record, the raw output of every query and the
      # driver's log; a probe that failed before its record still leaves the
      # log.
      - name: Upload the probe facts
        if: matrix.suite == 'probe' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.distro }}
          path: ${{ runner.temp }}/probe/
          if-no-files-found: warn
          retention-days: 30

  # The records scenarios and the refusals. Each is a host driver, which the
  # job builds and runs here as the probe job does, so every run boots the
  # image afresh; the Debian records scenario installs wtmpdb over the guest's
  # network, which only a run outside the Nix sandbox has. The driver keeps
  # its VM state on the root disk, as a probe's does, and the job stops it
  # after its time limit.
  gating:
    name: ${{ matrix.distro }} ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.gating-jobs != '0'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gating) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      # A job with no driver would pass having tested nothing, so it fails.
      - name: Run the ${{ matrix.suite }} driver
        id: driver
        env:
          TESTS: ${{ join(matrix.tests, ' ') }}
          DRIVER_SECONDS: ${{ matrix.seconds }}
        run: |
          set -euo pipefail
          read -ra tests <<< "$TESTS"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::The plan gave this job no driver to run."
            exit 1
          fi
          scratch="$RUNNER_TEMP/vm"
          mkdir -p "$scratch"
          for test in "${tests[@]}"; do
            driver="$RUNNER_TEMP/$test"
            # Quote the attribute: names such as ubuntu-24.04-records contain a dot.
            nix build --print-build-logs --out-link "$driver" \
              ".#legacyPackages.x86_64-linux.e2e-distro.\"$test\""
            status=0
            (
              cd "$scratch"
              TMPDIR="$scratch" XDG_RUNTIME_DIR="$scratch" \
                timeout "$DRIVER_SECONDS" "$driver/bin/test-driver" </dev/null
            ) || status=$?
            if [ "$status" -eq 124 ]; then
              echo "::error::$test ran past its time limit of $DRIVER_SECONDS s."
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done

  distro-result:
    name: distro-result
    needs: [plan, distro, gating]
    # !cancelled(), not always(): a run cancelled by a newer push or label
    # reports nothing, rather than a plan or scenario failure it never had.
    # A skipped check counts as passed, and a run for another label passes
    # without testing anything, under this same name, so revisit this before
    # the lane becomes a required check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Report the outcome
        id: report
        env:
          SUITES: ${{ needs.plan.outputs.suites }}
          UNCHANGED: ${{ needs.plan.outputs.unchanged }}
          DISTRO_JOBS: ${{ needs.plan.outputs.distro-jobs }}
          GATING_JOBS: ${{ needs.plan.outputs.gating-jobs }}
          PLAN_RESULT: ${{ needs.plan.result }}
          DISTRO_RESULT: ${{ needs.distro.result }}
          GATING_RESULT: ${{ needs.gating.result }}
        run: |
          echo "plan: $PLAN_RESULT, distro: $DISTRO_RESULT, gating: $GATING_RESULT"
          if [ "$PLAN_RESULT" = skipped ]; then
            echo "Not a 'distro-e2e' label event; nothing ran."
            exit 0
          fi
          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::Planning the distro run failed."
            exit 1
          fi
          if [ "$UNCHANGED" = true ] && [ -z "$SUITES" ]; then
            echo "No change under the distro paths; nothing ran."
            exit 0
          fi
          # Fail closed: a plan that left no suite or no job count behind
          # would let every job be skipped and pass.
          if [ -z "$SUITES" ] || [ -z "$DISTRO_JOBS" ] || [ -z "$GATING_JOBS" ]; then
            echo "::error::The plan set no suites or job counts (suites '$SUITES', jobs '$DISTRO_JOBS' and '$GATING_JOBS')."
            exit 1
          fi
          status=0
          # The records and refusal jobs gate; a planned job that was skipped
          # tested nothing and fails as well.
          if [ "$GATING_JOBS" != 0 ] && [ "$GATING_RESULT" != success ]; then
            echo "::error::One or more records or refusal scenarios failed or did not run ($GATING_RESULT)."
            status=1
          fi
          # The smoke scenarios and the probes are informational: a failure is
          # surfaced but does not gate.
          if [ "$DISTRO_JOBS" != 0 ] && [ "$DISTRO_RESULT" != success ]; then
            if [ "$SUITES" = probe ]; then
              echo "::warning::One or more distro probes failed or did not run ($DISTRO_RESULT)."
            else
              echo "::warning::One or more distro smoke scenarios failed or did not run ($DISTRO_RESULT)."
            fi
          fi
          if [ "$SUITES" = probe ]; then
            echo "Distro probes finished."
          else
            echo "Distro E2E finished ($SUITES)."
          fi
          exit "$status"
