name: E2E (Hetzner)

# The one manual lane for the E2E suite on a self-hosted Hetzner Cloud runner,
# for when a hosted runner is too small or too slow for a full run. It is
# dispatch-only and gates nothing: `provision` creates one throwaway server as
# a single-use runner, `e2e` calls the reusable e2e.yml on it, and `teardown`
# deletes the server even when the run failed. There is no approval environment
# and no workflow-budget logic.
#
# A reusable workflow call always runs the caller's commit, so dispatch this
# workflow at the ref you want to test (`gh workflow run e2e-hetzner.yml
# --ref <ref> -f ref=<ref>`); `provision` refuses a `ref` input that does not
# match the checked-out revision.
#
# Secrets live in the `hetzner` deployment environment (secret scoping only;
# it carries no required reviewers, so it is not an approval gate):
#   HCLOUD_TOKEN           Hetzner Cloud API token (read/write).
#   HCLOUD_SSH_KEY_ID      id of an SSH key already uploaded to the project.
#   RUNNER_REGISTRATION    fine-grained PAT with repository `administration:
#                          write`, used only to mint the single-use runner's
#                          JIT config.
# CACHIX_AUTH_TOKEN is an ordinary Actions secret, passed on to e2e.yml for
# cache pushes exactly as release.yml passes it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact ref or SHA to test; must match the dispatched ref.
        required: true
        type: string
      mode:
        description: Which tests run
        type: choice
        default: all
        options: [affected, ci, all, execute]
      max-shards:
        description: Parallel shards; a single-use runner serves one, so keep 1.
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: e2e-hetzner
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Bumped by hand; see https://github.com/actions/runner/releases.
  RUNNER_VERSION: "2.321.0"
  # SHA-256 of actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz, from the
  # release notes. Bump it together with RUNNER_VERSION.
  RUNNER_SHA256: "ba46ba7ce3a4d7236b16fbe44419fb453bc08f866b24f04d549ec89f1722a29e"  # pragma: allowlist secret
  HCLOUD_IMAGE: ubuntu-24.04
  # Candidate (server type, location) pairs, tried in order until one is
  # available. Nested KVM needs a dedicated-vCPU (ccx) type.
  HCLOUD_CANDIDATES: >-
    ccx13:fsn1 ccx13:nbg1 ccx13:hel1 ccx23:fsn1 ccx23:nbg1

jobs:
  provision:
    name: Provision runner
    runs-on: ubuntu-24.04
    environment: hetzner
    timeout-minutes: 20
    outputs:
      runner: ${{ steps.create.outputs.runner }}
      server-id: ${{ steps.create.outputs.server-id }}
    steps:
      - name: Confirm the dispatched ref
        env:
          WANT: ${{ inputs.ref }}
          GOT_REF: ${{ github.ref }}
          GOT_SHA: ${{ github.sha }}
        run: |
          if [ "$WANT" != "$GOT_REF" ] && [ "$WANT" != "${GOT_REF#refs/*/}" ] && [ "$WANT" != "$GOT_SHA" ] && [ "${GOT_SHA#"$WANT"}" = "$GOT_SHA" ]; then
            echo "::error::ref input '$WANT' does not match the dispatched $GOT_REF ($GOT_SHA)"
            exit 1
          fi

      - name: Create the server and register a single-use runner
        id: create
        env:
          GH_TOKEN: ${{ secrets.RUNNER_REGISTRATION }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SSH_KEY_ID: ${{ secrets.HCLOUD_SSH_KEY_ID }}
          REPO: ${{ github.repository }}
          LABEL: nails-e2e-${{ github.run_id }}
        run: |
          set -euo pipefail
          # A just-in-time config, not a registration token: it is single-use,
          # ephemeral and expires on its own, so nothing reusable sits in cloud-init.
          jit=$(gh api -X POST "repos/$REPO/actions/runners/generate-jitconfig" \
            -f "name=$LABEL" -F "runner_group_id=1" -f "work_folder=_work" \
            -f "labels[]=self-hosted" -f "labels[]=nails-e2e" -f "labels[]=$LABEL" \
            --jq .encoded_jit_config)
          user_data=$(RUNNER_VERSION="$RUNNER_VERSION" RUNNER_SHA256="$RUNNER_SHA256" JIT="$jit" bash -c '
            cat <<CLOUDINIT
          #cloud-config
          runcmd:
            - [ bash, -c, "export RUNNER_ALLOW_RUNASROOT=1 DEBIAN_FRONTEND=noninteractive
                && apt-get update && apt-get install -y curl tar qemu-kvm
                && mkdir -p /opt/runner && cd /opt/runner
                && curl -fsSL -o runner.tgz https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz
                && echo \"${RUNNER_SHA256}  runner.tgz\" | sha256sum -c -
                && tar xzf runner.tgz && ./bin/installdependencies.sh
                && ./run.sh --jitconfig ${JIT}" ]
          CLOUDINIT')
          # One API availability check, then the candidate ladder.
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" \
            https://api.hetzner.cloud/v1/server_types > /dev/null
          id=""
          for pair in $HCLOUD_CANDIDATES; do
            type=${pair%%:*}; loc=${pair##*:}
            echo "Trying $type in $loc"
            body=$(jq -n --arg n "$LABEL" --arg t "$type" --arg l "$loc" \
              --arg img "$HCLOUD_IMAGE" --arg u "$user_data" --argjson k "[$SSH_KEY_ID]" \
              '{name:$n,server_type:$t,location:$l,image:$img,user_data:$u,ssh_keys:$k,public_net:{enable_ipv4:true,enable_ipv6:true}}')
            resp=$(curl -sS -o /tmp/hz.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
              -d "$body" https://api.hetzner.cloud/v1/servers)
            if [ "$resp" = 201 ]; then
              id=$(jq -r '.server.id' /tmp/hz.json)
              echo "Created server $id ($type/$loc)"
              break
            fi
            echo "::warning::$type/$loc unavailable (HTTP $resp): $(jq -r '.error.message // "?"' /tmp/hz.json)"
            sleep 60
          done
          if [ -z "$id" ]; then
            echo "::error::No candidate server type was available"
            exit 1
          fi
          {
            echo "server-id=$id"
            echo "runner=[\"self-hosted\",\"$LABEL\"]"
          } >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E on Hetzner
    needs: provision
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      mode: ${{ inputs.mode }}
      runner: ${{ needs.provision.outputs.runner }}
      max-shards: ${{ inputs.max-shards }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  teardown:
    name: Delete the server
    needs: [provision, e2e]
    if: always() && needs.provision.outputs.server-id != ''
    runs-on: ubuntu-24.04
    environment: hetzner
    timeout-minutes: 10
    steps:
      - name: Delete the Hetzner server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SERVER_ID: ${{ needs.provision.outputs.server-id }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/servers/$SERVER_ID")
          echo "Delete server $SERVER_ID: HTTP $code"
          case "$code" in 200|202|204|404) ;; *) exit 1 ;; esac
