name: CI

# The pull request gate. The work jobs run in parallel, each gated only on the
# path filter in `changes`, and `gate` is the one status to require: it fails
# when a job failed or was cancelled and passes when the filter skipped one.
# Pushes to main run every job and report a red run through report-status.
# Pull requests into and pushes to `next`, the integration branch, run the
# same way.
# The commands live in the justfile, and `just ci-rust` runs most of the Rust
# jobs locally; the E2E suite has its own workflow and required check.

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push supersedes a pull request's run; runs on main and next always
  # finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# rust-cache hashes every CARGO* and RUST* variable into its key, so the
# cache-warm job in scheduled.yml repeats these two.
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # The path rules live in ci/changes.py. A pull request is compared with the
  # first parent of its merge commit; every other event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      testdata: ${{ steps.filter.outputs.testdata }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      side: ${{ steps.filter.outputs.side }}
      deps: ${{ steps.filter.outputs.deps }}
      nix: ${{ steps.filter.outputs.nix }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
      sbom: ${{ steps.filter.outputs.sbom }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2 # the merge commit and both of its parents
          persist-credentials: false

      - name: Select the jobs this change needs
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 -m ci.changes ${BASE:+--base "$BASE"} >> "$GITHUB_OUTPUT"

  # `just fmt-check` also checks the fuzz crate and the side workspaces, `just
  # lint` runs clippy over the side workspaces, and the file size and orphan
  # module checks cover them as well, so a change to the fuzz crate or to a
  # side workspace runs this job too.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fuzz == 'true' || needs.changes.outputs.side == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # No arguments: rustup installs the channel, components and targets from
      # rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # One cache for the whole workflow, saved only by the rust job on main and
      # next.
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci
          save-if: false

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: just@1.58.0
          fallback: none

      # A manifest change (a version bump, a new dependency) without the
      # matching Cargo.lock update fails here, before anything is built. So
      # does a fuzz/Cargo.lock that such a change leaves stale: the fuzz crate
      # is a workspace of its own, and `just fuzz-lock` rewrites its lock.
      - name: Check that Cargo.lock and fuzz/Cargo.lock are current
        run: just lock-check

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just lint

      - name: Check Rust file sizes
        run: just line-count

      # Every fuzz target is wired into fuzz/Cargo.toml, is more than the
      # scaffold's stub and has a seed that is not empty.
      - name: Check the fuzz targets
        run: just fuzz-targets

      - name: Check for orphan (undeclared) modules
        run: just orphan-modules

  # The tests of the workspace under coverage, and its doctests. It is the one
  # job the testdata filter runs: the files outside the crates that the tests
  # read, such as the JSON schemas and the docs they check.
  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.testdata == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The ci profile in .config/nextest.toml: one retry, a hang limit and a
      # JUnit report at target/nextest/ci/junit.xml.
      NEXTEST_PROFILE: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' }}

      - name: Install test tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.146,just@1.58.0
          fallback: none

      # The prompt syntax tests skip a shell that is not installed. The
      # chrooted-activation kernel test runs a statically linked busybox when
      # the host has no Nix store to bind, and the network way-back kernel
      # tests run nft.
      - name: Install the tools the tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish busybox-static nftables

      # The network way-back kernel tests add dummy links and firewall tables
      # in a network namespace of their own, and NAILS_REQUIRE_USERNS fails
      # them on a kernel without either; a module the runner's kernel lacks
      # fails this step instead.
      - name: Load the modules of the network kernel tests
        run: sudo modprobe -a dummy nf_tables

      # The tests run against an empty private TMPDIR that must still be empty
      # afterwards: a test that leaks temp files makes the suite order-dependent.
      # It lies under /tmp: a kernel test turns the first directory of a scratch
      # path into a link in its test decoy, which has a /home of its own.
      - name: Give the tests a private TMPDIR
        run: echo "TMPDIR=$(mktemp -d /tmp/tests.XXXXXX)" >> "$GITHUB_ENV"

      # The real-kernel tests mount tmpfs and overlayfs in an unprivileged user +
      # mount namespace. AppArmor on ubuntu-26.04 gives such a namespace no
      # capabilities until this sysctl is cleared. NAILS_REQUIRE_USERNS turns a
      # skipped kernel test into a failure, so they cannot pass vacuously here.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The threshold lives in the justfile; the figure goes to the job summary.
      - name: Run tests with coverage
        env:
          NAILS_REQUIRE_USERNS: "1"
        run: just coverage

      - name: Run doctests
        run: just doctest

      - name: Check that the tests left no temp files
        run: |
          leftovers=$(find "$TMPDIR" -mindepth 1)
          if [ -n "$leftovers" ]; then
            echo "::error::The tests left files in TMPDIR; hold a tempfile::TempDir guard instead of calling keep() or mem::forget."
            printf '%s\n' "$leftovers"
            exit 1
          fi

      - name: List failed and FLAKY tests
        if: ${{ !cancelled() }}
        run: python3 -m ci.junit_summary target/nextest/ci/junit.xml

      - name: Upload the JUnit report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 30

  # Order-independence gate for the Rust unit tests. The `rust` job runs the
  # suite through nextest, which isolates each test in its own process and so
  # cannot see a leak through the shared process environment; this job runs the
  # unit tests of every workspace crate threaded over a sweep of shuffled seeds,
  # where such a leak fails. The libtest shuffle flag is unstable, so the test
  # binaries run with RUSTC_BOOTSTRAP, which lets the stable test harness accept
  # it (see the `shuffle` justfile recipe); no nightly toolchain is added.
  shuffle:
    name: shuffle
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci
          save-if: false

      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: just@1.58.0
          fallback: none

      # The suite must leave an empty private TMPDIR, as in the `rust` job.
      - name: Give the tests a private TMPDIR
        run: echo "TMPDIR=$(mktemp -d "$RUNNER_TEMP/tests.XXXXXX")" >> "$GITHUB_ENV"

      - name: Run the shuffled-seed sweep
        run: just shuffle

  # The tests of the side workspaces (setup/ and gui/), each a Cargo workspace
  # of its own that the rust job does not reach; lint checks their formatting
  # and clippy. The gui/ tests run under coverage, which fails the job below the
  # floor in gui/.config/coverage.toml. The rust filter holds the toolchain pin,
  # the cargo config and the justfile, which decide how these tests run too. No
  # Rust cache: the shared one holds the root workspace's target/, and each side
  # workspace builds into a target/ of its own.
  side-tests:
    name: side-tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.side == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install test tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.146,just@1.58.0
          fallback: none

      # nextest's default profile: the side workspaces have no
      # .config/nextest.toml, so the ci profile of the rust job does not exist
      # for them. The gui/ figure goes to the job summary.
      - name: Run the side workspaces' tests
        run: just side-tests

      - name: Upload the gui/ coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gui-coverage-report
          path: gui/target/coverage/
          retention-days: 30

  # Dependency policy over the shipped graph: `just deny` checks the root
  # workspace against deny.toml and the gui/ workspace against gui/deny.toml,
  # and the expiry check reads both files. Advisory results follow the RustSec
  # database rather than this repository, so they only gate a change to the
  # dependencies or their policy; scheduled.yml scans the full graph weekly and
  # never gates a merge.
  deps:
    name: deps
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # cargo-deny reads the graph through `cargo metadata`.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install policy tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-deny@0.20.2,just@1.58.0
          fallback: none

      - name: Check bans, licenses and sources
        run: just deny bans licenses sources

      - name: Check advisories
        if: needs.changes.outputs.deps == 'true'
        run: just deny advisories

      - name: Check deny.toml ignore expiry
        if: needs.changes.outputs.deps == 'true'
        run: python3 ci/deny_ignores.py

  # The supply-chain gate of the gui/ workspace, in place before the toolkit of
  # the graphical interface lands: cargo-vet fails on a third-party crate of
  # its graph that no audit or exemption under gui/supply-chain/ covers, the
  # audits imported from the public sets its config.toml names among them. The
  # root workspace's own vet.yml lane only reports. --locked reads the committed
  # gui/supply-chain/imports.lock. The rust filter holds the justfile, and the
  # nix filter the flake lock that pins cargo-vet, which decide how it runs too.
  gui-vet:
    name: gui-vet
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.side == 'true' || needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # cargo-vet reads the graph through `cargo metadata`.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # cargo-vet comes from the flake's pinned nixpkgs, the same build the dev
      # shell and vet.yml use; the install-action manifest stops at a release
      # that cannot parse the trusted-publisher entries newer ones record.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Audit the gui/ dependency graph
        run: nix shell --inputs-from . nixpkgs#cargo-vet nixpkgs#just --command just vet gui

  # Real overlayfs as real root in a private mount namespace, for the three
  # #[ignore]'d privileged_mounts tests a user namespace cannot run (directory
  # whiteouts, the opaque directories the kernel-modules check reads and the
  # whole upper-filesystem probe need trusted.* xattrs); the rust job runs the
  # rest rootless. It is built unprivileged and run as root.
  privileged-mounts:
    name: privileged-mounts
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci
          save-if: false

      # AppArmor on ubuntu-26.04 blocks unprivileged user namespaces, so only
      # the run step is elevated.
      - name: Build privileged test binary
        id: build
        run: |
          bin=$(cargo test -p nails-core --test privileged_mounts --no-run --locked --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "privileged_mounts") | .executable // empty')
          test -n "$bin" || { echo "::error::No privileged_mounts test binary was built"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # The private mount namespace keeps every mount invisible to the host and
      # discards them all when the process exits.
      - name: Run privileged mount tests
        env:
          BIN: ${{ steps.build.outputs.bin }}
        run: sudo unshare --mount --propagation private "$BIN" --ignored --test-threads=1

  # The canonical release derivation and a smoke test of its archive, then the
  # flake package of the gui/ workspace and a run of its binary. The side filter
  # holds gui/, which the release does not build from.
  nix-build:
    name: nix-build
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.nix == 'true' || needs.changes.outputs.side == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          # Fork pull requests receive no secrets, and the action pushes only
          # for trusted events, so the token needs no environment.
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Build the release bundle
        run: nix build -L .#nails-release -o result --option accept-flake-config false

      - name: Smoke-test the release archive
        run: |
          smoke=$(mktemp -d)
          tar -xzf result/nails-*.tar.gz -C "$smoke"
          dir=$(find "$smoke" -mindepth 1 -maxdepth 1 -type d -name 'nails-*')
          test -f "$dir/LICENSE"
          test -f "$dir/README.md"
          "$dir/nails" --version
          cd result && sha256sum --check --strict checksums.txt

      - name: Build the gui/ package
        run: nix build -L .#nails-gui -o result-gui --option accept-flake-config false

      # The binary is a placeholder that prints its version and exits.
      - name: Smoke-test the gui/ binary
        run: result-gui/bin/nails-gui

  # The CI tooling tests and the cheap flake checks: nixfmt, statix, deadnix,
  # shellcheck, actionlint, zizmor, the ci/ Python lints and the E2E shard
  # weights.
  lint-misc:
    name: lint-misc
    needs: changes
    if: needs.changes.outputs.nix == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test the CI and E2E tooling
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s ci/tests -t . -v

      - name: Lint E2E synchronisation patterns
        run: python3 -m ci.e2e_sync_lint

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run the flake checks
        run: nix flake check -L --option accept-flake-config false

      - name: Check SPDX/REUSE licensing
        run: nix develop --command reuse lint

  # The cheap documentation gate: link-check the Markdown and reject retired
  # names. No build, so it stays in the fast lane and runs on docs-only changes.
  docs-check:
    name: docs-check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # lychee comes from the flake's pinned nixpkgs, the same build the dev
      # shell uses (install-action has no lychee and must not fall back).
      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Check the documentation
        run: nix shell --inputs-from . nixpkgs#lychee --command ./scripts/docs-check.sh

  # The release SBOM and VEX document, written and checked by the workflow
  # release.yml calls, but never attested. An SBOM that actions/attest would
  # refuse fails here, on main or on the pull request, instead of in a
  # release run, where the tag cannot be fixed any more.
  sbom:
    name: sbom
    needs: changes
    if: needs.changes.outputs.sbom == 'true'
    uses: ./.github/workflows/sbom.yml

  # The one required status. A job the path filter skipped counts as passed.
  gate:
    name: gate
    needs: [changes, lint, rust, shuffle, side-tests, deps, gui-vet, privileged-mounts, nix-build, lint-misc, docs-check, sbom]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      # report-status reads the results of the work jobs through this.
      needs: ${{ toJSON(needs) }}

    steps:
      - name: Check the outcome
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$NEEDS" >> "$GITHUB_STEP_SUMMARY"
          red=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "$NEEDS")
          if [ -n "$red" ]; then
            echo "::error::Failed or cancelled: $red"
            exit 1
          fi

  # A push to main or next runs unattended: a red run opens or comments on the
  # 'CI red: main' or 'CI red: next' issue, and a later run on that branch
  # where every job passes closes it.
  report-status:
    name: report-status
    needs: gate
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on and close the tracking issue

    steps:
      - name: Checkout the report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-status

      - name: Report status
        uses: ./.github/actions/report-status
        with:
          needs: ${{ needs.gate.outputs.needs }}
          title: "CI red: ${{ github.ref_name }}"
