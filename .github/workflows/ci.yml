name: CI

# The pull request gate. The work jobs run in parallel, each gated only on the
# path filter in `changes`, and `gate` is the one status to require: it fails
# when a job failed or was cancelled and passes when the filter skipped one.
# Pushes to main run every job and report a red run through report-status.
# The commands live in the justfile, so `just ci-rust` reproduces the Rust
# jobs locally; the E2E suite has its own workflow and required check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      distro-runner:
        description: >-
          runs-on label for the distro container smoke jobs. A hosted
          ubuntu-24.04 runs the privileged containers directly; override for a
          self-hosted runner.
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push supersedes a pull request's run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# rust-cache hashes every CARGO* and RUST* variable into its key, so the
# cache-warm job in scheduled.yml repeats these two.
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # The path rules live in ci/changes.py. A pull request is compared with the
  # first parent of its merge commit; every other event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      deps: ${{ steps.filter.outputs.deps }}
      nix: ${{ steps.filter.outputs.nix }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2 # the merge commit and both of its parents
          persist-credentials: false

      - name: Select the jobs this change needs
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 -m ci.changes ${BASE:+--base "$BASE"} >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # No arguments: rustup installs the channel, components and targets from
      # rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # One cache for the whole workflow, saved only by the rust job on main.
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: ci
          save-if: false

      - name: Install just
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1
        with:
          tool: just@1.49.0
          fallback: none

      # A manifest change (a version bump, a new dependency) without the
      # matching Cargo.lock update fails here, before anything is built.
      - name: Check that Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just lint

      - name: Check Rust file sizes
        run: just line-count

      - name: Check for orphan (undeclared) modules
        run: ./scripts/check-orphan-modules.sh

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The ci profile in .config/nextest.toml: one retry, a hang limit and a
      # JUnit report at target/nextest/ci/junit.xml.
      NEXTEST_PROFILE: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install test tools
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1
        with:
          tool: cargo-llvm-cov@0.8.4,cargo-nextest@0.9.72,just@1.49.0
          fallback: none

      # The prompt syntax tests skip a shell that is not installed.
      - name: Install shells for prompt syntax tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      # The tests run against an empty private TMPDIR that must still be empty
      # afterwards: a test that leaks temp files makes the suite order-dependent.
      - name: Give the tests a private TMPDIR
        run: echo "TMPDIR=$(mktemp -d "$RUNNER_TEMP/tests.XXXXXX")" >> "$GITHUB_ENV"

      # The real-kernel tests mount tmpfs and overlayfs in an unprivileged user +
      # mount namespace. AppArmor on ubuntu-24.04 gives such a namespace no
      # capabilities until this sysctl is cleared. NAILS_REQUIRE_USERNS turns a
      # skipped kernel test into a failure, so they cannot pass vacuously here.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The threshold lives in the justfile; the figure goes to the job summary.
      - name: Run tests with coverage
        env:
          NAILS_REQUIRE_USERNS: "1"
        run: just coverage

      - name: Run doctests
        run: just doctest

      - name: Check that the tests left no temp files
        run: |
          leftovers=$(find "$TMPDIR" -mindepth 1)
          if [ -n "$leftovers" ]; then
            echo "::error::The tests left files in TMPDIR; hold a tempfile::TempDir guard instead of calling keep() or mem::forget."
            printf '%s\n' "$leftovers"
            exit 1
          fi

      - name: List failed and FLAKY tests
        if: ${{ !cancelled() }}
        run: python3 -m ci.junit_summary target/nextest/ci/junit.xml

      - name: Upload the JUnit report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: target/coverage/
          retention-days: 30

  # Order-independence gate for the Rust unit tests. The `rust` job runs the
  # suite through nextest, which isolates each test in its own process and so
  # cannot see a leak through the shared process environment; this job runs both
  # crates' unit tests threaded over a sweep of shuffled seeds, where such a
  # leak fails. The libtest shuffle flag is unstable, so RUSTC_BOOTSTRAP lets the
  # pinned stable compiler accept it (see the `shuffle` justfile recipe); no
  # nightly toolchain is added.
  shuffle:
    name: shuffle
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: ci
          save-if: false

      - name: Install just
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1
        with:
          tool: just@1.49.0
          fallback: none

      # The suite must leave an empty private TMPDIR, as in the `rust` job.
      - name: Give the tests a private TMPDIR
        run: echo "TMPDIR=$(mktemp -d "$RUNNER_TEMP/tests.XXXXXX")" >> "$GITHUB_ENV"

      - name: Run the shuffled-seed sweep
        run: just shuffle

  # Dependency policy over the shipped graph. Advisory results follow the
  # RustSec database rather than this repository, so they only gate a change
  # to the dependencies or their policy; scheduled.yml scans the full graph
  # weekly and never gates a merge.
  deps:
    name: deps
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # cargo-deny reads the graph through `cargo metadata`.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install policy tools
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1
        with:
          tool: cargo-deny@0.19.1,just@1.49.0
          fallback: none

      - name: Check bans, licenses and sources
        run: just deny bans licenses sources

      - name: Check advisories
        if: needs.changes.outputs.deps == 'true'
        run: just deny advisories

      - name: Check deny.toml ignore expiry
        if: needs.changes.outputs.deps == 'true'
        run: python3 ci/deny_ignores.py

  # Real overlayfs as real root in a private mount namespace, for the one
  # #[ignore]'d privileged_mounts test a user namespace cannot run (directory
  # whiteouts need trusted.* xattrs); the rust job runs the rest rootless. It
  # is built unprivileged and run as root.
  privileged-mounts:
    name: privileged-mounts
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: ci
          save-if: false

      # AppArmor on ubuntu-24.04 blocks unprivileged user namespaces, so only
      # the run step is elevated.
      - name: Build privileged test binary
        id: build
        run: |
          bin=$(cargo test -p nails-core --test privileged_mounts --no-run --locked --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "privileged_mounts") | .executable // empty')
          test -n "$bin" || { echo "::error::No privileged_mounts test binary was built"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # The private mount namespace keeps every mount invisible to the host and
      # discards them all when the process exits.
      - name: Run privileged mount tests
        env:
          BIN: ${{ steps.build.outputs.bin }}
        run: sudo unshare --mount --propagation private "$BIN" --ignored --test-threads=1

  # The cheap, KVM-free distribution smoke tier: the static musl binary driven
  # through the overlay-only lifecycle inside a privileged systemd container for
  # each supported FHS distribution. It runs on every PR that touches the Rust
  # crates (the `rust` filter already matches nails-core/ and nails-cli/), but is
  # NOT part of `gate` -- it stays informational until promoted, matching the
  # KVM-based `distro-e2e.yml` VM tier it complements (see docs/ci.md).
  distro-smoke:
    name: distro-smoke (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ inputs.distro-runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, debian:13, ubuntu:24.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: ci
          save-if: false

      # Docker needs root to boot a privileged container; the build runs as the
      # workflow user, so only the driver is elevated and the binary is built
      # ahead of it.
      - name: Build the static musl binary
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --locked --target x86_64-unknown-linux-musl -p nails-cli

      - name: Run the container smoke scenario
        env:
          NAILS_BIN: target/x86_64-unknown-linux-musl/release/nails
        run: sudo --preserve-env=NAILS_BIN scripts/distro-smoke/run.sh "${{ matrix.image }}"

  # The canonical release derivation and a smoke test of its archive.
  nix-build:
    name: nix-build
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          # Fork pull requests receive no secrets, and the action pushes only
          # for trusted events, so the token needs no environment.
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Build the release bundle
        run: nix build -L .#nails-release -o result --option accept-flake-config false

      - name: Smoke-test the release archive
        run: |
          smoke=$(mktemp -d)
          tar -xzf result/nails-*.tar.gz -C "$smoke"
          dir=$(find "$smoke" -mindepth 1 -maxdepth 1 -type d -name 'nails-*')
          test -f "$dir/LICENSE"
          test -f "$dir/README.md"
          "$dir/nails" --version
          cd result && sha256sum --check --strict checksums.txt

  # The CI tooling tests and the cheap flake checks: nixfmt, statix, deadnix,
  # shellcheck, actionlint, zizmor, the ci/ Python lints and the E2E shard
  # weights.
  lint-misc:
    name: lint-misc
    needs: changes
    if: needs.changes.outputs.nix == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Test the CI and E2E tooling
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s ci/tests -t . -v

      - name: Lint E2E synchronisation patterns
        run: python3 -m ci.e2e_sync_lint

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Run the flake checks
        run: nix flake check -L --option accept-flake-config false

      - name: Check SPDX/REUSE licensing
        run: nix develop --command reuse lint

  # The cheap documentation gate: link-check the Markdown and reject retired
  # names. No build, so it stays in the fast lane and runs on docs-only changes.
  docs-check:
    name: docs-check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install lychee
        uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1
        with:
          tool: lychee
          fallback: none

      - name: Check the documentation
        run: ./scripts/docs-check.sh

  # The one required status. A job the path filter skipped counts as passed.
  gate:
    name: gate
    needs: [changes, lint, rust, shuffle, deps, privileged-mounts, nix-build, lint-misc, docs-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # report-status reads the results of the work jobs through this.
      needs: ${{ toJSON(needs) }}

    steps:
      - name: Check the outcome
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$NEEDS" >> "$GITHUB_STEP_SUMMARY"
          red=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "$NEEDS")
          if [ -n "$red" ]; then
            echo "::error::Failed or cancelled: $red"
            exit 1
          fi

  # A push to main runs unattended: a red run opens or comments on the
  # 'CI red: main' issue, and the next run where every job passes closes it.
  report-status:
    name: report-status
    needs: gate
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on and close the tracking issue

    steps:
      - name: Checkout the report action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-status

      - name: Report status
        uses: ./.github/actions/report-status
        with:
          needs: ${{ needs.gate.outputs.needs }}
          title: "CI red: main"
