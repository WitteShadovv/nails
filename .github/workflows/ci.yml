name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COVERAGE_THRESHOLD: 100

jobs:
  # Job 1: Format Check
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: Lint
  lint:
    name: Clippy Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Job 3: Test
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run tests
        run: cargo test --all-features --workspace

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/debug/**/*.log
          retention-days: 30

  # Job 4: Coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"
          cache-targets: "true"
          cache-all-crates: "true"

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage analysis
        run: |
          cargo tarpaulin \
            --out Xml \
            --out Html \
            --output-dir ./coverage \
            --timeout 300 \
            --fail-under 100 \
            --all-features \
            --workspace

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Extract coverage percentage
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
          echo "COVERAGE_PCT=${COVERAGE_PCT}" >> $GITHUB_ENV
          echo "📊 Coverage: ${COVERAGE_PCT}%"

      - name: Post coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            ## 📊 Code Coverage Report

            **Coverage:** ${{ env.COVERAGE_PCT }}%
            **Threshold:** 100%

            ${{ env.COVERAGE_PCT == '100' && '✅ Coverage meets requirements' || '❌ Coverage below threshold - TDD requires 100%' }}

            [View full report](../actions/runs/${{ github.run_id }})

  # Job 5: Security Audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "audit"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit --deny high

  # Job 6: Benchmark
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "benchmark"

      - name: Check if benchmarks are real
        run: |
          if grep -q "placeholder" benches/performance.rs; then
            echo "⚠️ Benchmarks are placeholder, skipping benchmark execution"
            echo "Real benchmarks will be implemented in Epic 4 (Activation Command)"
            exit 0
          fi

      - name: Run benchmarks
        run: cargo bench --all-features

      - name: Check performance targets (RQ2)
        run: |
          echo "🎯 Performance Targets (RQ2):"
          echo "  - Activation: p95 < 5.0s"
          echo "  - Emergency: p95 < 3.0s"
          echo "  - Status: p95 < 500ms"
          echo ""
          echo "📊 Benchmark results available in target/criterion/"

      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 90

  # Final validation
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [format-check, lint, test, coverage, audit, benchmark]
    if: always()

    steps:
      - name: Validate all jobs passed
        run: |
          if [[ "${{ needs.format-check.result }}" != "success" ]]; then
            echo "❌ Format check failed"
            exit 1
          fi

          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Clippy lint failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "❌ Coverage below 100% threshold"
            exit 1
          fi

          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "❌ Security audit failed (vulnerabilities detected)"
            exit 1
          fi

          # Benchmark is optional (may be skipped if placeholder)
          if [[ "${{ needs.benchmark.result }}" == "failure" ]]; then
            echo "⚠️ Benchmarks failed (non-blocking for now)"
          fi

          echo "✅ All required CI checks passed!"
