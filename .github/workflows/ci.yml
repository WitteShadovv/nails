name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    # Run burn-in weekly (Sundays at 2am UTC)
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  COVERAGE_THRESHOLD: 85

jobs:
  # Stage 1: Lint and format checks
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "lint"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Enforce 500-line limit on Rust files
        run: ./scripts/check-line-count.sh

  # Stage 2: Security audit for dependency vulnerabilities
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "audit"

      - name: Install audit tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-audit@0.22.0,cargo-deny@0.18.9
          fallback: none

      - name: Generate audit report (JSON)
        run: |
          mkdir -p target
          cargo audit --json > target/audit-report.json

      - name: Run dependency policy check (cargo-deny)
        run: |
          cargo deny check advisories licenses bans sources

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: audit-report
          path: target/audit-report.json
          retention-days: 30

  # Stage 3: Test execution with parallel sharding
  test:
    name: Test (Shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "test-shard-${{ matrix.shard }}"

      - name: Install cargo-nextest
        run: cargo install cargo-nextest@0.9.72 --locked

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: |
          cargo nextest run \
            --partition count:${{ matrix.shard }}/4 \
            --no-fail-fast \
            --status-level all

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            target/nextest/**/*.xml
            target/debug/**/*.log
          retention-days: 30

  # Stage 4: Coverage enforcement (85% required for TDD)
  coverage:
    name: Coverage Enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "coverage"
          cache-targets: "true"
          cache-all-crates: "true"

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov@0.8.4 --locked

      - name: Run coverage analysis
        run: |
          mkdir -p coverage
          cargo llvm-cov \
            --all-features \
            --workspace \
            --all-targets \
            --cobertura --output-path ./coverage/cobertura.xml
          cargo llvm-cov \
            --all-features \
            --workspace \
            --all-targets \
            --lcov --output-path ./coverage/lcov.info \
            --no-run
          cargo llvm-cov \
            --all-features \
            --workspace \
            --all-targets \
            --html --output-dir ./coverage/html \
            --no-run

      - name: Enforce 85% coverage threshold
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)

          echo "Coverage: ${COVERAGE_PCT}%"
          echo "Required: ${COVERAGE_THRESHOLD}%"
          echo "COVERAGE_PCT=${COVERAGE_PCT}" >> "$GITHUB_ENV"

          if (( $(echo "$COVERAGE_PCT < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "Coverage below threshold: ${COVERAGE_PCT}% < ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false

      - name: Post coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: coverage
          message: |
            ## Code Coverage Report

            **Coverage:** ${{ env.COVERAGE_PCT }}%
            **Threshold:** ${{ env.COVERAGE_THRESHOLD }}%

            ${{ env.COVERAGE_PCT >= env.COVERAGE_THRESHOLD && 'Coverage meets requirements' || 'Coverage below threshold' }}

            [View full report](../actions/runs/${{ github.run_id }})

  # Stage 5: SBOM Generation (CycloneDX)
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "sbom"

      - name: Install cargo-sbom
        run: cargo install cargo-sbom@0.10.0 --locked

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          cargo sbom --output-format cyclone_dx_json_1_6 > sbom/sbom.cdx.json

      - name: Install CycloneDX CLI for validation
        run: |
          curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.27.1/cyclonedx-linux-x64 -o /tmp/cyclonedx-cli
          chmod +x /tmp/cyclonedx-cli

      - name: Validate SBOM format
        run: /tmp/cyclonedx-cli validate --input-file sbom/sbom.cdx.json --input-format json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 90

  # Stage 6: Unsafe code audit (cargo-geiger)
  geiger:
    name: Unsafe Code Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "geiger"

      - name: Install cargo-geiger
        run: cargo install cargo-geiger@0.13.0 --locked

      - name: Run unsafe code audit
        run: |
          echo "=== Unsafe Code Usage Report ==="
          cargo geiger --all-features --all-targets 2>&1 | tee target/geiger-report.txt || true
          echo "=== Report complete ==="
          echo "Note: This is an informational audit. Review unsafe usage above."

      - name: Upload geiger report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geiger-report
          path: target/geiger-report.txt
          retention-days: 30

  # Stage 7: Burn-in loop for flaky test detection
  burn-in:
    name: Burn-In Loop (Flaky Detection)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: coverage
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(fromJson('["main", "dev"]'), github.base_ref)) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "burn-in"

      - name: Run burn-in loop (10 iterations)
        run: |
          for i in {1..10}; do
            echo "Burn-in iteration $i/10"
            if ! cargo test --all-features --workspace; then
              echo "FLAKY TEST DETECTED on iteration $i/10"
              exit 1
            fi
          done
          echo "All 10 iterations passed - no flaky tests detected"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: burn-in-failures
          path: |
            target/debug/**/*.log
            target/tmp/**
          retention-days: 30

  # Stage 7: Performance benchmarks (Criterion)
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.93.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: "benchmarks"

      - name: Run benchmarks
        run: |
          cargo bench -p nails-core --bench performance --all-features
          cargo bench -p nails-cli --bench startup --all-features

      - name: Check benchmark budgets
        run: |
          # Budget thresholds in nanoseconds (generous initial values)
          declare -A BUDGETS=(
            ["config_default"]=1000000            # 1 ms
            ["config_builder"]=2000000            # 2 ms
            ["state_file_default"]=1000000        # 1 ms
            ["state_serialize_json"]=5000000      # 5 ms
            ["state_deserialize_json"]=5000000    # 5 ms
            ["state_save_load_roundtrip"]=10000000 # 10 ms
            ["manager_new_mock"]=5000000          # 5 ms
            ["status_query_current_state"]=5000000 # 5 ms
            ["status"]=10000000                   # 10 ms
            ["activate_subsequent"]=50000000      # 50 ms
            ["emergency_cleanup"]=50000000        # 50 ms
            ["state_transition_inactive_to_activating"]=1000000  # 1 ms
            ["state_transition_full_cycle"]=2000000              # 2 ms
            ["build_overlay_targets"]=5000000     # 5 ms
            ["apply_exclusion_filter_50dirs"]=1000000             # 1 ms
            ["cli_parse_time"]=5000000            # 5 ms
          )

          failed=0
          for bench_name in "${!BUDGETS[@]}"; do
            estimates_file="target/criterion/${bench_name}/new/estimates.json"
            if [ ! -f "$estimates_file" ]; then
              echo "SKIP: ${bench_name} (no results found)"
              continue
            fi

            # Extract mean point_estimate (nanoseconds)
            mean_ns=$(python3 -c "
          import json, sys
          with open('${estimates_file}') as f:
              data = json.load(f)
          print(int(data['mean']['point_estimate']))
          ")
            budget_ns=${BUDGETS[$bench_name]}
            mean_ms=$(python3 -c "print(f'{${mean_ns}/1e6:.3f}')")
            budget_ms=$(python3 -c "print(f'{${budget_ns}/1e6:.3f}')")

            if [ "$mean_ns" -gt "$budget_ns" ]; then
              echo "FAIL: ${bench_name}: ${mean_ms}ms > budget ${budget_ms}ms"
              failed=1
            else
              echo "PASS: ${bench_name}: ${mean_ms}ms <= budget ${budget_ms}ms"
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "Benchmark budget check FAILED"
            exit 1
          fi
          echo "All benchmark budgets passed"

      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 90

  # Final status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs: [lint, audit, test, coverage, sbom, geiger, burn-in, benchmarks]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi

          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "Security audit failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "Coverage job failed (85% required)"
            exit 1
          fi

          if [[ "${{ needs.sbom.result }}" != "success" ]]; then
            echo "SBOM generation failed"
            exit 1
          fi

          if [[ "${{ needs.geiger.result }}" == "failure" ]]; then
            echo "Unsafe code audit failed"
            exit 1
          fi

          # burn-in and benchmarks are conditional (may be skipped)
          if [[ "${{ needs.burn-in.result }}" == "failure" ]]; then
            echo "Burn-in detected flaky tests"
            exit 1
          fi

          if [[ "${{ needs.benchmarks.result }}" == "failure" ]]; then
            echo "Benchmarks failed"
            exit 1
          fi

          echo "All CI checks passed"
