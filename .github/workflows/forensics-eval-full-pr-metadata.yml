name: Full Forensics Eval PR Metadata

on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'nails-core/**'
      - 'nails-cli/**'
      - 'nix/**'
      - 'scripts/run-forensics-eval-tests.sh'
      - '.github/workflows/forensics-eval-full.yml'
      - '.github/workflows/forensics-eval-full-pr-metadata.yml'
      - '.github/workflows/forensics-eval-full-shard.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: full-forensics-eval-pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record-pr-metadata:
    name: Record pull_request_target metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Record metadata-only PR context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            cat <<'EOF'
          ## pull_request_target metadata only

          This workflow is intentionally metadata-only. It does not provision runners, check out code, call reusable Hetzner workflows, or execute PR head content.
          Run `forensics-eval-full.yml` manually with workflow_dispatch from a trusted context if a full eval is required.

          | Property | Value |
          |---|---|
          EOF
            printf "| PR | \`#%s\` |\n" "$PR_NUMBER"
            printf "| Head repository | \`%s\` |\n" "$HEAD_REPOSITORY"
            printf "| Head SHA | \`%s\` |\n" "$HEAD_SHA"
            printf "| Base branch | \`%s\` |\n" "$BASE_REF"
          } >> "$GITHUB_STEP_SUMMARY"
