name: Hetzner PR Approval

on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: hetzner-pr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  process-approval:
    name: Process metadata-only Hetzner approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Process PR approval labels without checking out code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          event_path = os.environ["GITHUB_EVENT_PATH"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          approval_labels = {
              "safe-to-test:e2e-full": {
                  "workflow": "e2e-tests-full.yml",
                  "context": "Hetzner / Full E2E",
              },
              "safe-to-test:forensics-full": {
                  "workflow": "forensics-eval-full.yml",
                  "context": "Hetzner / Full Forensics Eval",
              },
          }
          allowed_permissions = {"write", "maintain", "admin"}

          with open(event_path, encoding="utf-8") as fh:
              event = json.load(fh)

          action = event["action"]
          pr = event["pull_request"]
          pr_number = pr["number"]
          pr_head = pr["head"]
          pr_labels = {label["name"] for label in pr.get("labels", [])}
          head_sha = pr_head["sha"]
          checkout_repository = pr_head["repo"]["full_name"]
          checkout_ref = pr_head["ref"]
          pr_is_fork = str(pr_head["repo"].get("fork", False)).lower()
          sender = event["sender"]["login"]
          processed = []

          def request(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api_url}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8")
                  raise RuntimeError(f"GitHub API {method} {path} failed with {exc.code}: {body}") from exc

          def request_allow_404(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api_url}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  body = exc.read().decode("utf-8")
                  raise RuntimeError(f"GitHub API {method} {path} failed with {exc.code}: {body}") from exc

          def set_status(status_repo, sha, context, state, description):
              description = description[:140]
              if status_repo != repo:
                  processed.append(
                      f"Skipped status `{context}` on fork head `{status_repo}@{sha}`; repository token cannot truthfully guarantee cross-repo status writes."
                  )
                  return
              try:
                  request(
                      "POST",
                      f"/repos/{status_repo}/statuses/{sha}",
                      {
                          "state": state,
                          "context": context,
                          "description": description,
                          "target_url": f"{event['repository']['html_url']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                      },
                  )
                  processed.append(f"Set status `{context}` to `{state}` on `{sha}`.")
              except RuntimeError as exc:
                  processed.append(f"Warning: unable to set status `{context}` on `{sha}`: {exc}")

          def remove_label(label_name):
              encoded = urllib.parse.quote(label_name, safe="")
              status, _ = request_allow_404("DELETE", f"/repos/{repo}/issues/{pr_number}/labels/{encoded}")
              if status == 404:
                  processed.append(f"Label `{label_name}` was already absent.")
              else:
                  processed.append(f"Removed label `{label_name}` from PR #{pr_number}.")

          if action == "synchronize":
              for label_name in sorted(pr_labels & approval_labels.keys()):
                  remove_label(label_name)
                  set_status(
                      checkout_repository,
                      head_sha,
                      approval_labels[label_name]["context"],
                      "pending",
                      "Approval invalidated by new commits; re-apply maintainer label.",
                  )
          elif action == "unlabeled":
              label_name = event.get("label", {}).get("name", "")
              if label_name in approval_labels:
                  if sender == "github-actions[bot]":
                      processed.append(
                          f"Ignored auto-generated unlabeled event for `{label_name}` from `{sender}`."
                      )
                  else:
                      set_status(
                          checkout_repository,
                          head_sha,
                          approval_labels[label_name]["context"],
                          "pending",
                          "Waiting for maintainer approval label.",
                      )
          elif action == "labeled":
              label_name = event.get("label", {}).get("name", "")
              if label_name in approval_labels:
                  _, permission = request_allow_404("GET", f"/repos/{repo}/collaborators/{sender}/permission")
                  actor_permission = permission.get("permission", "none") if permission else "none"
                  if actor_permission not in allowed_permissions:
                      remove_label(label_name)
                      set_status(
                          checkout_repository,
                          head_sha,
                          approval_labels[label_name]["context"],
                          "failure",
                          f"Label ignored: {sender} lacks write/maintain/admin permission.",
                      )
                      processed.append(
                          f"Refused label `{label_name}` because `{sender}` has `{actor_permission}` permission."
                      )
                  else:
                      request(
                          "POST",
                          f"/repos/{repo}/actions/workflows/{approval_labels[label_name]['workflow']}/dispatches",
                          {
                              "ref": "main",
                              "inputs": {
                                  "pr_number": str(pr_number),
                                  "approved_sha": head_sha,
                                  "checkout_repository": checkout_repository,
                                  "checkout_ref": checkout_ref,
                                  "approval_label": label_name,
                                  "approval_actor": sender,
                                  "pr_is_fork": pr_is_fork,
                              },
                          },
                      )
                      processed.append(
                          f"Dispatched `{approval_labels[label_name]['workflow']}` for PR #{pr_number} at `{head_sha}`."
                      )
                      set_status(
                          checkout_repository,
                          head_sha,
                          approval_labels[label_name]["context"],
                          "pending",
                          f"Approved by {sender}; trusted follow-up workflow dispatched.",
                      )
          else:
              processed.append(
                  f"No metadata action required for pull_request_target action `{action}`."
              )

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Hetzner PR approval\n\n")
              summary.write("This workflow is metadata-only and never checks out or executes PR code.\n\n")
              summary.write("| Property | Value |\n")
              summary.write("|---|---|\n")
              summary.write(f"| Action | `{action}` |\n")
              summary.write(f"| PR | `#{pr_number}` |\n")
              summary.write(f"| Head SHA | `{head_sha}` |\n")
              summary.write(f"| Sender | `{sender}` |\n")
              summary.write("\n")
              for item in processed:
                  summary.write(f"- {item}\n")
          PY
