name: Publish Stable Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact stable tag to publish (for example v0.2.0)
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Publish immutable stable release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-core.yml
    with:
      release-tag: ${{ inputs.tag }}
      publication-mode: stable
