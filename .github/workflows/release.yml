name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.metadata.outputs.package-version }}
      artifact-prefix: ${{ steps.metadata.outputs.artifact-prefix }}
      publish-release: ${{ steps.metadata.outputs.publish-release }}
      rolling-tag: ${{ steps.metadata.outputs.rolling-tag }}
      release-name: ${{ steps.metadata.outputs.release-name }}
      release-notes: ${{ steps.metadata.outputs.release-notes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive build metadata
        id: metadata
        run: |
          workspace_version=""
          short_sha=""
          package_version=""
          artifact_prefix=""
          publish_release="false"
          rolling_tag=""
          release_name=""
          release_notes=""

          workspace_version=$(python - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as fh:
              data = tomllib.load(fh)
          print(data['workspace']['package']['version'])
          PY
          )
          short_sha=$(git rev-parse --short=12 HEAD)

          case "${GITHUB_REF_NAME}" in
            main)
              package_version="main"
              artifact_prefix="main-release-${short_sha}"
              publish_release="true"
              rolling_tag="main-latest"
              release_name="Main rolling build"
              release_notes=$(cat <<EOF
          Automated reproducible build from \'main\'.

          - Commit: ${GITHUB_SHA}
          - Source version: ${workspace_version}
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
              ;;
            dev)
              package_version="dev-${short_sha}"
              artifact_prefix="dev-release-${short_sha}"
              release_name="Dev validation build"
              release_notes=$(cat <<EOF
          Validation-only reproducible build from \'dev\'.

          - Commit: ${GITHUB_SHA}
          - Source version: ${workspace_version}
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
              ;;
            *)
              echo "Unsupported ref ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          {
            echo "package-version=${package_version}"
            echo "artifact-prefix=${artifact_prefix}"
            echo "publish-release=${publish_release}"
            echo "rolling-tag=${rolling_tag}"
            echo "release-name=${release_name}"
            echo "release-notes<<EOF"
            printf '%s\n' "${release_notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@43082b822f2e4b696046793cdd9e9b5da14f3d75
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Build canonical release artifact
        run: nix build -L .#nails -o result --option accept-flake-config false

      - name: Package release assets
        run: |
          source_date_epoch=""
          mkdir -p dist
          source_date_epoch=$(git log -1 --format=%ct HEAD)
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          ./.github/scripts/package-release.sh \
            --binary result/bin/nails \
            --version "${{ steps.metadata.outputs.package-version }}" \
            --target x86_64-unknown-linux-musl \
            --out-dir dist

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/
          retention-days: 14

  reproducibility:
    name: Verify reproducibility
    needs: build-release
    permissions:
      contents: read
    uses: ./.github/workflows/reproducibility.yml
    with:
      git-ref: ${{ github.sha }}
      flake-attr: .#nails
      artifact-prefix: ${{ needs.build-release.outputs.artifact-prefix }}

  attest-release:
    name: Attest release assets
    runs-on: ubuntu-24.04
    needs: [build-release, reproducibility]
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist

      - name: Create GitHub artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-checksums: dist/SHA256SUMS

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    if: needs.build-release.outputs.publish-release == 'true'
    needs: [build-release, attest-release]
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist

      - name: Publish rolling main release
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: ${{ needs.build-release.outputs.rolling-tag }}
          RELEASE_NAME: ${{ needs.build-release.outputs.release-name }}
          RELEASE_NOTES: ${{ needs.build-release.outputs.release-notes }}
        run: |
          notes_file=$(mktemp)
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"

          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release delete "$ROLLING_TAG" --yes --cleanup-tag
          fi

          gh release create "$ROLLING_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file "$notes_file" \
            --prerelease
