name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build canonical release bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      archive-name: ${{ steps.canonical.outputs.archive-name }}
      artifact-prefix: ${{ steps.metadata.outputs.artifact-prefix }}
      canonical-artifact-name: ${{ steps.metadata.outputs.canonical-artifact-name }}
      publish-release: ${{ steps.metadata.outputs.publish-release }}
      release-name: ${{ steps.metadata.outputs.release-name }}
      release-notes: ${{ steps.metadata.outputs.release-notes }}
      rolling-tag: ${{ steps.metadata.outputs.rolling-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive release metadata
        id: metadata
        run: |
          short_sha=""
          artifact_prefix=""
          canonical_artifact_name=""
          publish_release="false"
          release_name=""
          release_notes=""
          rolling_tag=""

          short_sha=$(git rev-parse --short=12 HEAD)
          artifact_prefix="release-verification-${short_sha}"
          canonical_artifact_name="canonical-release-${short_sha}"

          case "${GITHUB_REF_NAME}" in
            main)
              publish_release="true"
              rolling_tag="main-latest"
              release_name="Main rolling build"
              release_notes=$(cat <<EOF
          Deterministic release artifact verification for \'main\'.

          - Commit: ${GITHUB_SHA}
          - Canonical bundle attr: .#nails-release
          - Artifact verification: same-runner nix-store --realise --check plus two independent rebuild comparisons
          EOF
          )
              ;;
            dev)
              release_name="Dev deterministic verification build"
              release_notes=$(cat <<EOF
          Deterministic release artifact verification for \'dev\'.

          - Commit: ${GITHUB_SHA}
          - Canonical bundle attr: .#nails-release
          - No GitHub release publication occurs for dev builds
          EOF
          )
              ;;
            *)
              echo "Unsupported ref ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          {
            echo "archive-name="
            echo "artifact-prefix=${artifact_prefix}"
            echo "canonical-artifact-name=${canonical_artifact_name}"
            echo "publish-release=${publish_release}"
            echo "release-name=${release_name}"
            echo "rolling-tag=${rolling_tag}"
            echo "release-notes<<EOF"
            printf '%s\n' "${release_notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@43082b822f2e4b696046793cdd9e9b5da14f3d75
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Build canonical release bundle
        run: nix build -L .#nails-release -o result --option accept-flake-config false

      - name: Read canonical archive name
        id: canonical
        run: |
          archive_name=$(python - <<'PY'
          from pathlib import Path
          archives = sorted(Path('result').glob('*.tar.gz'))
          if len(archives) != 1:
              raise SystemExit(f"expected exactly one archive, found {len(archives)}")
          print(archives[0].name)
          PY
          )
          echo "archive-name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Verify same-runner determinism
        run: |
          drv=$(nix path-info --derivation .#nails-release)
          nix-store --realise "$drv" --check -K

      - name: Smoke test canonical archive
        run: |
          archive_name="${{ steps.canonical.outputs.archive-name }}"
          smoke_dir=$(mktemp -d)
          tar -xzf "result/${archive_name}" -C "$smoke_dir"
          extracted_dir="$smoke_dir/${archive_name%.tar.gz}"
          test -f "$extracted_dir/LICENSE"
          test -f "$extracted_dir/README.md"
          test -x "$extracted_dir/nails"
          file "$extracted_dir/nails"
          "$extracted_dir/nails" --version

      - name: Collect canonical release files
        run: |
          mkdir -p dist
          cp -R result/* dist/
          printf '%s\n' "${{ steps.canonical.outputs.archive-name }}" > dist/archive-name.txt
          test -f "dist/${{ steps.canonical.outputs.archive-name }}"

      - name: Upload canonical release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ steps.metadata.outputs.canonical-artifact-name }}
          path: dist/
          retention-days: 14

  determinism:
    name: Deterministic release verification
    needs: build-release
    permissions:
      contents: read
    uses: ./.github/workflows/reproducibility.yml
    with:
      git-ref: ${{ github.sha }}
      flake-attr: .#nails-release
      canonical-artifact-name: ${{ needs.build-release.outputs.canonical-artifact-name }}
      artifact-prefix: ${{ needs.build-release.outputs.artifact-prefix }}
      archive-name: ${{ needs.build-release.outputs.archive-name }}

  attest-release:
    name: Attest canonical release bundle
    runs-on: ubuntu-24.04
    needs: [build-release, determinism]
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download canonical release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build-release.outputs.canonical-artifact-name }}
          path: dist

      - name: Check repository visibility
        id: repo-visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api repos/${{ github.repository }} --jq '.visibility')
          echo "visibility=${visibility}" >> "$GITHUB_OUTPUT"
          echo "Repository visibility: ${visibility}"

      - name: Create GitHub artifact attestation
        if: steps.repo-visibility.outputs.visibility == 'public'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-checksums: dist/checksums.txt

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    if: needs.build-release.outputs.publish-release == 'true'
    needs: [build-release, attest-release]
    permissions:
      contents: write

    steps:
      - name: Download canonical release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build-release.outputs.canonical-artifact-name }}
          path: dist

      - name: Publish rolling main release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROLLING_TAG: ${{ needs.build-release.outputs.rolling-tag }}
          RELEASE_NAME: ${{ needs.build-release.outputs.release-name }}
          RELEASE_NOTES: ${{ needs.build-release.outputs.release-notes }}
        run: |
          notes_file=$(mktemp)
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"

          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release delete "$ROLLING_TAG" --yes --cleanup-tag
          fi

          gh release create "$ROLLING_TAG" \
            dist/*.tar.gz \
            dist/nails \
            dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file "$notes_file" \
            --prerelease
