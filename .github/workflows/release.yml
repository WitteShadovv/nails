name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  classify-tag:
    name: Classify release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publication-mode: ${{ steps.classify.outputs.publication-mode }}

    steps:
      - name: Classify tag trigger
        id: classify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "publication-mode=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "publication-mode=verify" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Verify or publish tagged release
    needs: classify-tag
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-core.yml
    with:
      release-tag: ${{ github.ref_name }}
      publication-mode: ${{ needs.classify-tag.outputs.publication-mode }}

  # Tag pushes run unattended: a failed release opens or comments on the
  # 'CI red: Release' issue, and the next successful release closes it.
  report-status:
    name: Report status
    needs: [classify-tag, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on and close the tracking issue

    steps:
      - name: Checkout the report action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-status

      - name: Report status
        uses: ./.github/actions/report-status
        with:
          needs: ${{ toJSON(needs) }}
