name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  classify-tag:
    name: Classify release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publication-mode: ${{ steps.classify.outputs.publication-mode }}

    steps:
      - name: Classify tag trigger
        id: classify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "publication-mode=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "publication-mode=verify" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Verify or publish tagged release
    needs: classify-tag
    uses: ./.github/workflows/release-core.yml
    with:
      release-tag: ${{ github.ref_name }}
      publication-mode: ${{ needs.classify-tag.outputs.publication-mode }}
