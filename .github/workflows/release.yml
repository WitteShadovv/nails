name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build canonical release bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      archive-name: ${{ steps.canonical.outputs.archive-name }}
      artifact-prefix: ${{ steps.metadata.outputs.artifact-prefix }}
      canonical-artifact-name: ${{ steps.metadata.outputs.canonical-artifact-name }}
      publish-release: ${{ steps.metadata.outputs.publish-release }}
      release-name: ${{ steps.metadata.outputs.release-name }}
      release-notes: ${{ steps.metadata.outputs.release-notes }}
      release-tag: ${{ steps.metadata.outputs.release-tag }}
      slsa-subjects: ${{ steps.slsa-hash.outputs.subjects }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive release metadata
        id: metadata
        run: |
          short_sha=$(git rev-parse --short=12 HEAD)
          short_rev=$(git rev-parse --short=7 HEAD)
          version=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          artifact_prefix="release-verification-${short_sha}"
          canonical_artifact_name="canonical-release-${short_sha}"
          publish_release="false"
          release_tag=""
          release_name=""
          release_notes=""

          case "${GITHUB_REF_NAME}" in
            main)
              publish_release="true"
              release_tag="v${version}-git.${short_rev}"
              release_name="nails ${version}-git.${short_rev}"
              release_notes=$(cat <<EOF
          Deterministic release artifact verification for \'main\'.

          - Commit: ${GITHUB_SHA}
          - Canonical bundle attr: .#nails-release
          - Artifact verification: same-runner nix-store --realise --check plus two independent rebuild comparisons

          ## Supply Chain Security

          This release includes SLSA Level 3 provenance attestation (\`nails.intoto.jsonl\`).

          ### Verify SLSA Provenance

          **Note:** This repository is private. SLSA provenance verification requires \`--source-uri\` to match the actual repository.

          \`\`\`bash
          # Install slsa-verifier
          go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@latest

          # Verify the release archive
          slsa-verifier verify-artifact nails-*.tar.gz \\
            --provenance-path nails.intoto.jsonl \\
            --source-uri github.com/WitteShadovv/nails

          # Verify the binary
          slsa-verifier verify-artifact nails \\
            --provenance-path nails.intoto.jsonl \\
            --source-uri github.com/WitteShadovv/nails
          \`\`\`
          EOF
          )
              ;;
            dev)
              release_name="Dev deterministic verification build"
              release_notes=$(cat <<EOF
          Deterministic release artifact verification for \'dev\'.

          - Commit: ${GITHUB_SHA}
          - Canonical bundle attr: .#nails-release
          - No GitHub release publication occurs for dev builds
          EOF
          )
              ;;
            *)
              echo "Unsupported ref ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          {
            echo "archive-name="
            echo "artifact-prefix=${artifact_prefix}"
            echo "canonical-artifact-name=${canonical_artifact_name}"
            echo "publish-release=${publish_release}"
            echo "release-name=${release_name}"
            echo "release-tag=${release_tag}"
            echo "release-notes<<EOF"
            printf '%s\n' "${release_notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@43082b822f2e4b696046793cdd9e9b5da14f3d75
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Build canonical release bundle
        run: nix build -L .#nails-release -o result --option accept-flake-config false

      - name: Read canonical archive name
        id: canonical
        run: |
          archive_name=$(python - <<'PY'
          from pathlib import Path
          archives = sorted(Path('result').glob('*.tar.gz'))
          if len(archives) != 1:
              raise SystemExit(f"expected exactly one archive, found {len(archives)}")
          print(archives[0].name)
          PY
          )
          echo "archive-name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Verify same-runner determinism
        run: |
          drv=$(nix path-info --derivation .#nails-release)
          nix-store --realise "$drv" --check -K

      - name: Smoke test canonical archive
        run: |
          archive_name="${{ steps.canonical.outputs.archive-name }}"
          smoke_dir=$(mktemp -d)
          tar -xzf "result/${archive_name}" -C "$smoke_dir"
          extracted_dir="$smoke_dir/${archive_name%.tar.gz}"
          test -f "$extracted_dir/LICENSE"
          test -f "$extracted_dir/README.md"
          test -x "$extracted_dir/nails"
          file "$extracted_dir/nails"
          "$extracted_dir/nails" --version

      - name: Install Rust toolchain for SBOM
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.93.0

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --locked

      - name: Generate CycloneDX SBOM
        run: cargo sbom --output-format cyclone_dx_json_1_6 > sbom.cdx.json

      - name: Install CycloneDX CLI for validation
        run: |
          curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.27.1/cyclonedx-linux-x64 -o /tmp/cyclonedx-cli
          chmod +x /tmp/cyclonedx-cli

      - name: Validate SBOM format
        run: /tmp/cyclonedx-cli validate --input-file sbom.cdx.json --input-format json

      - name: Collect canonical release files
        run: |
          mkdir -p dist
          cp -R result/* dist/
          cp sbom.cdx.json dist/
          printf '%s\n' "${{ steps.canonical.outputs.archive-name }}" > dist/archive-name.txt
          test -f "dist/${{ steps.canonical.outputs.archive-name }}"
          test -f "dist/sbom.cdx.json"

      - name: Generate SLSA provenance subjects
        id: slsa-hash
        run: |
          # Generate base64-encoded SHA256 subjects for SLSA provenance
          # Format: "<sha256 hash>  <filename>" per line, then base64 encode
          archive_name="${{ steps.canonical.outputs.archive-name }}"

          cd dist

          # Generate subjects file with proper format (one subject per line)
          {
            sha256sum "${archive_name}"
            sha256sum nails
            sha256sum checksums.txt
          } > subjects.txt

          # Base64 encode with no line wrapping
          encoded_subjects=$(base64 -w0 < subjects.txt)
          echo "subjects=${encoded_subjects}" >> "$GITHUB_OUTPUT"

          # Log for debugging
          echo "SLSA subjects (decoded):"
          cat subjects.txt

      - name: Upload canonical release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ steps.metadata.outputs.canonical-artifact-name }}
          path: dist/
          retention-days: 14

  determinism:
    name: Deterministic release verification
    needs: build-release
    permissions:
      contents: read
    uses: ./.github/workflows/reproducibility.yml
    with:
      git-ref: ${{ github.sha }}
      flake-attr: .#nails-release
      canonical-artifact-name: ${{ needs.build-release.outputs.canonical-artifact-name }}
      artifact-prefix: ${{ needs.build-release.outputs.artifact-prefix }}
      archive-name: ${{ needs.build-release.outputs.archive-name }}

  attest-release:
    name: Attest canonical release bundle
    runs-on: ubuntu-24.04
    needs: [build-release, determinism]
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download canonical release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build-release.outputs.canonical-artifact-name }}
          path: dist

      - name: Check repository visibility
        id: repo-visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api repos/${{ github.repository }} --jq '.visibility')
          echo "visibility=${visibility}" >> "$GITHUB_OUTPUT"
          echo "Repository visibility: ${visibility}"

      - name: Create GitHub artifact attestation
        if: steps.repo-visibility.outputs.visibility == 'public'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-checksums: dist/checksums.txt

  # SLSA Level 3 Provenance Generation
  # Uses the official SLSA GitHub generator to create signed provenance
  # attestations for supply chain security. This provides:
  # - Tamper-proof build provenance
  # - Verification that artifacts were built from this repository
  # - SLSA L3 compliance (isolated builds, signed provenance)
  #
  # Note: This repository is private. When verifying SLSA provenance, users must
  # specify --source-uri github.com/WitteShadovv/nails to match the actual repository.
  provenance:
    name: Generate SLSA provenance
    needs: [build-release, determinism]
    if: needs.build-release.outputs.publish-release == 'true'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build-release.outputs.slsa-subjects }}
      upload-assets: false  # We upload manually to control release flow
      provenance-name: nails.intoto.jsonl

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    if: needs.build-release.outputs.publish-release == 'true'
    needs: [build-release, attest-release, provenance]
    permissions:
      contents: write

    steps:
      - name: Download canonical release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build-release.outputs.canonical-artifact-name }}
          path: dist

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nails.intoto.jsonl
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-release.outputs.release-tag }}
          RELEASE_NAME: ${{ needs.build-release.outputs.release-name }}
          RELEASE_NOTES: ${{ needs.build-release.outputs.release-notes }}
        run: |
          notes_file=$(mktemp)
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"

          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/nails \
            dist/checksums.txt \
            dist/sbom.cdx.json \
            dist/nails.intoto.jsonl \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file "$notes_file" \
            --prerelease
