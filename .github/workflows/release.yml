name: Release

# One run takes a release tag to a draft GitHub release:
#
#   version        the tag is annotated and equals v<workspace version>,
#                  Cargo.lock carries that version and CHANGELOG.md has its
#                  section (ci/release.py); a mistake fails here, in seconds
#   build          .#nails-release, compiled from source without the cache
#   rebuild        reproducibility.yml builds it again on a fresh runner; the
#                  binary, the archive and checksums.txt must match byte for
#                  byte
#   sbom           CycloneDX SBOM of the binary for the musl target, musl
#                  included, and an OpenVEX document that marks the CVEs
#                  nixpkgs patches musl against as fixed; an SBOM that
#                  actions/attest would refuse fails here, in minutes
#   e2e            the whole E2E suite (e2e.yml) on the tagged commit, once
#                  the SBOM passed; without the project cache, so every test
#                  boots instead of reusing a pass from an earlier run
#   attest         build provenance for the archive and the binary, and the
#                  SBOM as an attestation of its own
#   verify-attestations
#                  the Sigstore bundle of each attestation, checked with cosign
#                  as docs/verify-release.md tells users to check it
#   draft-release  a draft whose notes are the CHANGELOG.md section, with the
#                  bundles among its assets
#
# Publishing the draft stays a maintainer's step; RELEASING.md has the
# checklist. A dispatch runs the same pipeline again for an existing tag, for
# example after an infrastructure failure. It must run from the tag itself
# ("Use workflow from: vX.Y.Z"), because the provenance records the ref and
# commit of the run as the source: every job builds and tests that commit,
# with the workflow and the tooling of the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to release, for example v0.3.0; run the workflow from this same
          tag
        required: true
        type: string
      e2e-runner:
        description: >-
          runs-on for the E2E shards, as JSON: "ubuntu-26.04" or a label list
          such as ["self-hosted","nails-e2e"]
        type: string
        default: '"ubuntu-26.04"'
      e2e-max-shards:
        description: >-
          Upper bound on parallel E2E shards; use 1 for a single-use
          self-hosted runner
        type: number
        default: 10

permissions: {}

# A second run for the same tag waits instead of cancelling the first: a
# cancelled run must never leave a release half done.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Check tag and version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      # A ruleset cannot require annotated tags, so the run does.
      - name: Require a run on an annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::Run this workflow from the tag $TAG, not from $GITHUB_REF: the provenance names the ref of the run"
            exit 1
          fi
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag; release tags are annotated (git tag -a)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the version, Cargo.lock and CHANGELOG.md
        id: check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 -m ci.release check --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Without the project cache, nails is compiled from source here.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache: 'false'

      - name: Build the release bundle
        run: nix build -L .#nails-release -o result --option accept-flake-config false

      - name: Smoke-test the release bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="nails-$VERSION-x86_64-unknown-linux-musl"
          smoke=$(mktemp -d)
          tar -xzf "result/$name.tar.gz" -C "$smoke"
          test -f "$smoke/$name/LICENSE"
          test -f "$smoke/$name/README.md"
          cmp result/nails "$smoke/$name/nails"
          test "$(result/nails --version)" = "nails $VERSION"
          (cd result && sha256sum --check --strict checksums.txt)

      - name: Collect the release bundle
        run: mkdir dist && cp result/* dist/

      - name: Upload the release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14

  rebuild:
    name: Rebuild
    needs: [version, build]
    permissions:
      contents: read
    uses: ./.github/workflows/reproducibility.yml
    with:
      reference-artifact: release-bundle

  # The SBOM is written and checked before the E2E suite starts: an SBOM
  # that actions/attest would refuse stops the run within minutes, before the
  # suite and before anything is attested. It needs no build. ci.yml runs the
  # same workflow on main and on pull requests that change what the SBOM is
  # made from, so such a problem shows before a tag.
  sbom:
    name: SBOM
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/sbom.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  # GitHub refuses a call that grants less than any job of the called workflow
  # declares. e2e.yml's report-status job declares issues: write, but it runs
  # only for main and the nightly schedule, never for a release.
  #
  # With the project cache, a test whose derivation passed before would be
  # substituted instead of booting, so the release would rest on earlier
  # runs. Without it every test boots on the tagged commit. The run reads
  # nothing from the cache and writes nothing to it, so it gets no token.
  e2e:
    name: E2E
    needs: [version, sbom]
    permissions:
      contents: read
      issues: write # declared by e2e.yml's report-status job, unused here
    uses: ./.github/workflows/e2e.yml
    with:
      mode: all
      cache: false
      runner: ${{ inputs.e2e-runner || '"ubuntu-26.04"' }}
      max-shards: ${{ inputs.e2e-max-shards || 10 }}

  # Only a bundle that passed every gate is attested: an attestation is a
  # public statement, and it outlives a deleted draft.
  attest:
    name: Attest
    needs: [version, build, rebuild, e2e, sbom]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # sign through Sigstore with this job's OIDC identity
      attestations: write # store the attestations with the repository

    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-bundle
          path: dist

      - name: Download the SBOM and the VEX document
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-sbom
          path: sbom

      # The two documents come first. actions/attest reads a document before
      # it signs anything and fails on one it refuses, so a refused SBOM or
      # VEX document leaves no build provenance behind for a release that is
      # never drafted. sbom-check copies the SBOM rules of this release of
      # the action; a test fails when these pins leave ATTEST_VERSION and
      # ATTEST_COMMIT in ci/release.py.
      - name: Attest the SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: sbom/sbom.cdx.json

      - name: Attest the VEX document
        id: vex
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: sbom/musl.openvex.json

      # SLSA build provenance for each file that checksums.txt lists: the
      # archive and the binary.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # Each step above writes its attestation as a Sigstore bundle: the
      # signed statement, the certificate of this job's identity and the
      # transparency log entry. On the release, the bundles let anyone check
      # a download with cosign, without GitHub's attestation API or a GitHub
      # account.
      - name: Collect the attestation bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          VEX: ${{ steps.vex.outputs.bundle-path }}
        run: |
          mkdir attestations
          cp "$PROVENANCE" attestations/provenance.sigstore.json
          cp "$SBOM" attestations/sbom.sigstore.json
          cp "$VEX" attestations/vex.sigstore.json

      - name: Upload the attestation bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-attestations
          path: attestations/
          if-no-files-found: error
          retention-days: 14

  # docs/verify-release.md checks a release with cosign and no GitHub
  # account. The same commands run here, on the files the draft will hold,
  # so a release whose bundles do not verify that way is never drafted. A
  # cosign that printed "Verified OK" for anything, or ignored the identity,
  # would pass them too, so a copy of the binary with one byte more and the
  # identity of another tag must fail.
  verify-attestations:
    name: Verify the attestations
    needs: [version, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-bundle
          path: dist

      - name: Download the attestation bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-attestations
          path: dist

      - name: Download the SBOM and the VEX document
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-sbom
          path: documents

      # The oldest cosign release that docs/verify-release.md accepts, as a
      # binary checked against the digest that install-action pins.
      - name: Install cosign
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cosign@3.1.3

      # The attestations name the files that checksums.txt lists, so a file
      # of the release bundle that it leaves out would go out unattested.
      # The SBOM and the VEX document also go out as files of their own,
      # which must be the documents that the checked bundles carry.
      - name: Verify every attestation as docs/verify-release.md does
        working-directory: dist
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity="https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG"
          verify() {
            cosign verify-blob-attestation \
              --bundle "$1" \
              --type "$2" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$identity" \
              --check-claims=true \
              "$3"
          }
          sha256sum --check --strict checksums.txt
          mapfile -t files < <(awk '{ print $2 }' checksums.txt)
          declare -A listed=()
          for file in "${files[@]}"; do
            listed[$file]=1
          done
          for file in *; do
            case "$file" in
              checksums.txt | *.sigstore.json) ;;
              *)
                if [ -z "${listed[$file]:-}" ]; then
                  echo "::error::$file is not in checksums.txt, so no attestation names it"
                  exit 1
                fi
                ;;
            esac
          done
          for file in "${files[@]}"; do
            echo "$file:"
            verify provenance.sigstore.json slsaprovenance1 "$file"
            verify sbom.sigstore.json cyclonedx "$file"
            verify vex.sigstore.json https://openvex.dev/ns/v0.2.0 "$file"
          done
          attested_document() {
            jq -r .dsseEnvelope.payload "$1" | base64 -d |
              jq -e --slurpfile document "$2" '.predicate == $document[0]' > /dev/null
          }
          for pair in 'sbom.sigstore.json sbom.cdx.json' 'vex.sigstore.json musl.openvex.json'; do
            read -r bundle document <<< "$pair"
            if ! attested_document "$bundle" "../documents/$document"; then
              echo "::error::$document is not the document that $bundle attests"
              exit 1
            fi
            echo "$document is the document that $bundle attests"
          done
          echo "Checks that must fail: a copy of nails with one byte more, and another tag."
          changed="$RUNNER_TEMP/nails-changed"
          cp nails "$changed"
          printf '\n' >> "$changed"
          if verify provenance.sigstore.json slsaprovenance1 "$changed"; then
            echo "::error::cosign accepted a copy of the binary with one byte more"
            exit 1
          fi
          identity="https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG-other"
          if verify provenance.sigstore.json slsaprovenance1 nails; then
            echo "::error::cosign accepted the attestation for the identity of another tag"
            exit 1
          fi

  draft-release:
    name: Draft release
    needs: [version, attest, verify-attestations]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets

    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-bundle
          path: dist

      - name: Download the SBOM and the VEX document
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-sbom
          path: dist

      - name: Download the attestation bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-attestations
          path: dist

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes
          path: notes

      # A draft is only visible to maintainers. An existing release is never
      # touched: delete a stale draft to run again; a published one is final.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for $TAG exists already; delete the draft to run again"
            exit 1
          fi
          flags=(--draft --verify-tag --title "nails $TAG" --notes-file notes/release-notes.md)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" dist/*

  # Tag pushes run unattended: a failed release opens or comments on the
  # 'CI red: Release' issue, and the next successful release closes it.
  report-status:
    name: Report status
    needs: [version, build, rebuild, e2e, sbom, attest, verify-attestations, draft-release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on and close the tracking issue

    steps:
      - name: Checkout the report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-status

      - name: Report status
        uses: ./.github/actions/report-status
        with:
          needs: ${{ toJSON(needs) }}
