name: Mutants (in diff)

# A non-blocking pull-request lane that mutation-tests only the lines the pull
# request changed (cargo-mutants --in-diff), apart from the weekly full sweep in
# scheduled.yml. It never gates the merge: surviving mutants are a triage
# artifact for the integration log, and a change that touches no mutable code is
# a clean pass. The work is sharded and each shard is time-boxed, so the lane
# stays short even when a change to the teardown plan or the session entry
# produces dozens of mutants.

on:
  pull_request:
    branches:
      - next
      - main

permissions:
  contents: read

concurrency:
  group: mutants-in-diff-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  in-diff:
    name: In-diff mutants (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    # The hard cap on the lane; cargo-mutants' own --timeout bounds a single
    # mutant so one slow test cannot eat the whole box.
    timeout-minutes: 15
    strategy:
      # One slow or red shard must not cancel the others; each reports on its
      # own.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The diff is computed against the base, so both sides are needed.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install test tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146,just@1.58.0
          fallback: none

      - name: Diff the pull request against its base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "$BASE" HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Changed lines in the diff: $(wc -l < "$RUNNER_TEMP/pr.diff")"

      - name: Mutate the changed lines
        env:
          SHARD: ${{ matrix.shard }}
        run: just mutants-in-diff "$RUNNER_TEMP/pr.diff" "$SHARD" 4

      - name: Upload the mutants report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-in-diff-${{ matrix.shard }}
          path: target/mutants/
          if-no-files-found: ignore
          retention-days: 30
