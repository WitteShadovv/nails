name: Mutants (in diff)

# A non-blocking pull-request lane that mutation-tests only the lines the pull
# request changed (cargo-mutants --in-diff). It is informational and never
# gates the merge: a pull request can merge into `next` with a shard of this
# lane red, cancelled or skipped, and nothing in CI re-runs such a shard.
# Surviving mutants are a triage artifact for the integration log, and a change
# that touches no mutable code is a clean pass. A shard goes red when a
# mutant's build failed for want of disk, memory or I/O: cargo-mutants counts
# that mutant as unviable, but it was never tested. The lane is for the diff of
# a feature pull request: it shows a coverage gap in a change as that change
# lands on `next`.
#
# The lane sizes itself to the diff. The plan job lists the diff's mutants,
# which builds nothing, and splits them over as many shards as keep each inside
# its time box with a margin, at most twelve (`just mutants-in-diff-plan`;
# ci/mutants_plan.py holds the numbers and where they come from). A diff too
# large for twelve shards in the ordinary 15-minute box gets longer boxes, up to
# 30 minutes. A diff too large even for those runs no shard, so none of its
# mutants is tested: the plan job fails with an error that gives the count. A
# diff with no mutant runs the plan job alone. A shard that runs out of its
# time box is stopped there and goes red, and it still uploads its report and
# lists in the job summary the survivors it found and the mutants it never
# reached.
#
# It runs on pull requests into `next`, not into `main`, so a `next` -> `main`
# release pull request gets no in-diff run: its diff carries the whole round,
# more mutants than even the longest time boxes can test. The weekly sweep in
# scheduled.yml does not stand in for it: it runs on `main`, and it mutates
# only its three directories, less the files that mutants_skipped in the
# justfile names, and nothing in the other crates.

on:
  pull_request:
    branches:
      - next

permissions:
  contents: read

concurrency:
  group: mutants-in-diff-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: In-diff mutants (plan)
    runs-on: ubuntu-26.04
    # Listing builds nothing: the toolchain install takes the longest.
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The diff is computed against the base, so both sides are needed.
          fetch-depth: 0

      # cargo-mutants finds the workspace's sources through cargo metadata.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # The cargo-mutants the shards test with: another release may find
      # other mutants or slice the shards otherwise.
      - name: Install cargo-mutants and just
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-mutants@27.1.0,just@1.58.0
          fallback: none

      # HEAD is the merge commit GitHub builds for the pull request, and its
      # first parent is the base it merged onto. The event's base.sha can be
      # older than that base when the base branch moved after the event, and a
      # diff from it would also carry every change merged in between.
      - name: Diff the pull request against its base
        run: |
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Changed lines in the diff: $(wc -l < "$RUNNER_TEMP/pr.diff")"

      # Fails, after it writes its outputs, for a diff too large for the lane.
      - name: Plan the shards
        id: plan
        run: just mutants-in-diff-plan "$RUNNER_TEMP/pr.diff" >> "$GITHUB_OUTPUT"

  in-diff:
    name: In-diff mutants (shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: plan
    # No shard runs for a diff without mutants, and none for a diff with more
    # than the lane can test, whose plan job fails.
    if: needs.plan.outputs.shards != '0'
    runs-on: ubuntu-26.04
    # The mutation step keeps to the shard's time box (see there); this limit
    # from the plan gives the job the box and a few minutes for the steps
    # around it, and only a step that hangs reaches it.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One slow or red shard must not cancel the others; each reports on its
      # own.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The diff is computed against the base, so both sides are needed.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install test tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146,just@1.58.0
          fallback: none

      # The same diff as the plan job's: every job of the run checks out the
      # same merge commit.
      - name: Diff the pull request against its base
        run: |
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Changed lines in the diff: $(wc -l < "$RUNNER_TEMP/pr.diff")"

      # cargo-mutants copies the tree into a temporary directory and builds it
      # there. /tmp on the ubuntu-26.04 runners is too small for a build of the
      # workspace (the copy fails with "Disk quota exceeded"), so the copy goes
      # to the runner's disk instead.
      #
      # The recipe stops cargo-mutants when the shard's time box runs out,
      # reports the mutants tested by then and fails, so the shard goes red and
      # the upload below still runs. cargo-mutants' own --timeout bounds a
      # single mutant, so one slow test cannot eat the whole box. A
      # timeout-minutes of the step would not do: GitHub stops a step that
      # runs over it by signalling the step's shell alone, and cargo-mutants
      # would go on testing, and writing its report, while the upload reads it.
      - name: Mutate the changed lines
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          MINUTES: ${{ matrix.minutes }}
          TMPDIR: ${{ runner.temp }}
        run: just mutants-in-diff "$RUNNER_TEMP/pr.diff" "$SHARD" "$SHARDS" "$MINUTES"

      - name: Upload the mutants report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-in-diff-${{ matrix.shard }}
          path: target/mutants/
          if-no-files-found: ignore
          retention-days: 30
