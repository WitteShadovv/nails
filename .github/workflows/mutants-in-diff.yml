name: Mutants (in diff)

# A non-blocking pull-request lane that mutation-tests only the lines the pull
# request changed (cargo-mutants --in-diff), apart from the weekly full sweep in
# scheduled.yml. It never gates the merge: surviving mutants are a triage
# artifact for the integration log, and a change that touches no mutable code is
# a clean pass. A shard goes red when a mutant's build failed for want of disk,
# memory or I/O: cargo-mutants counts that mutant as unviable, but it was never
# tested. The work is sharded and each shard is time-boxed, so the lane stays
# short on the small diff of a feature pull request, which is what it is for:
# it catches a coverage gap in a change as that change lands on `next`.
#
# It runs on pull requests into `next`, not into `main`. A `next` -> `main`
# release pull request carries the whole accumulated round, whose diff has
# hundreds of mutants: they cannot finish inside the time-boxed shards (the
# shards are cancelled, or a worker fills the runner's disk, and the lane goes
# red), and re-testing them proves nothing, because every line in that diff
# already went through this lane on the feature pull request that added it. The
# weekly full sweep in scheduled.yml is the release-level backstop.

on:
  pull_request:
    branches:
      - next

permissions:
  contents: read

concurrency:
  group: mutants-in-diff-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  in-diff:
    name: In-diff mutants (shard ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    # The hard cap on the lane; cargo-mutants' own --timeout bounds a single
    # mutant so one slow test cannot eat the whole box.
    timeout-minutes: 15
    strategy:
      # One slow or red shard must not cancel the others; each reports on its
      # own.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The diff is computed against the base, so both sides are needed.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install test tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146,just@1.58.0
          fallback: none

      # HEAD is the merge commit GitHub builds for the pull request, and its
      # first parent is the base it merged onto. The event's base.sha can be
      # older than that base when the base branch moved after the event, and a
      # diff from it would also carry every change merged in between.
      - name: Diff the pull request against its base
        run: |
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Changed lines in the diff: $(wc -l < "$RUNNER_TEMP/pr.diff")"

      # cargo-mutants copies the tree into a temporary directory and builds it
      # there. /tmp on the ubuntu-26.04 runners is too small for a build of the
      # workspace (the copy fails with "Disk quota exceeded"), so the copy goes
      # to the runner's disk instead.
      - name: Mutate the changed lines
        env:
          SHARD: ${{ matrix.shard }}
          TMPDIR: ${{ runner.temp }}
        run: just mutants-in-diff "$RUNNER_TEMP/pr.diff" "$SHARD" 4

      - name: Upload the mutants report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutants-in-diff-${{ matrix.shard }}
          path: target/mutants/
          if-no-files-found: ignore
          retention-days: 30
