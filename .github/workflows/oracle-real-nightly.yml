name: Oracle real-image nightly

# Nightly forensic oracle over the REAL decoy disk images, the companion to the
# synthetic oracle-nightly.yml. The synthetic run proves the verdict engine over
# built-here btrfs images; this run proves it over the actual decoy roots the
# oracle-images E2E produces, so a regression in the real restore/bulk_extractor/
# plaso path (ext4 carving, the volatile-decoy posture, the lease settle) is
# caught. Anything but a clean verdict fails the run.
#
# Two runners, because the two halves need different hosts:
#   * produce: ubuntu-26.04 exposes /dev/kvm (install-nix-action opens it), so
#     the oracle-images VM test boots and retains before/control/after.raw. The
#     nails VM is built by Nix in its own sandbox, so the host toolchain does
#     not matter here.
#   * scan: ubuntu-24.04, because run-scan.sh builds the pinned bulk_extractor
#     2.2.0 with the HOST compiler and 2.2.0 fails 26.04's GCC -Werror (see
#     oracle-nightly.yml). It needs no KVM.
# The raws move between them as a sparse-preserving tar artifact (each raw is a
# 20 GiB image that is a few tens of MiB of real data).

on:
  schedule:
    # Nightly at 05:30 UTC, after the synthetic oracle run (04:30).
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: oracle-real-nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  produce:
    name: Produce real decoy images
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-nix installs Nix and opens /dev/kvm to the runner user, which the
      # oracle-images VM test needs to boot the decoy.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]

      # Build the oracle-images E2E test. It boots the decoy, runs the
      # activate/populate/deactivate workflow on a volatile decoy and retains
      # before/control/after.raw under the result's forensics/ directory.
      - name: Build the oracle-images test and retain the raws
        run: |
          nix build --print-build-logs \
            '.#legacyPackages.x86_64-linux.e2e."oracle-images"'
          test -f result/forensics/before.raw
          test -f result/forensics/control.raw
          test -f result/forensics/after.raw

      # Pack the three raws sparsely: each is a 20 GiB image of a few tens of
      # MiB, so -S keeps the artifact small. --dereference because result/ is a
      # store symlink.
      - name: Pack the raws
        run: |
          mkdir -p images
          cp --sparse=always result/forensics/before.raw images/
          cp --sparse=always result/forensics/control.raw images/
          cp --sparse=always result/forensics/after.raw images/
          tar -Sczf raws.tar.gz -C images before.raw control.raw after.raw
          ls -la raws.tar.gz

      - name: Upload the raws
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-real-raws
          path: raws.tar.gz
          retention-days: 3

  scan:
    name: Scan the real images and render the verdict
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: oracle
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the verdict tool
        run: cargo build --release --locked -p nails-oracle

      - name: Download the raws
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6.0.0
        with:
          name: oracle-real-raws

      - name: Unpack the raws
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          tar -Sxzf raws.tar.gz -C "$RUNNER_TEMP/images"
          ls -la "$RUNNER_TEMP/images"

      # Same analysis tools as oracle-nightly.yml. sleuthkit (mmls) and
      # e2fsprogs (debugfs) carve the ext4 restore channel from the real decoy
      # roots; the rest is the pinned bulk_extractor build chain. Docker is
      # preinstalled for the pinned plaso container.
      - name: Install analysis tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            btrfs-progs sleuthkit e2fsprogs \
            git autoconf automake build-essential libtool pkg-config flex \
            libssl-dev zlib1g-dev libexpat1-dev libre2-dev \
            libabsl-dev libgcrypt20-dev libgpg-error-dev

      # run-scan.sh in ORACLE_IMAGES_DIR mode carves the real raws, injects the
      # positive-control sentinels into a throwaway copy of after.raw, renders
      # the nails-oracle verdict and exits non-zero on anything but clean. It
      # needs root for the loop mounts.
      - name: Scan the real images and render the verdict
        run: |
          sudo env \
            "ORACLE_BIN=$PWD/target/release/nails-oracle" \
            "ORACLE_IMAGES_DIR=$RUNNER_TEMP/images" \
            ci/oracle/run-scan.sh "$RUNNER_TEMP/oracle"

      - name: Show the verdict
        if: ${{ !cancelled() }}
        run: |
          cat "$RUNNER_TEMP/oracle/verdict.json" 2>/dev/null \
            || echo "(no verdict.json: the scan did not reach the verdict)"

      # The scan runs as root, and the carved restore trees keep the decoy's
      # root-only modes (etc/credstore is 0700), which the upload cannot read.
      # Hand the verdict and the analysis outputs to the runner user. The
      # bulk_extractor build and the image working copy stay out of the
      # artifact.
      - name: Make the outputs readable for the upload
        if: ${{ !cancelled() }}
        run: |
          for p in "$RUNNER_TEMP/oracle/verdict.json" "$RUNNER_TEMP/oracle/outputs"; do
            if [ -e "$p" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$p"
              chmod -R u+rwX "$p"
            fi
          done

      - name: Upload the verdict and analysis outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-real-verdict
          path: |
            ${{ runner.temp }}/oracle/verdict.json
            ${{ runner.temp }}/oracle/outputs/

  # A run nobody watches: a red verdict opens or comments on the tracking issue,
  # a later green run closes it.
  report-status:
    name: Report status
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on and close the tracking issue

    steps:
      - name: Checkout the report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-status

      - name: Report status
        uses: ./.github/actions/report-status
        with:
          needs: ${{ toJSON(needs) }}
