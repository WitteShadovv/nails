name: Forensics Eval Regression

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: forensics-eval-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  forensics-regression:
    name: Forensics Eval Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            accept-flake-config = false

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: nix-community
          skipPush: true

      - name: Run Python forensics tests
        run: python3 -m unittest discover -s nix/forensics-eval/tests -p 'test_*.py'

      - name: Run fixture-backed forensics smoke check
        env:
          SMOKE_OUT: ${{ runner.temp }}/forensics-eval-smoke
        run: ./nix/forensics-eval/checks/smoke-demo.sh "$SMOKE_OUT"

      - name: Summarize regression lane
        if: always()
        run: |
          {
            cat <<'EOF'
          ## Forensics eval regression lane

          This lane is non-privileged and fixture-backed. It does not provision Hetzner runners or use repository secrets.

          | Check | Scope |
          |---|---|
          EOF
            printf "| Python tests | \`%s\` |\n" "nix/forensics-eval/tests"
            printf "| Smoke check | \`%s\` |\n" "./nix/forensics-eval/checks/smoke-demo.sh"
            printf "| Live support note | \`%s\` |\n" "Built-in live support remains limited to direct-baseline/direct-headless."
          } >> "$GITHUB_STEP_SUMMARY"
