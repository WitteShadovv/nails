name: Deterministic Release Verification

on:
  workflow_call:
    inputs:
      git-ref:
        description: Git ref to verify
        required: false
        type: string
        default: ""
      flake-attr:
        description: Flake attribute to build
        required: false
        type: string
        default: ".#nails-release"
      canonical-artifact-name:
        description: Artifact name for the canonical release bundle
        required: false
        type: string
        default: ""
      artifact-prefix:
        description: Artifact name prefix for rebuilds
        required: false
        type: string
        default: nails-determinism
      archive-name:
        description: Expected release archive filename
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git ref to verify
        required: false
        type: string
        default: ""
      flake-attr:
        description: Flake attribute to build
        required: false
        type: string
        default: ".#nails-release"
      canonical-artifact-name:
        description: Artifact name for the canonical release bundle
        required: false
        type: string
        default: ""
      artifact-prefix:
        description: Artifact name prefix for rebuilds
        required: false
        type: string
        default: nails-determinism
      archive-name:
        description: Expected release archive filename
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  rebuild:
    name: Rebuild ${{ matrix.build_id }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_id: [a, b]
    permissions:
      contents: read
    env:
      TARGET_REF: ${{ inputs.git-ref || github.sha }}
      FLAKE_ATTR: ${{ inputs.flake-attr || '.#nails-release' }}
      ARTIFACT_PREFIX: ${{ inputs.artifact-prefix || 'nails-determinism' }}
      CANONICAL_ARTIFACT_NAME: ${{ inputs.canonical-artifact-name }}
      EXPECTED_ARCHIVE_NAME: ${{ inputs.archive-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@43082b822f2e4b696046793cdd9e9b5da14f3d75
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Build release artifact bundle
        run: nix build -L "$FLAKE_ATTR" -o result --option accept-flake-config false

      - name: Verify same-runner determinism
        run: |
          drv=$(nix path-info --derivation "$FLAKE_ATTR")
          nix-store --realise "$drv" --check -K

      - name: Collect release bundle metadata
        run: |
          mkdir -p dist
          cp -R result/* dist/

          archive_name="$EXPECTED_ARCHIVE_NAME"
          if [[ -z "$archive_name" ]]; then
            archive_name=$(python - <<'PY'
          from pathlib import Path
          archives = sorted(Path('dist').glob('*.tar.gz'))
          if len(archives) != 1:
              raise SystemExit(f"expected exactly one archive, found {len(archives)}")
          print(archives[0].name)
          PY
            )
          fi

          if [[ ! -f "dist/${archive_name}" ]]; then
            echo "Expected archive dist/${archive_name} not found" >&2
            exit 1
          fi

          printf '%s\n' "$archive_name" > dist/archive-name.txt

      - name: Upload rebuild artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.build_id }}
          path: dist/
          retention-days: 14

  compare:
    name: Compare release bundles
    runs-on: ubuntu-24.04
    needs: rebuild
    permissions:
      contents: read
    env:
      ARTIFACT_PREFIX: ${{ inputs.artifact-prefix || 'nails-determinism' }}
      CANONICAL_ARTIFACT_NAME: ${{ inputs.canonical-artifact-name }}
      EXPECTED_ARCHIVE_NAME: ${{ inputs.archive-name }}

    steps:
      - name: Download build a
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-a
          path: artifacts/a

      - name: Download build b
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-b
          path: artifacts/b

      - name: Download canonical artifact
        if: env.CANONICAL_ARTIFACT_NAME != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.CANONICAL_ARTIFACT_NAME }}
          path: artifacts/canonical

      - name: Compare release bundle contents
        id: compare
        continue-on-error: true
        run: |
          archive_name="$EXPECTED_ARCHIVE_NAME"
          if [[ -z "$archive_name" ]]; then
            archive_name=$(<artifacts/a/archive-name.txt)
          fi

          diff -u artifacts/a/archive-name.txt artifacts/b/archive-name.txt
          diff -u artifacts/a/nails.sha256 artifacts/b/nails.sha256
          diff -u artifacts/a/SHA256SUMS artifacts/b/SHA256SUMS
          diff -u artifacts/a/release-metadata.json artifacts/b/release-metadata.json
          cmp "artifacts/a/${archive_name}" "artifacts/b/${archive_name}"

          if [[ -n "$CANONICAL_ARTIFACT_NAME" ]]; then
            diff -u artifacts/canonical/archive-name.txt artifacts/a/archive-name.txt
            diff -u artifacts/canonical/archive-name.txt artifacts/b/archive-name.txt
            diff -u artifacts/canonical/nails.sha256 artifacts/a/nails.sha256
            diff -u artifacts/canonical/nails.sha256 artifacts/b/nails.sha256
            diff -u artifacts/canonical/SHA256SUMS artifacts/a/SHA256SUMS
            diff -u artifacts/canonical/SHA256SUMS artifacts/b/SHA256SUMS
            diff -u artifacts/canonical/release-metadata.json artifacts/a/release-metadata.json
            diff -u artifacts/canonical/release-metadata.json artifacts/b/release-metadata.json
            cmp "artifacts/canonical/${archive_name}" "artifacts/a/${archive_name}"
            cmp "artifacts/canonical/${archive_name}" "artifacts/b/${archive_name}"
          fi

      - name: Generate diffoscope report
        if: steps.compare.outcome == 'failure'
        run: |
          archive_name="$EXPECTED_ARCHIVE_NAME"
          if [[ -z "$archive_name" ]]; then
            archive_name=$(<artifacts/a/archive-name.txt)
          fi

          mkdir -p diffoscope
          left="artifacts/a/${archive_name}"
          right="artifacts/b/${archive_name}"
          if [[ -n "$CANONICAL_ARTIFACT_NAME" ]]; then
            left="artifacts/canonical/${archive_name}"
            right="artifacts/a/${archive_name}"
          fi

          nix shell nixpkgs#diffoscope -c diffoscope \
            --text diffoscope/report.txt \
            "$left" \
            "$right"

      - name: Upload diffoscope report
        if: steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-diffoscope
          path: diffoscope/
          retention-days: 14

      - name: Fail on mismatch
        if: steps.compare.outcome == 'failure'
        run: |
          echo "Deterministic release verification failed" >&2
          exit 1
