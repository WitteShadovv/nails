name: Reproducibility

# Builds .#nails-release from source on fresh runners and compares the
# results byte for byte: the binary, the archive and checksums.txt. This
# cross-runner comparison is the evidence that the binary is reproducible;
# `nix-store --realise --check` would only repeat the archive packaging on
# the same runner, with the same compiled binary.
#
#   release.yml     one rebuild of the tagged commit, compared with the
#                   release build that reference-artifact names
#   scheduled.yml   two builds of main, compared with each other every week,
#                   so a determinism regression shows up before a release

on:
  workflow_call:
    inputs:
      reference-artifact:
        description: >-
          Artifact of the calling run that holds the result directory of
          .#nails-release; empty means building the reference here as well
        type: string
        default: ''

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.copy }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(inputs.reference-artifact && '["rebuild"]' || '["reference","rebuild"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Without the project cache, nails is compiled from source here.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache: 'false'

      - name: Build the release bundle
        run: nix build -L .#nails-release -o result --option accept-flake-config false

      - name: Collect the release bundle
        run: mkdir dist && cp result/* dist/

      - name: Upload the release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reproducibility-${{ matrix.copy }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: {}

    steps:
      - name: Download the reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.reference-artifact || 'reproducibility-reference' }}
          path: reference

      - name: Download the rebuild
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: reproducibility-rebuild
          path: rebuild

      # The same file names and the same bytes in every file.
      - name: Compare the bundles
        id: compare
        continue-on-error: true
        run: |
          sha256sum reference/* rebuild/*
          diff --recursive --brief reference rebuild

      - name: Explain the difference
        if: steps.compare.outcome == 'failure'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q diffoscope
          mkdir diffoscope
          # Exit status 1 only means that the inputs differ.
          status=0
          diffoscope --text diffoscope/report.txt reference rebuild || status=$?
          [ "$status" -le 1 ]

      - name: Upload the diffoscope report
        if: steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reproducibility-diffoscope
          path: diffoscope/
          retention-days: 14

      - name: Fail on a difference
        if: steps.compare.outcome == 'failure'
        run: |
          echo "::error::The rebuild differs from the reference; see the diffoscope report"
          exit 1
