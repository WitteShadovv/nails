name: Full E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'nails-core/**'
      - 'nails-cli/**'
      - 'nix/**'
      - 'scripts/run-e2e-tests.sh'
      - '.github/workflows/e2e-tests.yml'
      - '.github/workflows/e2e-tests-full.yml'
      - '.github/workflows/e2e-tests-full-shard.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for approved follow-up runs
        required: false
        type: string
      approved_sha:
        description: Approved PR head SHA to validate and execute
        required: false
        type: string
      checkout_repository:
        description: Repository to checkout for approved follow-up runs
        required: false
        type: string
      checkout_ref:
        description: Ref to validate for approved follow-up runs
        required: false
        type: string
      approval_label:
        description: Maintainer approval label that authorized the run
        required: false
        type: string
      approval_actor:
        description: Maintainer who applied the approval label
        required: false
        type: string
      pr_is_fork:
        description: Whether the approved PR head repository is a fork
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: full-e2e-${{ github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-run-context:
    name: Resolve trusted run context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      can_provision: ${{ steps.resolve.outputs.can_provision }}
      reason: ${{ steps.resolve.outputs.reason }}
      workflow_started_epoch: ${{ steps.resolve.outputs.workflow_started_epoch }}
      run_mode: ${{ steps.resolve.outputs.run_mode }}
      is_approved_pr: ${{ steps.resolve.outputs.is_approved_pr }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      approval_actor: ${{ steps.resolve.outputs.approval_actor }}
      approval_label: ${{ steps.resolve.outputs.approval_label }}
      pr_is_fork: ${{ steps.resolve.outputs.pr_is_fork }}
      checkout_repository: ${{ steps.resolve.outputs.checkout_repository }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
    steps:
      - name: Resolve trusted run metadata and validate approved PRs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
          INPUT_APPROVED_SHA: ${{ github.event.inputs.approved_sha || '' }}
          INPUT_CHECKOUT_REPOSITORY: ${{ github.event.inputs.checkout_repository || '' }}
          INPUT_CHECKOUT_REF: ${{ github.event.inputs.checkout_ref || '' }}
          INPUT_APPROVAL_LABEL: ${{ github.event.inputs.approval_label || '' }}
          INPUT_APPROVAL_ACTOR: ${{ github.event.inputs.approval_actor || '' }}
          INPUT_PR_IS_FORK: ${{ github.event.inputs.pr_is_fork || '' }}
          EXPECTED_APPROVAL_LABEL: safe-to-test:e2e-full
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          output_path = os.environ["GITHUB_OUTPUT"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          expected_label = os.environ["EXPECTED_APPROVAL_LABEL"]

          workflow_started_epoch = str(int(time.time()))
          can_provision = False
          run_mode = "unknown"
          is_approved_pr = False
          reason = ""
          pr_number = os.environ.get("INPUT_PR_NUMBER", "")
          approval_actor = os.environ.get("INPUT_APPROVAL_ACTOR", "")
          approval_label = os.environ.get("INPUT_APPROVAL_LABEL", "")
          pr_is_fork = os.environ.get("INPUT_PR_IS_FORK", "")
          checkout_repository = repo
          checkout_ref = os.environ["GITHUB_REF"]
          checkout_sha = os.environ["GITHUB_SHA"]

          approved_inputs = {
              "pr_number": os.environ.get("INPUT_PR_NUMBER", ""),
              "approved_sha": os.environ.get("INPUT_APPROVED_SHA", ""),
              "checkout_repository": os.environ.get("INPUT_CHECKOUT_REPOSITORY", ""),
              "checkout_ref": os.environ.get("INPUT_CHECKOUT_REF", ""),
              "approval_label": os.environ.get("INPUT_APPROVAL_LABEL", ""),
              "approval_actor": os.environ.get("INPUT_APPROVAL_ACTOR", ""),
              "pr_is_fork": os.environ.get("INPUT_PR_IS_FORK", ""),
          }

          def write_output(name, value):
              value = "" if value is None else str(value)
              with open(output_path, "a", encoding="utf-8") as fh:
                  if "\n" in value:
                      fh.write(f"{name}<<EOF\n{value}\nEOF\n")
                  else:
                      fh.write(f"{name}={value}\n")

          def api_get(path):
              request = urllib.request.Request(
                  f"{api_url}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          approved_mode_requested = any(value for value in approved_inputs.values())

          if event_name == "push":
              run_mode = "push"
              can_provision = True
              reason = "Trusted push to main; provisioning Hetzner-backed full E2E runners is allowed."
          elif event_name == "workflow_dispatch" and not approved_mode_requested:
              run_mode = "manual"
              can_provision = True
              reason = "Trusted manual workflow_dispatch run; provisioning Hetzner-backed full E2E runners is allowed."
          elif event_name == "workflow_dispatch":
              run_mode = "approved-pr"
              is_approved_pr = True
              checkout_repository = approved_inputs["checkout_repository"]
              checkout_ref = approved_inputs["checkout_ref"]
              checkout_sha = approved_inputs["approved_sha"]
              missing = [name for name, value in approved_inputs.items() if not value]

              if missing:
                  reason = "Approved PR dispatch is missing required inputs: " + ", ".join(missing)
              elif approved_inputs["approval_label"] != expected_label:
                  reason = (
                      f"Approved PR dispatch used unexpected label `{approved_inputs['approval_label']}`; "
                      f"expected `{expected_label}`."
                  )
              elif not approved_inputs["pr_number"].isdigit():
                  reason = f"Approved PR dispatch provided invalid pr_number `{approved_inputs['pr_number']}`."
              else:
                  try:
                      pr = api_get(f"/repos/{repo}/pulls/{approved_inputs['pr_number']}")
                      current_repo = pr["head"]["repo"]["full_name"]
                      current_ref = pr["head"]["ref"]
                      current_sha = pr["head"]["sha"]
                      current_is_fork = str(pr["head"]["repo"].get("fork", False)).lower()
                      current_labels = {label["name"] for label in pr.get("labels", [])}

                      if pr["state"] != "open":
                          reason = f"PR #{approved_inputs['pr_number']} is no longer open."
                      elif pr["base"]["ref"] != "main":
                          reason = f"PR #{approved_inputs['pr_number']} no longer targets main."
                      elif expected_label not in current_labels:
                          reason = (
                              f"PR #{approved_inputs['pr_number']} no longer has required approval label "
                              f"`{expected_label}`."
                          )
                      elif current_sha != approved_inputs["approved_sha"]:
                          reason = (
                              f"PR #{approved_inputs['pr_number']} head changed from approved SHA "
                              f"`{approved_inputs['approved_sha']}` to `{current_sha}`."
                          )
                      elif current_repo != approved_inputs["checkout_repository"]:
                          reason = (
                              f"PR #{approved_inputs['pr_number']} head repository changed from "
                              f"`{approved_inputs['checkout_repository']}` to `{current_repo}`."
                          )
                      elif current_ref != approved_inputs["checkout_ref"]:
                          reason = (
                              f"PR #{approved_inputs['pr_number']} head ref changed from "
                              f"`{approved_inputs['checkout_ref']}` to `{current_ref}`."
                          )
                      elif current_is_fork != approved_inputs["pr_is_fork"].lower():
                          reason = (
                              f"PR #{approved_inputs['pr_number']} fork metadata changed from "
                              f"`{approved_inputs['pr_is_fork']}` to `{current_is_fork}`."
                          )
                      else:
                          can_provision = True
                          reason = (
                              f"Approved PR #{approved_inputs['pr_number']} validated for SHA "
                              f"`{approved_inputs['approved_sha']}`; provisioning is allowed."
                          )
                          pr_is_fork = current_is_fork
                  except urllib.error.HTTPError as exc:
                      reason = (
                          f"Failed to validate approved PR #{approved_inputs['pr_number']} before provisioning: "
                          f"GitHub API returned HTTP {exc.code}."
                      )
                  except Exception as exc:  # pragma: no cover - defensive workflow guard
                      reason = (
                          f"Failed to validate approved PR #{approved_inputs['pr_number']} before provisioning: {exc}"
                      )
          else:
              reason = (
                  f"Event `{event_name}` is not allowed to provision secret-backed Hetzner runners."
              )

          write_output("can_provision", str(can_provision).lower())
          write_output("reason", reason)
          write_output("workflow_started_epoch", workflow_started_epoch)
          write_output("run_mode", run_mode)
          write_output("is_approved_pr", str(is_approved_pr).lower())
          write_output("pr_number", pr_number)
          write_output("approval_actor", approval_actor)
          write_output("approval_label", approval_label)
          write_output("pr_is_fork", pr_is_fork)
          write_output("checkout_repository", checkout_repository)
          write_output("checkout_ref", checkout_ref)
          write_output("checkout_sha", checkout_sha)

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Trusted run context\n\n")
              summary.write("| Property | Value |\n")
              summary.write("|---|---|\n")
              summary.write(f"| Event | `{event_name}` |\n")
              summary.write(f"| Run mode | `{run_mode}` |\n")
              summary.write(f"| May provision Hetzner runner | `{str(can_provision).lower()}` |\n")
              summary.write(f"| Approved PR mode | `{str(is_approved_pr).lower()}` |\n")
              summary.write(f"| PR number | `{pr_number or 'n/a'}` |\n")
              summary.write(f"| Approval actor | `{approval_actor or 'n/a'}` |\n")
              summary.write(f"| Approval label | `{approval_label or 'n/a'}` |\n")
              summary.write(f"| Checkout repository | `{checkout_repository}` |\n")
              summary.write(f"| Checkout ref | `{checkout_ref}` |\n")
              summary.write(f"| Checkout SHA | `{checkout_sha}` |\n")
              summary.write(f"| Reason | {reason} |\n")
          PY

  run-full-e2e-shards:
    name: Run full E2E shard ${{ matrix.shard_index }}/4
    needs: resolve-run-context
    if: needs.resolve-run-context.outputs.can_provision == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]
    uses: ./.github/workflows/e2e-tests-full-shard.yml
    permissions:
      contents: read
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HCLOUD_SSH_KEY_ID: ${{ secrets.HCLOUD_SSH_KEY_ID }}
    with:
      workflow-started-epoch: ${{ needs.resolve-run-context.outputs.workflow_started_epoch }}
      shard-index: ${{ matrix.shard_index }}
      shard-count: 4
      checkout-repository: ${{ needs.resolve-run-context.outputs.checkout_repository }}
      checkout-ref: ${{ needs.resolve-run-context.outputs.checkout_ref }}
      checkout-sha: ${{ needs.resolve-run-context.outputs.checkout_sha }}

  full-e2e-result:
    name: Full E2E Result
    needs: [resolve-run-context, run-full-e2e-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Update approved PR commit status
        if: ${{ needs.resolve-run-context.outputs.is_approved_pr == 'true' && needs.resolve-run-context.outputs.checkout_sha != '' && needs.resolve-run-context.outputs.checkout_repository != '' && needs.resolve-run-context.outputs.pr_is_fork != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS_REPOSITORY: ${{ needs.resolve-run-context.outputs.checkout_repository }}
          STATUS_SHA: ${{ needs.resolve-run-context.outputs.checkout_sha }}
          STATUS_STATE: ${{ needs.resolve-run-context.outputs.can_provision == 'true' && needs.run-full-e2e-shards.result == 'success' && 'success' || 'failure' }}
          STATUS_CONTEXT: Hetzner / Full E2E
          STATUS_DESCRIPTION_SUCCESS: Approved PR E2E run succeeded.
          STATUS_DESCRIPTION_FAILURE: Approved PR E2E run failed or approval became stale.
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["STATUS_REPOSITORY"]
          sha = os.environ["STATUS_SHA"]
          state = os.environ["STATUS_STATE"]
          context = os.environ["STATUS_CONTEXT"]
          description = os.environ[
              "STATUS_DESCRIPTION_SUCCESS" if state == "success" else "STATUS_DESCRIPTION_FAILURE"
          ]
          payload = {
              "state": state,
              "context": context,
              "description": description[:140],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          request = urllib.request.Request(
              f"{api_url}/repos/{repo}/statuses/{sha}",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request):
                  pass
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8")
              print(
                  f"::warning::Unable to update commit status {context!r} on {sha}: HTTP {exc.code}: {body}"
              )
          PY

      - name: Check workflow outcome
        env:
          CAN_PROVISION: ${{ needs.resolve-run-context.outputs.can_provision }}
          PR_IS_FORK: ${{ needs.resolve-run-context.outputs.pr_is_fork }}
          TRUST_REASON: ${{ needs.resolve-run-context.outputs.reason }}
          RUN_MODE: ${{ needs.resolve-run-context.outputs.run_mode }}
          RUN_RESULT: ${{ needs.run-full-e2e-shards.result }}
        run: |
          set -euo pipefail

          {
            cat <<'EOF'
          ## Full E2E workflow result

          | Job | Result |
          |---|---|
          EOF
            printf '| Run mode | `%s` |\n' "${RUN_MODE}"
            printf '| May provision Hetzner runners | `%s` |\n' "${CAN_PROVISION}"
            printf '| Approved PR is fork | `%s` |\n' "${PR_IS_FORK:-n/a}"
            printf '| Run full E2E shards (4 runners) | `%s` |\n' "${RUN_RESULT}"
            printf '\n%s\n' "${TRUST_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CAN_PROVISION" != "true" ]]; then
            echo "::error::${TRUST_REASON}"
            exit 1
          fi

          if [[ "$RUN_RESULT" != "success" ]]; then
            echo "::error::One or more full E2E shards failed or did not complete successfully."
            exit 1
          fi

          echo "Full E2E workflow completed successfully across all 4 shards."
