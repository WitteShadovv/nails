name: Full Forensics Eval

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Conservative campaign depth for the built-in live target (1-5)
        required: false
        default: '1'
        type: string
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'nails-core/**'
      - 'nails-cli/**'
      - 'nix/**'
      - 'scripts/run-forensics-eval-tests.sh'
      - 'scripts/forensics_live_scope_guard.py'
      - 'scripts/prepare-forensics-review-bundle.py'
      - '.github/workflows/forensics-eval-full.yml'
      - '.github/workflows/forensics-eval-full-shard.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: full-forensics-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approve-pr:
    name: Await Hetzner PR approval
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: hetzner-pr
    steps:
      - name: Record approval gate context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            cat <<'EOF'
          ## Hetzner PR approval

          This job is metadata-only. It does not check out or execute PR code.

          | Property | Value |
          |---|---|
          EOF
            printf "| PR | \`#%s\` |\n" "$PR_NUMBER"
            printf "| Head repository | \`%s\` |\n" "$HEAD_REPOSITORY"
            printf "| Head SHA | \`%s\` |\n" "$HEAD_SHA"
            printf "| Base branch | \`%s\` |\n" "$BASE_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-run-context:
    name: Resolve trusted run context
    needs: [approve-pr]
    if: ${{ always() && (github.event_name != 'pull_request_target' || needs.approve-pr.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      workflow_started_epoch: ${{ steps.resolve.outputs.workflow_started_epoch }}
      run_mode: ${{ steps.resolve.outputs.run_mode }}
      reason: ${{ steps.resolve.outputs.reason }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      checkout_repository: ${{ steps.resolve.outputs.checkout_repository }}
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
    steps:
      - name: Resolve trusted checkout target
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.request

          api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          output_path = os.environ["GITHUB_OUTPUT"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          workflow_started_epoch = str(int(time.time()))
          run_mode = ""
          reason = ""
          pr_number = os.environ.get("PR_NUMBER", "")
          checkout_repository = repo
          checkout_sha = os.environ["GITHUB_SHA"]

          def write_output(name, value):
              value = "" if value is None else str(value)
              with open(output_path, "a", encoding="utf-8") as fh:
                  if "\n" in value:
                      fh.write(f"{name}<<EOF\n{value}\nEOF\n")
                  else:
                      fh.write(f"{name}={value}\n")

          def api_get(path):
              request = urllib.request.Request(
                  f"{api_url}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          if event_name == "workflow_dispatch":
              run_mode = "manual"
              reason = "Trusted manual workflow_dispatch run; provisioning Hetzner-backed full forensics eval is allowed."
          elif event_name == "pull_request_target":
              if not pr_number.isdigit():
                  raise SystemExit(f"Invalid pull request number: {pr_number!r}")
              pr = api_get(f"/repos/{repo}/pulls/{pr_number}")
              if pr["state"] != "open":
                  raise SystemExit(f"PR #{pr_number} is no longer open.")
              if pr["base"]["ref"] != "main":
                  raise SystemExit(f"PR #{pr_number} no longer targets main.")
              checkout_repository = pr["head"]["repo"]["full_name"]
              checkout_sha = pr["head"]["sha"]
              run_mode = "pr"
              reason = (
                  f"Approved pull_request_target run for PR #{pr_number}; provisioning the live forensics target for the current head SHA is allowed."
              )
          else:
              raise SystemExit(
                  f"Event `{event_name}` is not allowed to provision secret-backed Hetzner runners."
              )

          write_output("workflow_started_epoch", workflow_started_epoch)
          write_output("run_mode", run_mode)
          write_output("reason", reason)
          write_output("pr_number", pr_number)
          write_output("checkout_repository", checkout_repository)
          write_output("checkout_sha", checkout_sha)

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Trusted run context\n\n")
              summary.write("| Property | Value |\n")
              summary.write("|---|---|\n")
              summary.write(f"| Event | `{event_name}` |\n")
              summary.write(f"| Run mode | `{run_mode}` |\n")
              summary.write(f"| PR number | `{pr_number or 'n/a'}` |\n")
              summary.write(f"| Checkout repository | `{checkout_repository}` |\n")
              summary.write(f"| Checkout SHA | `{checkout_sha}` |\n")
              summary.write(f"| Reason | {reason} |\n")
          PY

  run-full-forensics-eval:
    name: Run full forensics eval (live target)
    needs: [resolve-run-context, preflight-live-target]
    if: needs.resolve-run-context.result == 'success' && needs.preflight-live-target.result == 'success'
    uses: ./.github/workflows/forensics-eval-full-shard.yml
    permissions:
      contents: read
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HCLOUD_SSH_KEY_ID: ${{ secrets.HCLOUD_SSH_KEY_ID }}
    with:
      workflow-started-epoch: ${{ needs.resolve-run-context.outputs.workflow_started_epoch }}
      target: live
      iterations: ${{ needs.preflight-live-target.outputs.iterations }}
      checkout-repository: ${{ needs.resolve-run-context.outputs.checkout_repository }}
      checkout-sha: ${{ needs.resolve-run-context.outputs.checkout_sha }}

  preflight-live-target:
    name: Preflight live target scope
    needs: resolve-run-context
    if: needs.resolve-run-context.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      iterations: ${{ steps.guard.outputs.iterations }}
      resolved_leaves: ${{ steps.guard.outputs.resolved_leaves }}
    steps:
      - name: Checkout repository at exact approved SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ needs.resolve-run-context.outputs.checkout_repository }}
          ref: ${{ needs.resolve-run-context.outputs.checkout_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked out revision
        run: |
          set -euo pipefail

          expected_sha='${{ needs.resolve-run-context.outputs.checkout_sha }}'
          actual_sha="$(git rev-parse HEAD)"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Checked out SHA '$actual_sha' does not match expected '$expected_sha'."
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b
        with:
          extra_nix_config: |
            accept-flake-config = false

      - name: Setup Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c
        with:
          name: nix-community
          skipPush: true

      - name: Validate live scope and iterations
        id: guard
        env:
          REQUESTED_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.iterations || '1' }}
        run: |
          python3 ./scripts/forensics_live_scope_guard.py \
            --target live \
            --iterations "$REQUESTED_ITERATIONS" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --summary-title "Hosted live-target preflight"

  full-forensics-eval-result:
    name: Full Forensics Eval Result
    needs: [approve-pr, resolve-run-context, preflight-live-target, run-full-forensics-eval]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check workflow outcome
        env:
          APPROVAL_RESULT: ${{ needs.approve-pr.result }}
          RESOLVE_RESULT: ${{ needs.resolve-run-context.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight-live-target.result }}
          TRUST_REASON: ${{ needs.resolve-run-context.outputs.reason }}
          RUN_MODE: ${{ needs.resolve-run-context.outputs.run_mode }}
          RUN_RESULT: ${{ needs.run-full-forensics-eval.result }}
          REQUESTED_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.iterations || '1' }}
        run: |
          set -euo pipefail

          {
            cat <<'EOF'
          ## Full forensics eval workflow result

          | Job | Result |
          |---|---|
          EOF
            printf "| Run mode | \`%s\` |\n" "${RUN_MODE}"
            printf "| PR approval gate | \`%s\` |\n" "${APPROVAL_RESULT}"
            printf "| Resolve trusted run context | \`%s\` |\n" "${RESOLVE_RESULT}"
            printf "| Hosted live-target preflight | \`%s\` |\n" "${PREFLIGHT_RESULT}"
            printf "| Requested iterations | \`%s\` |\n" "${REQUESTED_ITERATIONS}"
            printf "| Run full forensics eval (\`live\` target, 1 runner) | \`%s\` |\n" "${RUN_RESULT}"
            printf "\n%s\n" "${TRUST_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RESOLVE_RESULT" != "success" ]]; then
            echo "::error::Failed to resolve a trusted checkout target."
            exit 1
          fi

          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            echo "::error::Hosted live-target preflight failed; refusing to treat this workflow as successful."
            exit 1
          fi

          if [[ "$RUN_RESULT" != "success" ]]; then
            echo "::error::Full forensics eval did not complete successfully for the live target."
            exit 1
          fi

          echo "Full forensics eval workflow completed successfully for the live target."
