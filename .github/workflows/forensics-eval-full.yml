name: Full Forensics Eval

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: full-forensics-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  trust-gate:
    name: Trust gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      reason: ${{ steps.gate.outputs.reason }}
      workflow_started_epoch: ${{ steps.gate.outputs.workflow_started_epoch }}
    steps:
      - name: Determine whether this run may use the Hetzner runner
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          trusted=false
          reason=""
          workflow_started_epoch="$(date -u +%s)"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            trusted=true
            reason="Trusted event (${EVENT_NAME}); Hetzner-backed full forensics eval is allowed."
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            reason="Pull request runs never auto-provision secret-backed Hetzner runners. Maintainers must use workflow_dispatch for trusted manual validation."
          else
            reason="Event '${EVENT_NAME}' is not allowed to provision secret-backed Hetzner runners. Use workflow_dispatch for trusted manual validation."
          fi

          {
            echo "trusted=${trusted}"
            echo "workflow_started_epoch=${workflow_started_epoch}"
            echo "reason<<EOF"
            printf '%s\n' "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            cat <<'EOF'
          ## Trust gate

          | Property | Value |
          |---|---|
          EOF
            printf '| Event | `%s` |\n' "$EVENT_NAME"
            printf '| Trusted | `%s` |\n' "$trusted"
            printf '| Reason | %s |\n' "$reason"
          } >> "$GITHUB_STEP_SUMMARY"

  run-full-forensics-eval:
    name: Run full forensics eval (live target)
    needs: trust-gate
    if: needs.trust-gate.outputs.trusted == 'true'
    uses: ./.github/workflows/forensics-eval-full-shard.yml
    permissions:
      contents: read
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HCLOUD_SSH_KEY_ID: ${{ secrets.HCLOUD_SSH_KEY_ID }}
    with:
      workflow-started-epoch: ${{ needs.trust-gate.outputs.workflow_started_epoch }}
      target: live

  full-forensics-eval-result:
    name: Full Forensics Eval Result
    needs: [trust-gate, run-full-forensics-eval]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check workflow outcome
        env:
          TRUSTED: ${{ needs.trust-gate.outputs.trusted }}
          TRUST_REASON: ${{ needs.trust-gate.outputs.reason }}
          RUN_RESULT: ${{ needs.run-full-forensics-eval.result }}
        run: |
          set -euo pipefail

          {
            cat <<'EOF'
          ## Full forensics eval workflow result

          | Job | Result |
          |---|---|
          EOF
            printf '| Trust gate | `%s` |\n' "${TRUSTED}"
            printf '| Run full forensics eval (`live` target, 1 runner) | `%s` |\n' "${RUN_RESULT}"
            printf '\n%s\n' "${TRUST_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TRUSTED" != "true" ]]; then
            echo "::error::${TRUST_REASON}"
            exit 1
          fi

          if [[ "$RUN_RESULT" != "success" ]]; then
            echo "::error::Full forensics eval did not complete successfully for the live target."
            exit 1
          fi

          echo "Full forensics eval workflow completed successfully for the live target."
