# E2E Tests for NAILS
# Runs comprehensive end-to-end tests using NixOS VM testing

name: E2E Tests

# E2E tests temporarily disabled - in-progress fixes not yet complete
# Re-enable by restoring the 'on' triggers below
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run e2e tests manually'
        required: false
        default: 'false'
  # push:
  #   branches: [main, dev]
  # pull_request:
  #   branches: [main, dev]

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Nix
        uses: cachix/install-nix-action@43082b822f2e4b696046793cdd9e9b5da14f3d75
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            accept-flake-config = true
            max-jobs = auto

      - name: Setup Cachix
        uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        with:
          name: nix-community
          skipPush: true

      - name: Run CI E2E suite
        run: nix build .#checks.x86_64-linux.e2e-ci --no-link -L

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: e2e-test-results
          path: |
            **/*.log
          retention-days: 30

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: performance-metrics
          path: |
            **/performance.txt
            **/metrics.json
          retention-days: 30
