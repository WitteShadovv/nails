# E2E Tests for NAILS
# Runs comprehensive end-to-end tests using NixOS VM testing

name: E2E Tests

# E2E tests temporarily disabled - in-progress fixes not yet complete
# Re-enable by restoring the 'on' triggers below
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run e2e tests manually'
        required: false
        default: 'false'
  # push:
  #   branches: [main, dev]
  # pull_request:
  #   branches: [main, dev]

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Nix
        uses: cachix/install-nix-action@43082b822f2e4b696046793cdd9e9b5da14f3d75
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            accept-flake-config = false
            max-jobs = auto

      - name: Setup Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c
        with:
          name: nix-community
          skipPush: true

      - name: Run CI E2E suite
        run: nix build .#checks.x86_64-linux.e2e-ci --no-link -L

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-test-results
          path: |
            **/*.log
          retention-days: 30

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-metrics
          path: |
            **/performance.txt
            **/metrics.json
          retention-days: 30
