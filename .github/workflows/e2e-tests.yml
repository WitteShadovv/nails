# E2E Tests for NAILS
# Runs the default CI critical-regression E2E subset using NixOS VM testing

name: E2E Tests

on:
  push:
    branches: [dev]
    paths:
      - 'nails-core/**'
      - 'nails-cli/**'
      - 'nix/**'
      - 'scripts/run-e2e-tests.sh'
      - '.github/workflows/e2e-tests.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [dev]
    paths:
      - 'nails-core/**'
      - 'nails-cli/**'
      - 'nix/**'
      - 'scripts/run-e2e-tests.sh'
      - '.github/workflows/e2e-tests.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run e2e tests manually'
        required: false
        default: 'false'

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            accept-flake-config = false
            max-jobs = auto

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: nix-community
          skipPush: true

      - name: Run CI critical E2E suite
        env:
          NAILS_E2E_DEFAULT_TARGET: ci
          NAILS_E2E_VM_CPU_TARGET_PERCENT: '100'
          NAILS_E2E_VM_HOST_RESERVED_CORES: '0'
        run: ./scripts/run-e2e-tests.sh --verbose

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-test-results
          path: |
            **/*.log
          retention-days: 30

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: performance-metrics
          path: |
            **/performance.txt
            **/metrics.json
          retention-days: 30
