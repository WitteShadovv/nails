# E2E Tests for NAILS
# Runs comprehensive end-to-end tests using NixOS VM testing

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            accept-flake-config = true
            max-jobs = auto

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPushArgs: --view-store nix-community

      - name: Check Nix flake
        run: nix flake check

      - name: Run E2E tests
        run: nix build .#checks.x86_64-linux.e2e-all --no-link -L

      - name: Upload test results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            result
            **/*.log
          retention-days: 30

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-metrics
          path: |
            **/performance.txt
            **/metrics.json
          retention-days: 30
