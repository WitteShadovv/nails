# zizmor configuration, read by `zizmor .github` and by the zizmor check in
# nix/checks.nix.
rules:
  unpinned-uses:
    config:
      policies:
        # The SLSA generator must be referenced by its release tag: it
        # verifies that ref when it generates provenance.
        slsa-framework/slsa-github-generator/*: ref-pin
        "*": hash-pin

  # Findings that predate the zizmor check, ignored per file because these
  # workflows are being rewritten. Delete an entry once its file is fixed or
  # gone; never add one for new code.
  artipacked:
    ignore:
      - forensics-eval-regression.yml
  dependabot-cooldown:
    ignore:
      - dependabot.yml
  superfluous-actions:
    ignore:
      - release-core.yml
  template-injection:
    ignore:
      - release-core.yml
