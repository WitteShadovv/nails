# cargo-deny configuration for dependency management
#
# cargo-deny is a tool for managing Rust dependency policies:
# - Blocklist: Prevent specific crates from being used
# - Allowlist: Only permit specific crates/versions
# - Advisory DB: Track known vulnerabilities and license issues
#
# This file is a placeholder for future dependency policy enforcement.
# Uncomment and configure sections as needed.
#
# Installation: cargo install cargo-deny
# Usage: cargo deny check

# [advisories]
# # Fail build if vulnerabilities are found
# vulnerability = "deny"
#
# # Warn on yanked crates
# yanked = "warn"
#
# [bans]
# # Multiple versions allowed (workspace manages consistency)
# multiple-versions = "allow"
#
# # Direct dependencies only for some crates
# # skip = ["tempfile"]
#
# [licenses]
# # Allow only permissive licenses
# allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause"]
#
# # Unlicense is not allowed
# deny = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]
#
# # Copyleft licenses require explicit allowance
# copyleft = "warn"
#
# [sources]
# # Require crates from specific sources
# unknown = "deny"
