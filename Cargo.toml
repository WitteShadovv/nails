[workspace]
members = ["nails-cli", "nails-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["NAILS Project"]
license = "AGPL-3.0"
homepage = "https://github.com/nails-project/nails"
repository = "https://github.com/nails-project/nails"

[workspace.dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Testing (for workspace-level consistency)
assert_cmd = "2.0"
predicates = "3.1"
