[workspace]
members = ["nails-cli", "nails-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["NAILS Project"]
license = "AGPL-3.0"
homepage = "https://github.com/nails-project/nails"
repository = "https://github.com/nails-project/nails"

[workspace.dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Error handling (AR6, AR7)
thiserror = "1.0"
anyhow = "1.0"

# Logging (AR8)
tracing = "0.1"
tracing-subscriber = "0.3"

# Filesystem operations (AR9)
nix = { version = "0.29", features = ["mount"] }

# Serialization (AR10)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing (for workspace-level consistency)
assert_cmd = "2.0"
predicates = "3.1"
