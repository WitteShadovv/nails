[package]
name = "nails"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["NAILS Project"]
license = "AGPL-3.0"
description = "NixOS Anti-forensics Isolation & Layering System"
homepage = "https://github.com/nails-project/nails"
repository = "https://github.com/nails-project/nails"
readme = "README.md"
keywords = ["nixos", "anti-forensics", "security", "privacy", "veracrypt"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging
log = "0.4"
env_logger = "0.11"

# System operations
nix = { version = "0.29", features = ["mount", "process", "signal"] }
libc = "0.2"

# Filesystem operations
walkdir = "2.5"
tempfile = "3.10"

# Time and date
chrono = { version = "0.4", features = ["serde"] }

# Process management
procfs = "0.16"

[dev-dependencies]
# Testing
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
proptest = "1.4"  # Property-based testing for state machine validation

# Benchmarking
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "nails"
path = "src/main.rs"

[lib]
name = "nails"
path = "src/lib.rs"
