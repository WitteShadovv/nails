[workspace]
members = ["nails-cli", "nails-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["NAILS Project"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/WitteShadovv/nails"
repository = "https://github.com/WitteShadovv/nails"

[workspace.dependencies]
# CLI and argument parsing
clap = { version = "4.6.0", features = ["derive", "cargo"] }

# Error handling (AR6, AR7)
thiserror = "2.0"

# Logging (AR8)
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["json"] }

# Filesystem operations (AR9)
nix = { version = "0.30.1", features = ["mount", "sched"] }

# Serialization (AR10)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.22"

# Date and time (AR10 - for state timestamps)
chrono = { version = "0.4", features = ["serde"] }

# Atomic file operations (NFR13)
tempfile = "3.10"

# Colored terminal output (UXR5)
colored = "3.1.1"

# Cryptographic hashing (state file checksum)
sha2 = "0.10"
hex = "0.4"

# Testing (for workspace-level consistency)
assert_cmd = "2.2.1"
predicates = "3.1.3"

[profile.release]
strip = true
lto = true
