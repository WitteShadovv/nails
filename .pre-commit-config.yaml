exclude: (hardware-configuration\.nix|flake\.lock)$

repos:
  # General file formatting and checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first
      - id: check-symlinks

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: .*\.lock$|^\.secrets\.baseline$
        additional_dependencies: ["pyyaml", "gibberish-detector"]

  # Local hooks for Nix and project-specific checks
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt (Nix formatter)
        entry: nixfmt
        language: system
        files: \.nix$

      - id: nix-syntax-check
        name: nix syntax check
        entry: bash
        language: system
        files: \.nix$
        exclude: '.*/tmp-.*\.nix$'
        args:
          - -c
          - 'for file in "$@"; do nix-instantiate --parse "$file" > /dev/null || exit 1; done'
          - --

      - id: deadnix
        name: deadnix (remove dead Nix code)
        entry: deadnix
        language: system
        files: \.nix$
        exclude: '.*/tmp-.*\.nix$'
        args: [--fail]

      - id: statix
        name: statix (Nix linter)
        entry: bash
        language: system
        files: \.nix$
        exclude: '.*/tmp-.*\.nix$|hardware-configuration\.nix'
        args:
          - -c
          - 'for file in "$@"; do statix check "$file" || exit 1; done'
          - --

      - id: nix-store-check
        name: check for hard-coded store paths
        entry: bash
        language: system
        files: '.*\.nix$'
        exclude: '.*/tmp-.*\.nix$|^docs/.*$' # Allow store paths in docs (examples)
        args:
          - -c
          - 'for file in "$@"; do if grep -q "/nix/store" "$file"; then echo "Hard-coded store paths found in $file!"; exit 1; fi; done'
          - --

      - id: shell-script-check
        name: shellcheck
        entry: shellcheck
        language: system
        files: '.*\.sh$'
        args: [-e, SC1091, -e, SC2034]

      - id: nails-config-validation
        name: validate NAILS configuration files
        entry: bash
        language: system
        files: '(configuration|hardware-configuration)\.nix$'
        args:
          - -c
          - |
            for file in "$@"; do
              echo "Validating NAILS config: $file"
              # Basic syntax check
              nix-instantiate --parse "$file" > /dev/null || exit 1

              # Check for common security issues in configs
              if grep -q "openssh.*enable.*true" "$file"; then
                echo "Warning: SSH is enabled in $file - consider security implications"
              fi

              if grep -q "firewall.*enable.*false" "$file"; then
                echo "Warning: Firewall is disabled in $file - consider security implications"
              fi
            done
          - --

      # Rust testing and quality checks (TDD enforcement)
      # Security auditing: Scans Cargo.lock for known vulnerabilities (AR50)
      # Fails on high/critical severity vulnerabilities before commit
      - id: cargo-audit
        name: Cargo Security Audit
        entry: cargo audit
        language: system
        pass_filenames: false

      - id: rust-fmt
        name: Format Rust code
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-clippy
        name: Lint Rust code with clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-test
        name: Run Rust tests
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: rust-coverage
        name: Enforce 85% Test Coverage (TDD)
        entry: bash
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
        args:
          - -c
          - |
            echo "🔍 Checking test coverage (85% required)..."

            # Function to run coverage and produce cobertura XML
            run_coverage() {
              mkdir -p /tmp/nails-coverage
              cargo llvm-cov --workspace --all-features --all-targets \
                --cobertura --output-path /tmp/nails-coverage/cobertura.xml 2>&1
            }

            # Check if we're already in nix-shell (IN_NIX_SHELL env var is set)
            if [ -n "$IN_NIX_SHELL" ]; then
              coverage_output=$(run_coverage)
              coverage_status=$?
            else
              # Not in nix-shell, so enter it
              coverage_output=$(nix-shell --run 'bash -c '"'"'
                mkdir -p /tmp/nails-coverage
                cargo llvm-cov --workspace --all-features --all-targets \
                  --cobertura --output-path /tmp/nails-coverage/cobertura.xml 2>&1
              '"'"'')
              coverage_status=$?
            fi

            if [ $coverage_status -ne 0 ]; then
              echo "❌ Coverage check failed"
              echo "$coverage_output"
              exit 1
            fi

            # Extract line coverage from cobertura XML (same method as CI)
            COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' /tmp/nails-coverage/cobertura.xml | head -1)
            if [ -z "$COVERAGE" ]; then
              echo "❌ Could not parse coverage percentage from cobertura XML"
              echo "$coverage_output"
              exit 1
            fi
            line_coverage=$(echo "$COVERAGE * 100" | bc)

            # Check if coverage meets threshold (85%)
            if (( $(echo "$line_coverage < 85" | bc -l) )); then
              echo "❌ Test coverage below 85% (current: ${line_coverage}%) - commit blocked"
              echo "💡 Run 'nix-shell --run \"cargo llvm-cov --html\"' to see detailed coverage report"
              exit 1
            fi

            echo "✅ Test coverage: ${line_coverage}%"

      # Conventional commit message validation (AR20, AR21, AR22)
      # Ensures commits follow "<type>[optional scope]: <description>" format
      - id: commit-msg
        name: Validate Conventional Commits
        entry: bash
        language: system
        stages: [commit-msg]
        pass_filenames: false
        args:
          - -c
          - |
            commit_msg_file=.git/COMMIT_EDITMSG
            if [ ! -f "$commit_msg_file" ]; then
              echo "Error: Commit message file not found"
              exit 1
            fi

            commit_msg=$(cat "$commit_msg_file" | head -1)

            # Pattern: <type>[optional scope]: <description>
            if ! echo "$commit_msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+$'; then
              echo "❌ Invalid commit message format"
              echo ""
              echo "Expected format: <type>[optional scope]: <description>"
              echo ""
              echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              echo ""
              echo "Examples:"
              echo "  feat(story-1.5): add pre-commit hooks"
              echo "  fix: correct state machine transition"
              echo "  docs: update README with installation steps"
              echo ""
              exit 1
            fi

# CI-specific configuration
ci:
  autofix_prs: false
  autoupdate_schedule: monthly
