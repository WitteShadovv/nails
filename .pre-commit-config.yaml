default_install_hook_types: [pre-commit, commit-msg, pre-push]

exclude: (hardware-configuration\.nix|flake\.lock)$

repos:
  # General file formatting and checks (fast, offline, changed files only)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Kernel fixtures are verbatim /proc captures (the kernel writes trailing
      # tabs and spaces), the screenshots are generated CLI output, checked
      # against a fresh generation, and fuzz seeds are inputs byte for byte:
      # none may be normalised.
      - id: trailing-whitespace
        exclude: ^(nails-base/tests/fixtures/kernel/|docs/assets/screenshots/|fuzz/seeds/)
      - id: end-of-file-fixer
        exclude: ^(nails-base/tests/fixtures/kernel/|docs/assets/screenshots/|fuzz/seeds/)
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks

  # Secret detection. Fuzz seeds are raw inputs, random tokens among them,
  # where no allowlist pragma can go.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (.*\.lock|^fuzz/seeds/.*|^nails-base/src/state/golden/.*|^nix/distro-tests/images\.json$|^ci/tests/test_distro_images\.py$)$
        additional_dependencies: ["pyyaml", "gibberish-detector"]

  # Local hooks for Nix, shell and project-specific checks
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt (Nix formatter)
        entry: nixfmt
        language: system
        files: \.nix$

      - id: deadnix
        name: deadnix (remove dead Nix code)
        entry: deadnix
        language: system
        files: \.nix$
        exclude: '.*/tmp-.*\.nix$'
        args: [--fail]

      - id: statix
        name: statix (Nix linter)
        entry: bash
        language: system
        files: \.nix$
        exclude: '.*/tmp-.*\.nix$|hardware-configuration\.nix'
        args:
          - -c
          - 'for file in "$@"; do statix check "$file" || exit 1; done'
          - --

      - id: nix-store-check
        name: check for hard-coded store paths
        entry: bash
        language: system
        files: '.*\.nix$'
        exclude: '.*/tmp-.*\.nix$|^docs/.*$' # Allow store paths in docs (examples)
        args:
          - -c
          # A store path with its hash pins one build; the bare /nix/store
          # directory (a mount point in the VM tests) is fine.
          - 'for file in "$@"; do if grep -qE "/nix/store/[0-9a-z]{32}-" "$file"; then echo "Hard-coded store paths found in $file!"; exit 1; fi; done'
          - --

      - id: shell-script-check
        name: shellcheck
        entry: shellcheck
        language: system
        files: '.*\.sh$'
        args: [-e, SC1091, -e, SC2034]

      # SPDX/REUSE licensing compliance: every file must carry copyright and
      # licence information (via a header or REUSE.toml). Scans the whole tree.
      - id: reuse
        name: reuse lint (SPDX/REUSE compliance)
        entry: reuse lint
        language: system
        pass_filenames: false
        always_run: true

      # Link-check the Markdown docs and reject retired names. Runs whenever a
      # Markdown file or the checker itself changes; it scans the whole doc set,
      # so the changed file names are not passed through.
      - id: docs-check
        name: docs link check and retired-name guard
        entry: scripts/docs-check.sh
        language: system
        files: '(\.md$|^scripts/docs-check\.sh$)'
        pass_filenames: false

      - id: nails-config-validation
        name: validate NAILS configuration files
        entry: bash
        language: system
        files: '(configuration|hardware-configuration)\.nix$'
        args:
          - -c
          - |
            for file in "$@"; do
              echo "Validating NAILS config: $file"
              # Basic syntax check
              nix-instantiate --parse "$file" > /dev/null || exit 1

              # Check for common security issues in configs
              if grep -q "openssh.*enable.*true" "$file"; then
                echo "Warning: SSH is enabled in $file - consider security implications"
              fi

              if grep -q "firewall.*enable.*false" "$file"; then
                echo "Warning: Firewall is disabled in $file - consider security implications"
              fi
            done
          - --

      # Rust formatting, of the workspace and the fuzz crate, is checked
      # (never rewritten) on every commit; the heavier lint and test gate runs
      # on push through `just check` below.
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: just fmt-check
        language: system
        types: [rust]
        pass_filenames: false

      # Rust file size limits: the script `just check` and CI run, well under
      # a second, so it can run on every commit that touches Rust.
      - id: check-line-count
        name: Rust file size limits
        entry: scripts/check-line-count.sh
        language: system
        types: [rust]
        pass_filenames: false

      # Every fuzz target is wired into fuzz/Cargo.toml and has a seed corpus;
      # the same check `just check` runs, offline and well under a second, only
      # when a fuzz target, a seed corpus or the manifest changes.
      - id: check-fuzz-targets
        name: Fuzz targets wired and seeded
        entry: scripts/check-fuzz-targets.sh
        language: system
        pass_filenames: false
        files: ^(fuzz/|scripts/check-fuzz-targets\.sh$)

      # Every deny.toml advisory ignore needs a current "# expires:" date;
      # this is offline and only runs when deny.toml changes.
      - id: deny-ignores
        name: deny.toml ignore expiry
        entry: python3 ci/deny_ignores.py
        language: system
        pass_filenames: false
        files: ^deny\.toml$

      # Push gate: formatting, clippy, file sizes and the full test suite.
      - id: just-check
        name: just check (fmt, lint, line-count, test)
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Conventional commit message validation. Ensures commits follow
      # "<type>[optional scope]: <description>" format.
      - id: commit-msg
        name: Validate Conventional Commits
        entry: bash
        language: system
        stages: [commit-msg]
        args:
          - -c
          - |
            commit_msg_file="$1"
            if [ -z "$commit_msg_file" ] || [ ! -f "$commit_msg_file" ]; then
              echo "Error: Commit message file not found"
              exit 1
            fi

            IFS= read -r commit_msg < "$commit_msg_file"

            # Pattern: <type>[optional scope]: <description>
            if ! echo "$commit_msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+$'; then
              echo "❌ Invalid commit message format"
              echo ""
              echo "Expected format: <type>[optional scope]: <description>"
              echo ""
              echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
              echo ""
              echo "Examples:"
              echo "  feat(config): add TOML loader"
              echo "  fix: correct state machine transition"
              echo "  docs: update README with installation steps"
              echo ""
              exit 1
            fi
          - --
