name: Oracle nightly

# A TEMPLATE, not a workflow: it is not installed under .github/workflows, so
# GitHub never runs it. The oracle runs in CI are in
# .github/workflows/oracle-real-nightly.yml: over the decoy images of the
# oracle-images E2E test, and (its scan-btrfs job) over these synthetic btrfs
# images. plaso cannot open btrfs, so on them no timeline runs and the verdict
# is partial, never clean, which run-scan.sh passes and says so (see
# ci/oracle/README.md).
#
# Nightly forensic oracle. On GitHub-hosted runners (no KVM): the scan script
# builds the synthetic btrfs before, control and after images one at a time
# (streaming, so peak disk is one image's worth), runs the restore carve and
# bulk_extractor over each, and finishes by rendering the nails-oracle verdict
# over the outputs. It passes only on a partial verdict that names the
# timeline, plaso's, as the one channel left out and finds nothing else wrong:
# unexplained residue, a blind scan, a missing canary or a bad allowlist fails
# the run. A
# schedule fires only on the default branch; a workflow_dispatch runs it by
# hand.

on:
  schedule:
    # Nightly at 04:30 UTC, after the E2E (02:17) and distro (03:41) runs.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: oracle-nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  oracle:
    name: Forensic oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: oracle
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the verdict tool
        run: cargo build --release --locked -p nails-oracle

      # OS packages the scan needs. The scan script pins bulk_extractor (built
      # from its source commit, so its build chain and libraries are installed
      # here), builds and carves the btrfs images with btrfs-progs, and reads
      # the verdict it renders with jq. sleuthkit (mmls), e2fsprogs (debugfs)
      # and sqlite3 serve the real-image mode (ORACLE_IMAGES_DIR), which this
      # template does not use. No docker: no plaso timeline runs on btrfs. No
      # KVM is used.
      - name: Install analysis tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            btrfs-progs sleuthkit e2fsprogs jq sqlite3 \
            git autoconf automake build-essential libtool pkg-config flex \
            libssl-dev zlib1g-dev libexpat1-dev libre2-dev \
            libabsl-dev libgcrypt20-dev libgpg-error-dev

      # The scan script builds the before/control/after images one at a time,
      # runs btrfs restore and bulk_extractor over each into the outputs/ tree
      # described in ci/oracle/README.md, and finishes by rendering the
      # nails-oracle verdict over that tree (writing verdict.json). The
      # verdict on btrfs images is partial at best (exit 3), which the script
      # passes, exiting 0, only when verdict.json says partial and names the
      # timeline alone as left out; anything else fails this step. It needs
      # root for the loop mounts. The coverage canary is the fixed committed
      # value; set ORACLE_SEED here to rotate it per run instead.
      - name: Build images, run the scan and render the verdict
        run: |
          sudo env \
            "ORACLE_BIN=$PWD/target/release/nails-oracle" \
            ci/oracle/run-scan.sh "$RUNNER_TEMP/oracle"

      - name: Show the verdict
        if: ${{ !cancelled() }}
        run: |
          cat "$RUNNER_TEMP/oracle/verdict.json" 2>/dev/null \
            || echo "(no verdict.json: the scan did not reach the verdict)"

      # The artifact holds the scan's outputs and no file of this runner. A
      # restore tree keeps the image's symlinks, absolute ones included, and
      # the upload follows a symlink to whatever its target names here, so the
      # outputs go up as one tar, which stores a symlink as a symlink. tar runs
      # as root because a restore tree can carry root-only modes, and the
      # archive is then handed to the runner user. The bulk_extractor build
      # stays out of the artifact.
      - name: Pack the verdict and analysis outputs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/oracle"
          dest="$RUNNER_TEMP/oracle-artifact"
          mkdir -p "$dest"
          if [ -f "$src/verdict.json" ]; then
            cp "$src/verdict.json" "$dest/verdict.json"
          fi
          if [ -d "$src/outputs" ]; then
            sudo tar -czf "$dest/outputs.tar.gz" -C "$src" outputs
            sudo chown "$(id -u):$(id -g)" "$dest/outputs.tar.gz"
          fi
          ls -la "$dest"

      - name: Upload the verdict and analysis outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-verdict
          path: ${{ runner.temp }}/oracle-artifact/

  # Runs of main are unattended: a red verdict opens or comments on the 'CI
  # red: Oracle nightly' issue, and the next green run closes it. A dispatch
  # on another branch reports nothing, so it can neither close nor comment on
  # the issue of main's nightly.
  report-status:
    name: Report status
    needs: oracle
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on and close the tracking issue

    steps:
      - name: Checkout the report action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/report-status

      - name: Report status
        uses: ./.github/actions/report-status
        with:
          needs: ${{ toJSON(needs) }}
